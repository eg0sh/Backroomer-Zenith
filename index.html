<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arion · Статус проекта</title>
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 50% 20%, #141c28, #070a0e);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            min-height: 100vh;
            padding: 24px 24px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
        }

        /* ----- scrollbar ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7a8f;
        }

        /* ----- header ----- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 16px;
        }

        .header-left h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f7e05e, #f5b041, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px rgba(245, 176, 65, 0.25), 0 0 120px rgba(245, 176, 65, 0.1);
            margin: 0;
            animation: glow-title 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
        }

        @keyframes glow-title {
            0% {
                text-shadow: 0 0 40px rgba(245, 176, 65, 0.2), 0 0 80px rgba(245, 176, 65, 0.05);
            }
            100% {
                text-shadow: 0 0 70px rgba(245, 176, 65, 0.4), 0 0 140px rgba(245, 176, 65, 0.15);
            }
        }

        .header-left h1::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #f5b041, transparent);
            border-radius: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(245, 176, 65, 0.15);
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s;
        }

        .stat-badge:hover {
            border-color: rgba(245, 176, 65, 0.4);
        }

        .stat-badge .num {
            font-weight: 700;
            font-size: 18px;
            color: #f5b041;
        }
        .stat-badge .num.green {
            color: #4cd9a0;
        }
        .stat-badge .label {
            color: #8a9bb5;
            font-weight: 400;
        }

        .update-time {
            font-size: 13px;
            color: #8a9bb5;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.4;
            background: rgba(20, 28, 40, 0.6);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .update-time .time-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .update-time .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cd9a0;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76, 217, 160, 0.4);
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* ----- timeline ----- */
        .timeline-wrapper {
            background: rgba(17, 24, 34, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 28px;
            position: relative;
            box-shadow: 0 12px 60px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(245, 176, 65, 0.02);
            overflow: hidden; /* чтобы скрыть вылезающие части, если что */
        }

        .timeline-track {
            position: relative;
            height: 100px;
            width: 100%;
            padding: 0 3%; /* отступы для крайних кружков */
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 3%;
            right: 3%;
            height: 5px;
            background: linear-gradient(90deg, #4a5a6e, #6a7a8e);
            border-radius: 4px;
            transform: translateY(-50%);
            z-index: 1;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05), inset 0 0 8px rgba(0, 0, 0, 0.5);
        }

        .timeline-line .phase-fill {
            height: 100%;
            border-radius: 4px;
            position: absolute;
            left: 0;
            top: 0;
            background: linear-gradient(90deg, #f5b041, #e67e22);
            box-shadow: 0 0 30px rgba(245, 176, 65, 0.6), 0 0 60px rgba(245, 176, 65, 0.2);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        .timeline-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            background: #1a2332;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
            will-change: transform;
        }

        .timeline-dot .dot-pct {
            font-size: 17px;
            line-height: 1.1;
        }

        .timeline-dot .dot-label {
            font-size: 9px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            opacity: 0.8;
            margin-top: 1px;
            text-align: center;
            max-width: 56px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .timeline-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .timeline-dot.done {
            background: linear-gradient(135deg, #2b6a9e, #1d4a7a);
            border-color: #4a8ec4;
            box-shadow: 0 0 30px rgba(42, 106, 158, 0.4), inset 0 0 20px rgba(74, 142, 196, 0.2);
        }

        .timeline-dot.active {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border-color: #e74c3c;
            box-shadow: 0 0 50px rgba(231, 76, 60, 0.6), inset 0 0 30px rgba(231, 76, 60, 0.3);
            animation: pulse-red 1.8s ease-in-out infinite;
        }

        .timeline-dot.active::after {
            border-color: rgba(231, 76, 60, 0.3);
            animation: ring-pulse 1.8s ease-in-out infinite;
        }

        .timeline-dot.pending {
            background: linear-gradient(135deg, #2a3a4e, #1a2332);
            border-color: #3a4a5e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .timeline-dot:hover {
            transform: translate(-50%, -50%) scale(1.12);
            z-index: 5;
        }

        @keyframes pulse-red {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(231, 76, 60, 0.4), 0 0 60px rgba(231, 76, 60, 0.2);
            }
            50% {
                box-shadow: 0 0 70px rgba(231, 76, 60, 0.7), 0 0 120px rgba(231, 76, 60, 0.3);
            }
        }

        @keyframes ring-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* tooltip – теперь не выходит за границы */
        .timeline-dot .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 34, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #e8edf5;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            z-index: 10;
            max-width: 200px;
            white-space: normal;
            word-break: break-word;
            text-align: center;
            line-height: 1.3;
        }

        .timeline-dot:hover .tooltip {
            display: block;
        }

        /* корректировка для крайних точек, чтобы подсказка не улетала */
        .timeline-dot:first-child .tooltip {
            left: 0;
            transform: translateX(0);
        }
        .timeline-dot:last-child .tooltip {
            left: auto;
            right: 0;
            transform: translateX(0);
        }

        /* ----- info panel (по клику на кружок) ----- */
        .info-panel {
            margin-top: 18px;
            background: rgba(20, 28, 40, 0.7);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 22px;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 40px rgba(245, 176, 65, 0.02);
        }

        .info-panel .info-placeholder {
            color: #5a6a7e;
            font-size: 14px;
        }

        .info-panel .info-name {
            font-size: 20px;
            font-weight: 600;
            color: #f5b041;
            text-shadow: 0 0 30px rgba(245, 176, 65, 0.15);
        }

        .info-panel .info-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #b0c4de;
        }

        .info-panel .info-details .detail-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .info-panel .info-details .detail-item .label {
            color: #5a6a7e;
        }

        /* ----- нижняя секция: фазы с плашками ----- */
        .phases-section {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .phase-block {
            background: rgba(17, 24, 34, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px 22px 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 0 60px rgba(245, 176, 65, 0.01);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .phase-block:hover {
            border-color: rgba(245, 176, 65, 0.15);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.4), inset 0 0 80px rgba(245, 176, 65, 0.02);
        }

        .phase-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .phase-header .phase-title {
            font-size: 18px;
            font-weight: 600;
            color: #d0dcec;
            letter-spacing: 0.2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.03);
        }

        .phase-header .phase-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #8a9bb5;
        }

        .phase-header .phase-meta span {
            background: rgba(20, 28, 40, 0.8);
            padding: 2px 12px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .phase-header .phase-progress {
            font-size: 14px;
            font-weight: 500;
            color: #f5b041;
            background: rgba(20, 28, 40, 0.8);
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(245, 176, 65, 0.1);
        }

        .phase-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .phase-card {
            background: rgba(20, 28, 40, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            flex: 0 1 auto;
            min-width: 180px;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .phase-card:hover {
            border-color: rgba(245, 176, 65, 0.3);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 40px rgba(245, 176, 65, 0.03);
        }

        .phase-card .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .phase-card .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #d0dcec;
        }

        .phase-card .card-pct {
            font-size: 16px;
            font-weight: 700;
            color: #f5b041;
        }

        .phase-card .card-pct.done {
            color: #4cd9a0;
        }
        .phase-card .card-pct.pending {
            color: #5a6a7e;
        }

        .phase-card .card-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 6px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
        }

        .phase-card .card-status-dot.done {
            background: #4cd9a0;
            box-shadow: 0 0 16px rgba(76, 217, 160, 0.3);
        }
        .phase-card .card-status-dot.active {
            background: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .phase-card .card-status-dot.pending {
            background: #3a4a5e;
        }

        .phase-card .card-meta {
            font-size: 11px;
            color: #5a6a7e;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .phase-card .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ----- модальное окно для деталей подэтапа ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: rgba(17, 24, 34, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(245, 176, 65, 0.02);
            animation: modal-in 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: #f5b041;
            margin-bottom: 16px;
            text-shadow: 0 0 40px rgba(245, 176, 65, 0.1);
        }

        .modal .modal-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            color: #b0c4de;
        }

        .modal .modal-body .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .modal .modal-body .row .key {
            color: #5a6a7e;
            flex-shrink: 0;
            margin-right: 12px;
        }

        .modal .modal-body .row .value {
            font-weight: 500;
            color: #d0dcec;
            text-align: right;
            word-break: break-word;
        }

        .modal .modal-body .row .value.dependencies {
            font-weight: 400;
            color: #8a9bb5;
            font-size: 13px;
        }

        .modal .modal-close {
            margin-top: 20px;
            background: rgba(26, 35, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #b0c4de;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .modal .modal-close:hover {
            background: rgba(42, 58, 78, 0.8);
            border-color: rgba(245, 176, 65, 0.2);
        }

        /* ----- responsive ----- */
        @media (max-width: 820px) {
            body {
                padding: 16px 12px 30px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left h1 {
                font-size: 38px;
            }
            .header-right {
                justify-content: flex-start;
                gap: 12px;
            }
            .timeline-track {
                height: 80px;
                padding: 0 2%;
            }
            .timeline-dot {
                width: 52px;
                height: 52px;
            }
            .timeline-dot .dot-pct {
                font-size: 14px;
            }
            .timeline-dot .dot-label {
                font-size: 7px;
                max-width: 44px;
            }
            .info-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                padding: 12px 16px;
            }
            .info-panel .info-details {
                flex-direction: column;
                gap: 4px;
            }
            .phase-header .phase-title {
                font-size: 16px;
            }
            .phase-header .phase-meta {
                font-size: 12px;
                gap: 8px;
                flex-wrap: wrap;
            }
            .phase-cards {
                flex-direction: column;
            }
            .phase-card {
                max-width: 100%;
                min-width: 0;
            }
            .modal {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            .header-left h1 {
                font-size: 30px;
            }
            .stat-badge {
                padding: 4px 12px;
                font-size: 12px;
            }
            .stat-badge .num {
                font-size: 15px;
            }
            .timeline-track {
                height: 70px;
                padding: 0 1%;
            }
            .timeline-dot {
                width: 44px;
                height: 44px;
            }
            .timeline-dot .dot-pct {
                font-size: 12px;
            }
            .timeline-dot .dot-label {
                font-size: 6px;
                max-width: 36px;
            }
            .phase-block {
                padding: 12px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <h1>Arion</h1>
            </div>
            <div class="header-right">
                <div class="stat-badge">
                    <span class="label">Общий прогресс</span>
                    <span class="num gold" id="totalProgress">0%</span>
                </div>
                <div class="stat-badge">
                    <span class="label">Завершено</span>
                    <span class="num green" id="completedCount">0</span>
                    <span class="label">/ <span id="totalCount">0</span></span>
                </div>
                <div class="update-time">
                    <div class="time-row">
                        <span class="dot"></span>
                        <span>Текущее время: <span id="lastUpdate">—</span></span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== TIMELINE ===== -->
        <div class="timeline-wrapper">
            <div class="timeline-track" id="timelineTrack">
                <div class="timeline-line" id="timelineLine">
                    <div class="phase-fill" id="phaseFill"></div>
                </div>
                <!-- dots будут вставлены JS -->
            </div>

            <!-- info panel (по клику на кружок фазы) -->
            <div class="info-panel" id="infoPanel">
                <span class="info-placeholder">Нажмите на кружок этапа, чтобы увидеть информацию</span>
                <span class="info-name" id="infoName" style="display:none;"></span>
                <div class="info-details" id="infoDetails" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== PHASES SECTION ===== -->
        <div class="phases-section" id="phasesContainer">
            <!-- rendered by JS -->
        </div>

        <!-- ===== MODAL ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-title" id="modalTitle">Название</div>
                <div class="modal-body" id="modalBody">
                    <!-- dynamic rows -->
                </div>
                <button class="modal-close" id="modalClose">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATA (редактируйте здесь)
        // ============================================================

        // Фазы (порядок определяет расстояние на шкале)
        const phases = [{
            id: 'p1',
            label: 'Разведка и бурение',
            startDate: '2026-08-16',
            endDate: null,
            budget: '$500 млн',
        }, {
            id: 'p2',

        // ============================================================
        //  HELPERS
        // ============================================================

        function getPhaseById(id) {
            return phases.find(p => p.id === id);
        }

        function getSubsByPhase(phaseId) {
            return subPhases.filter(s => s.phaseId === phaseId);
        }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getOverallProgress() {
            if (!subPhases.length) return 0;
            const sum = subPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subPhases.length);
        }

        function getCompletedCount() {
            return subPhases.filter(s => s.pct >= 100).length;
        }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getSubName(id) {
            const sub = subPhases.find(s => s.id === id);
            return sub ? sub.name : id;
        }

        // ============================================================
        //  RENDER
        // ============================================================

        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            const n = phases.length;
            const leftMargin = 3; // %
            const rightMargin = 3;
            const range = 100 - leftMargin - rightMargin;

            phases.forEach((phase, index) => {
                const progress = getPhaseProgress(phase.id);
                const status = getStatusInfo(progress);
                const x = leftMargin + (index / (n - 1)) * range;

                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = x + '%';
                dot.dataset.phaseId = phase.id;

                const pctSpan = document.createElement('span');
                pctSpan.className = 'dot-pct';
                pctSpan.textContent = progress + '%';
                dot.appendChild(pctSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'dot-label';
                labelSpan.textContent = phase.label.split(' ')[0];
                dot.appendChild(labelSpan);

                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = phase.label + ' (' + progress + '%)';
                dot.appendChild(tooltip);

                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showPhaseInfo(phase.id);
                });

                track.appendChild(dot);
            });

            const fill = document.getElementById('phaseFill');
            const overall = getOverallProgress();
            fill.style.width = overall + '%';
        }

        function showPhaseInfo(phaseId) {
            const phase = getPhaseById(phaseId);
            if (!phase) return;

            const panel = document.getElementById('infoPanel');
            const placeholder = panel.querySelector('.info-placeholder');
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');

            placeholder.style.display = 'none';
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';

            nameEl.textContent = phase.label;

            const progress = getPhaseProgress(phaseId);
            const subs = getSubsByPhase(phaseId);
            const completed = subs.filter(s => s.pct >= 100).length;
            const start = formatDate(phase.startDate);
            const end = formatDate(phase.endDate);
            const budget = phase.budget || '—';

            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">Прогресс:</span> ${progress}%</div>
                <div class="detail-item"><span class="label">Подэтапов:</span> ${subs.length}</div>
                <div class="detail-item"><span class="label">Завершено:</span> ${completed}</div>
                <div class="detail-item"><span class="label">Начало:</span> ${start}</div>
                <div class="detail-item"><span class="label">Окончание:</span> ${end}</div>
                <div class="detail-item"><span class="label">Бюджет:</span> ${budget}</div>
            `;
        }

        function renderPhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            phases.forEach(phase => {
                const subs = getSubsByPhase(phase.id);
                if (!subs.length) return;

                const progress = getPhaseProgress(phase.id);
                const start = formatDate(phase.startDate);
                const end = formatDate(phase.endDate);
                const budget = phase.budget ? phase.budget : '—';

                const block = document.createElement('div');
                block.className = 'phase-block';

                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <span class="phase-title">${phase.label}</span>
                    <div class="phase-meta">
                        <span>Начало: ${start}</span>
                        <span>Окончание: ${end}</span>
                        <span>Бюджет: ${budget}</span>
                    </div>
                    <span class="phase-progress">${progress}%</span>
                `;
                block.appendChild(header);

                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'phase-cards';

                const sorted = [...subs].sort((a, b) => a.id.localeCompare(b.id));
                sorted.forEach(sub => {
                    const card = createPhaseCard(sub);
                    cardsWrap.appendChild(card);
                });

                block.appendChild(cardsWrap);
                container.appendChild(block);
            });
        }

        function createPhaseCard(sub) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.dataset.id = sub.id;

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startDate) {
                meta.innerHTML += `<span>Старт: ${formatDate(sub.startDate)}</span>`;
            }
            if (sub.endDate) {
                meta.innerHTML += `<span>Финиш: ${formatDate(sub.endDate)}</span>`;
            }
            card.appendChild(meta);

            card.addEventListener('click', function() {
                openModal(sub);
            });

            return card;
        }

        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = sub.name;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const phase = getPhaseById(sub.phaseId);
            const fields = [
                { key: 'Фаза', value: phase ? phase.label : '—' },
                { key: 'Статус', value: getStatusInfo(sub.pct).label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало', value: formatDate(sub.startDate) },
                { key: 'Окончание', value: formatDate(sub.endDate) },
                { key: 'Описание', value: sub.description || '—' },
                { key: 'Характеристики', value: sub.characteristics || '—' },
            ];

            if (sub.dependencies && sub.dependencies.length) {
                const depNames = sub.dependencies.map(id => getSubName(id)).join(', ');
                fields.push({ key: 'Зависимости', value: depNames, extraClass: 'dependencies' });
            }

            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const valueClass = f.extraClass ? `value ${f.extraClass}` : 'value';
                row.innerHTML = `<span class="key">${f.key}</span><span class="${valueClass}">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
        }

        function updateStats() {
            const total = subPhases.length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();

            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;
        }

        function init() {
            renderTimeline();
            renderPhases();
            updateStats();

            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
            });
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
