<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arion · Дашборд статуса проекта</title>
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            padding: 20px 24px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 1440px;
            width: 100%;
        }

        /* ----- scrollbar ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7a8f;
        }

        /* ----- header ----- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-icon {
            font-size: 32px;
            line-height: 1;
            background: linear-gradient(135deg, #f5b041, #d48c2c);
            padding: 8px 14px;
            border-radius: 12px;
            color: #0b0e14;
            font-weight: 700;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 20px rgba(212, 140, 44, 0.25);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #f5d6a8, #f5b041);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header h1 small {
            font-size: 15px;
            font-weight: 400;
            -webkit-text-fill-color: #8a9bb5;
            background: none;
            margin-left: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141b26;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #25303e;
            font-size: 14px;
        }

        .stat-badge .num {
            font-weight: 700;
            font-size: 18px;
            color: #f5b041;
        }
        .stat-badge .num.green {
            color: #4cd9a0;
        }
        .stat-badge .num.gold {
            color: #f5b041;
        }
        .stat-badge .label {
            color: #8a9bb5;
            font-weight: 400;
        }

        .update-time {
            font-size: 13px;
            color: #5a6a7e;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .update-time .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4cd9a0;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ----- main timeline (macro phases) ----- */
        .timeline-wrapper {
            background: #111822;
            border-radius: 20px;
            padding: 22px 28px 18px;
            border: 1px solid #1e2938;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .timeline-bar {
            position: relative;
            height: 32px;
            border-radius: 40px;
            overflow: hidden;
            background: #1a2332;
            display: flex;
            margin-bottom: 10px;
        }

        .phase-segment {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: width 0.6s ease;
            position: relative;
            min-width: 60px;
            flex-shrink: 0;
        }

        .phase-segment .p-label {
            white-space: nowrap;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            opacity: 0.95;
        }
        .phase-segment .p-pct {
            font-size: 10px;
            font-weight: 500;
            opacity: 0.8;
            margin-left: 6px;
            background: rgba(0, 0, 0, 0.25);
            padding: 1px 8px;
            border-radius: 20px;
        }

        .phase-segment.p1 {
            background: linear-gradient(135deg, #2b6a9e, #1d4a7a);
        }
        .phase-segment.p2 {
            background: linear-gradient(135deg, #2d7a5a, #1a5a3e);
        }
        .phase-segment.p3 {
            background: linear-gradient(135deg, #b07d3a, #8a5f2a);
        }
        .phase-segment.p4 {
            background: linear-gradient(135deg, #8a4a7a, #6a2a5a);
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5a6a7e;
            padding: 0 2px;
            margin-top: 4px;
        }

        .timeline-labels span {
            font-weight: 450;
        }

        /* ----- tracks ----- */
        .tracks {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .track-row {
            background: #111822;
            border-radius: 16px;
            border: 1px solid #1a2332;
            padding: 12px 16px 10px;
            transition: border-color 0.2s;
        }

        .track-row:hover {
            border-color: #2a3a4e;
        }

        .track-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #b0c4de;
            letter-spacing: 0.2px;
        }

        .track-header .track-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .track-dot.geo {
            background: #4a8ec4;
        }
        .track-dot.build {
            background: #e8b84a;
        }
        .track-dot.log {
            background: #5cb0a0;
        }
        .track-dot.energy {
            background: #d97a5a;
        }

        .track-header .track-count {
            font-weight: 400;
            font-size: 12px;
            color: #5a6a7e;
            margin-left: auto;
        }

        .track-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 12px;
            min-height: 48px;
            align-items: center;
        }

        /* ----- card (sub-phase) ----- */
        .sub-card {
            background: #1a2332;
            border-radius: 12px;
            padding: 8px 14px 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #25303e;
            transition: all 0.25s ease;
            cursor: default;
            position: relative;
            flex: 0 1 auto;
            min-width: 140px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .sub-card:hover {
            border-color: #3a4a5e;
            background: #1f2a3a;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .sub-card .card-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .card-status.done {
            background: #4cd9a0;
            box-shadow: 0 0 12px rgba(76, 217, 160, 0.3);
        }
        .card-status.inprogress {
            background: #f5b041;
            box-shadow: 0 0 12px rgba(245, 176, 65, 0.25);
            animation: glow-yellow 1.8s ease-in-out infinite;
        }
        .card-status.pending {
            background: #3a4a5e;
        }
        .card-status.critical {
            background: #e74c5e;
            box-shadow: 0 0 14px rgba(231, 76, 94, 0.35);
            animation: glow-red 1.2s ease-in-out infinite;
        }

        @keyframes glow-yellow {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(245, 176, 65, 0.2);
            }
            50% {
                box-shadow: 0 0 18px rgba(245, 176, 65, 0.5);
            }
        }
        @keyframes glow-red {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(231, 76, 94, 0.2);
            }
            50% {
                box-shadow: 0 0 22px rgba(231, 76, 94, 0.5);
            }
        }

        .sub-card .card-name {
            font-size: 12px;
            font-weight: 500;
            color: #d0dcec;
            white-space: nowrap;
            flex: 1;
            min-width: 60px;
        }

        .sub-card .card-pct {
            font-size: 14px;
            font-weight: 700;
            color: #f5b041;
            min-width: 36px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .sub-card .card-pct.done {
            color: #4cd9a0;
        }
        .sub-card .card-pct.pending {
            color: #5a6a7e;
        }

        .sub-card input[type="range"] {
            width: 68px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3a4e;
            border-radius: 4px;
            outline: none;
            flex-shrink: 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sub-card input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b041;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(245, 176, 65, 0.3);
            border: 2px solid #0b0e14;
            transition: 0.15s;
        }

        .sub-card input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            box-shadow: 0 0 20px rgba(245, 176, 65, 0.5);
        }

        .sub-card input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b041;
            cursor: pointer;
            border: 2px solid #0b0e14;
        }

        .sub-card .card-tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: #0f1722;
            border: 1px solid #2a3a4e;
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 200px;
            font-size: 12px;
            color: #b0c4de;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
            z-index: 100;
            pointer-events: none;
            white-space: normal;
        }

        .sub-card .card-tooltip strong {
            color: #e8edf5;
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .sub-card .card-tooltip .tt-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            border-bottom: 1px solid #1a2332;
        }

        .sub-card .card-tooltip .tt-row:last-child {
            border-bottom: none;
        }

        .sub-card:hover .card-tooltip {
            display: block;
        }

        /* ----- detail section (all sub-phases with controls) ----- */
        .detail-section {
            background: #111822;
            border-radius: 20px;
            border: 1px solid #1e2938;
            padding: 22px 24px 18px;
            margin-top: 8px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }

        .detail-section .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #b0c4de;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .detail-section .section-title .badge {
            background: #1a2332;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 400;
            color: #8a9bb5;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .detail-item {
            background: #141c28;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #1e2938;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .detail-item:hover {
            border-color: #2a3a4e;
        }

        .detail-item .d-info {
            flex: 1;
            min-width: 0;
        }

        .detail-item .d-name {
            font-size: 13px;
            font-weight: 500;
            color: #d0dcec;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-item .d-name .d-phase {
            font-size: 10px;
            font-weight: 400;
            color: #5a6a7e;
            background: #1a2332;
            padding: 0 8px;
            border-radius: 20px;
        }

        .detail-item .d-track {
            font-size: 10px;
            color: #5a6a7e;
            margin-top: 2px;
        }

        .detail-item .d-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .detail-item .d-controls input[type="range"] {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3a4e;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .detail-item .d-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b041;
            cursor: pointer;
            border: 2px solid #0b0e14;
            box-shadow: 0 0 12px rgba(245, 176, 65, 0.2);
        }

        .detail-item .d-controls input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #f5b041;
            cursor: pointer;
            border: 2px solid #0b0e14;
        }

        .detail-item .d-pct {
            font-size: 15px;
            font-weight: 700;
            color: #f5b041;
            min-width: 38px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .detail-item .d-pct.done {
            color: #4cd9a0;
        }
        .detail-item .d-pct.pending {
            color: #5a6a7e;
        }

        .detail-item .d-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ----- responsive ----- */
        @media (max-width: 820px) {
            body {
                padding: 12px 12px 30px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-right {
                justify-content: flex-start;
                gap: 12px;
                flex-wrap: wrap;
            }
            .timeline-wrapper {
                padding: 16px 14px 14px;
            }
            .phase-segment .p-label {
                font-size: 9px;
            }
            .phase-segment .p-pct {
                font-size: 8px;
                padding: 0 6px;
                margin-left: 3px;
            }
            .sub-card {
                min-width: 100px;
                padding: 6px 10px;
            }
            .sub-card .card-name {
                font-size: 10px;
                min-width: 40px;
            }
            .sub-card input[type="range"] {
                width: 44px;
            }
            .detail-grid {
                grid-template-columns: 1fr;
            }
            .detail-item .d-controls input[type="range"] {
                width: 60px;
            }
            .header h1 {
                font-size: 20px;
            }
            .header h1 small {
                font-size: 12px;
                display: block;
                margin-left: 0;
            }
            .logo-icon {
                font-size: 24px;
                padding: 4px 10px;
            }
            .stat-badge {
                padding: 4px 12px;
                font-size: 12px;
            }
            .stat-badge .num {
                font-size: 15px;
            }
            .track-cards {
                gap: 6px;
            }
            .track-row {
                padding: 8px 10px;
            }
            .detail-item {
                padding: 10px 12px;
                flex-wrap: wrap;
            }
            .detail-item .d-controls {
                margin-left: auto;
            }
            .sub-card .card-tooltip {
                display: none !important;
            }
        }

        @media (max-width: 480px) {
            .sub-card {
                min-width: 80px;
                padding: 4px 8px;
            }
            .sub-card .card-name {
                font-size: 9px;
                min-width: 30px;
            }
            .sub-card input[type="range"] {
                width: 32px;
            }
            .sub-card .card-pct {
                font-size: 11px;
                min-width: 28px;
            }
            .phase-segment .p-label {
                font-size: 7px;
            }
            .phase-segment .p-pct {
                font-size: 7px;
                padding: 0 4px;
            }
            .timeline-bar {
                height: 24px;
            }
            .detail-item .d-name {
                font-size: 11px;
            }
            .detail-item .d-pct {
                font-size: 13px;
                min-width: 30px;
            }
            .header h1 {
                font-size: 17px;
            }
        }

        /* ----- utility ----- */
        .mt-2 {
            margin-top: 6px;
        }
        .text-muted {
            color: #5a6a7e;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="logo-icon">⛰️</div>
                <h1>
                    Arion
                    <small>Sentinel · Zenith</small>
                </h1>
            </div>
            <div class="header-right">
                <div class="stat-badge">
                    <span class="label">Общий прогресс</span>
                    <span class="num gold" id="totalProgress">0%</span>
                </div>
                <div class="stat-badge">
                    <span class="label">Завершено</span>
                    <span class="num green" id="completedCount">0</span>
                    <span class="label">/ <span id="totalCount">0</span></span>
                </div>
                <div class="update-time">
                    <span class="dot"></span>
                    <span>Обновлено: <span id="lastUpdate">сегодня</span></span>
                </div>
            </div>
        </header>

        <!-- ===== TIMELINE (macro phases) ===== -->
        <div class="timeline-wrapper">
            <div class="timeline-bar" id="timelineBar">
                <!-- phase segments rendered by JS -->
            </div>
            <div class="timeline-labels">
                <span>0 мес</span>
                <span>6 мес</span>
                <span>14 мес</span>
                <span>28 мес</span>
                <span>36 мес</span>
            </div>
        </div>

        <!-- ===== TRACKS ===== -->
        <div class="tracks" id="tracksContainer">
            <!-- rendered by JS -->
        </div>

        <!-- ===== DETAIL SECTION (all sub-phases with sliders) ===== -->
        <div class="detail-section">
            <div class="section-title">
                <span>📋 Все подэтапы</span>
                <span class="badge" id="detailBadge">0</span>
            </div>
            <div class="detail-grid" id="detailGrid">
                <!-- rendered by JS -->
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        //  DATA
        // ============================================================

        const TRACKS = {
            geo: { label: 'Геологоразведка и бурение', icon: '🔍', cssClass: 'geo' },
            build: { label: 'Строительство объектов', icon: '🏗️', cssClass: 'build' },
            log: { label: 'Логистика и закупки', icon: '🚢', cssClass: 'log' },
            energy: { label: 'Энергетика и оборона', icon: '⚡', cssClass: 'energy' }
        };

        const phases = [{
            id: 'p1',
            label: 'Разведка и бурение',
            short: 'Разведка',
            color: 'p1',
            startMonth: 0,
            endMonth: 6
        }, {
            id: 'p2',
            label: 'Промысел и ЦПС',
            short: 'Промысел',
            color: 'p2',
            startMonth: 6,
            endMonth: 14
        }, {
            id: 'p3',
            label: 'Магистраль и НПЗ',
            short: 'Магистраль',
            color: 'p3',
            startMonth: 14,
            endMonth: 28
        }, {
            id: 'p4',
            label: 'СПГ, порт, энергетика',
            short: 'СПГ / Порт',
            color: 'p4',
            startMonth: 20,
            endMonth: 36
        }];

        // ---------- sub-phases ----------
        // each item: { id, phaseId, trackId, name, month (start), pct, deps? }
        const subPhases = [
            // Phase 1
            { id: '1.1', phaseId: 'p1', trackId: 'log', name: 'Сейсморазведочный корабль', month: 0, pct: 30 },
            { id: '1.2', phaseId: 'p1', trackId: 'geo', name: 'Сейсморазведка', month: 0, pct: 100 },
            { id: '1.3', phaseId: 'p1', trackId: 'geo', name: 'Бурение разведочных скважин', month: 2, pct: 100 },
            { id: '1.4', phaseId: 'p1', trackId: 'geo', name: 'Анализ керна', month: 5, pct: 0 },
            { id: '1.5', phaseId: 'p1', trackId: 'build', name: 'Выбор площадки ЦПС / НПЗ', month: 6, pct: 0 },

            // Phase 2
            { id: '2.1', phaseId: 'p2', trackId: 'geo', name: 'Бурение эксплуатационных скважин', month: 6, pct: 0 },
            { id: '2.2', phaseId: 'p2', trackId: 'build', name: 'Монтаж арматуры и фонтанной системы', month: 8, pct: 0 },
            { id: '2.3', phaseId: 'p2', trackId: 'build', name: 'Строительство ЦПС', month: 7, pct: 0 },
            { id: '2.4', phaseId: 'p2', trackId: 'build', name: 'Система ППД и водоочистка', month: 10, pct: 0 },
            { id: '2.5', phaseId: 'p2', trackId: 'build', name: 'Факельная система и газотрубы', month: 10, pct: 0 },

            // Phase 3
            { id: '3.1', phaseId: 'p3', trackId: 'build', name: 'Нефтепровод до моря', month: 14, pct: 0 },
            { id: '3.2', phaseId: 'p3', trackId: 'build', name: 'Промежуточные НПС', month: 16, pct: 0 },
            { id: '3.3', phaseId: 'p3', trackId: 'build', name: 'Головная НПС у НПЗ', month: 18, pct: 0 },
            { id: '3.4', phaseId: 'p3', trackId: 'build', name: 'Строительство НПЗ', month: 20, pct: 0 },
            { id: '3.5', phaseId: 'p3', trackId: 'build', name: 'Резервуарный парк РВС', month: 22, pct: 0 },
            { id: '3.6', phaseId: 'p3', trackId: 'build', name: 'Обваловка и системы безопасности', month: 24, pct: 0 },

            // Phase 4
            { id: '4.1', phaseId: 'p4', trackId: 'build', name: 'Завод СПГ (линии сжижения)', month: 20, pct: 0 },
            { id: '4.2', phaseId: 'p4', trackId: 'build', name: 'Изотермические резервуары', month: 22, pct: 0 },
            { id: '4.3', phaseId: 'p4', trackId: 'build', name: 'Глубоководный порт', month: 20, pct: 0 },
            { id: '4.4', phaseId: 'p4', trackId: 'build', name: 'Криогенный терминал', month: 24, pct: 0 },
            { id: '4.5', phaseId: 'p4', trackId: 'energy', name: 'Газотурбинная электростанция (ГТЭС)', month: 18, pct: 0 },
            { id: '4.6', phaseId: 'p4', trackId: 'energy', name: 'ЛЭП и трансформаторные подстанции', month: 22, pct: 0 },
            { id: '4.7', phaseId: 'p4', trackId: 'log', name: 'Танкеры и газовозы (верфи)', month: 14, pct: 0 },
            { id: '4.8', phaseId: 'p4', trackId: 'energy', name: 'Береговая оборона (Sentinel)', month: 24, pct: 0 },
        ];

        // ============================================================
        //  STATE
        // ============================================================

        // We'll mutate pct in place via the UI.
        // We also store a reference to all sub-phases for quick lookup.

        // ============================================================
        //  HELPERS
        // ============================================================

        function getPhaseById(id) {
            return phases.find(p => p.id === id);
        }

        function getTrackById(id) {
            return TRACKS[id];
        }

        function getSubsByPhase(phaseId) {
            return subPhases.filter(s => s.phaseId === phaseId);
        }

        function getSubsByTrack(trackId) {
            return subPhases.filter(s => s.trackId === trackId);
        }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getOverallProgress() {
            if (!subPhases.length) return 0;
            const sum = subPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subPhases.length);
        }

        function getCompletedCount() {
            return subPhases.filter(s => s.pct >= 100).length;
        }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён', cssClass: 'done' };
            if (pct > 0) return { status: 'inprogress', label: 'В процессе', cssClass: 'inprogress' };
            return { status: 'pending', label: 'Не начат', cssClass: 'pending' };
        }

        // ============================================================
        //  RENDER
        // ============================================================

        function renderAll() {
            renderTimeline();
            renderTracks();
            renderDetailGrid();
            updateStats();
        }

        // ----- timeline -----
        function renderTimeline() {
            const bar = document.getElementById('timelineBar');
            bar.innerHTML = '';
            phases.forEach(phase => {
                const pct = getPhaseProgress(phase.id);
                const seg = document.createElement('div');
                seg.className = `phase-segment ${phase.color}`;
                // width proportional to duration (36 months total)
                const dur = phase.endMonth - phase.startMonth;
                const width = (dur / 36) * 100;
                seg.style.width = width + '%';
                seg.innerHTML = `
                    <span class="p-label">${phase.short}</span>
                    <span class="p-pct">${pct}%</span>
                `;
                bar.appendChild(seg);
            });
        }

        // ----- tracks -----
        function renderTracks() {
            const container = document.getElementById('tracksContainer');
            container.innerHTML = '';

            const trackKeys = Object.keys(TRACKS);
            trackKeys.forEach(tk => {
                const track = TRACKS[tk];
                const subs = getSubsByTrack(tk);
                if (!subs.length) return;

                const row = document.createElement('div');
                row.className = 'track-row';

                // header
                const header = document.createElement('div');
                header.className = 'track-header';
                header.innerHTML = `
                    <span class="track-dot ${track.cssClass}"></span>
                    ${track.icon} ${track.label}
                    <span class="track-count">${subs.length} подэтапов</span>
                `;
                row.appendChild(header);

                // cards
                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'track-cards';

                // sort by month
                const sorted = [...subs].sort((a, b) => a.month - b.month);
                sorted.forEach(s => {
                    const card = createCard(s);
                    cardsWrap.appendChild(card);
                });

                row.appendChild(cardsWrap);
                container.appendChild(row);
            });
        }

        // ----- single card -----
        function createCard(sub) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'sub-card';
            card.dataset.id = sub.id;

            const dot = document.createElement('span');
            dot.className = `card-status ${status.cssClass}`;
            card.appendChild(dot);

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            card.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.cssClass}`;
            pctSpan.textContent = sub.pct + '%';
            card.appendChild(pctSpan);

            // slider
            const range = document.createElement('input');
            range.type = 'range';
            range.min = 0;
            range.max = 100;
            range.value = sub.pct;
            range.addEventListener('input', function(e) {
                const val = parseInt(e.target.value, 10);
                sub.pct = val;
                // update this card's display
                updateCardDisplay(card, sub);
                // update all other instances (detail grid)
                syncDetailItem(sub.id);
                // re-render timeline & stats
                renderTimeline();
                updateStats();
                // update track cards (just re-render tracks to keep in sync)
                // but to avoid flicker, we update the card in place.
                // However, other cards in the same track might need re-sorting? No, we just update display.
                // We'll also update the detail grid item.
                // We'll also update the phase progress on timeline.
                // But we also need to update the track card if it's in another track? No, each card is unique.
                // We'll update the card's pct display and status dot.
                // Also update the corresponding detail item.
                // Also re-calc phase progress and timeline.
                // We already did renderTimeline and updateStats.
                // But the detail grid item is updated via syncDetailItem.
                // Also update the track card's pct display and dot.
                // But we're already updating the card display here.
                // The track card is the same element, so it's fine.
                // However, the detail grid item is a separate element, so we sync it.
                // We also need to update the phase progress on the timeline.
                // And the overall stats.
                // Done.
            });
            card.appendChild(range);

            // tooltip
            const tooltip = document.createElement('div');
            tooltip.className = 'card-tooltip';
            const phase = getPhaseById(sub.phaseId);
            const track = getTrackById(sub.trackId);
            tooltip.innerHTML = `
                <strong>${sub.name}</strong>
                <div class="tt-row"><span>Фаза</span><span>${phase ? phase.label : '—'}</span></div>
                <div class="tt-row"><span>Трек</span><span>${track ? track.label : '—'}</span></div>
                <div class="tt-row"><span>Старт</span><span>${sub.month} мес.</span></div>
                <div class="tt-row"><span>Прогресс</span><span>${sub.pct}%</span></div>
                <div class="tt-row"><span>Статус</span><span>${status.label}</span></div>
            `;
            card.appendChild(tooltip);

            return card;
        }

        function updateCardDisplay(card, sub) {
            const status = getStatusInfo(sub.pct);
            const dot = card.querySelector('.card-status');
            if (dot) {
                dot.className = `card-status ${status.cssClass}`;
            }
            const pctSpan = card.querySelector('.card-pct');
            if (pctSpan) {
                pctSpan.textContent = sub.pct + '%';
                pctSpan.className = `card-pct ${status.cssClass}`;
            }
            const range = card.querySelector('input[type="range"]');
            if (range) {
                range.value = sub.pct;
            }
            // update tooltip
            const tooltip = card.querySelector('.card-tooltip');
            if (tooltip) {
                const phase = getPhaseById(sub.phaseId);
                const track = getTrackById(sub.trackId);
                tooltip.innerHTML = `
                    <strong>${sub.name}</strong>
                    <div class="tt-row"><span>Фаза</span><span>${phase ? phase.label : '—'}</span></div>
                    <div class="tt-row"><span>Трек</span><span>${track ? track.label : '—'}</span></div>
                    <div class="tt-row"><span>Старт</span><span>${sub.month} мес.</span></div>
                    <div class="tt-row"><span>Прогресс</span><span>${sub.pct}%</span></div>
                    <div class="tt-row"><span>Статус</span><span>${status.label}</span></div>
                `;
            }
        }

        // ----- detail grid -----
        function renderDetailGrid() {
            const grid = document.getElementById('detailGrid');
            grid.innerHTML = '';
            subPhases.forEach(sub => {
                const item = createDetailItem(sub);
                grid.appendChild(item);
            });
            document.getElementById('detailBadge').textContent = subPhases.length;
        }

        function createDetailItem(sub) {
            const status = getStatusInfo(sub.pct);
            const phase = getPhaseById(sub.phaseId);
            const track = getTrackById(sub.trackId);

            const div = document.createElement('div');
            div.className = 'detail-item';
            div.dataset.id = sub.id;

            // status dot
            const dot = document.createElement('span');
            dot.className = `d-status-dot ${status.cssClass}`;
            div.appendChild(dot);

            // info
            const info = document.createElement('div');
            info.className = 'd-info';
            const nameDiv = document.createElement('div');
            nameDiv.className = 'd-name';
            nameDiv.innerHTML = `
                ${sub.name}
                <span class="d-phase">${phase ? phase.short : ''}</span>
            `;
            info.appendChild(nameDiv);
            const trackSpan = document.createElement('div');
            trackSpan.className = 'd-track';
            trackSpan.textContent = `${track ? track.icon + ' ' + track.label : ''} · старт ${sub.month} мес.`;
            info.appendChild(trackSpan);
            div.appendChild(info);

            // controls
            const controls = document.createElement('div');
            controls.className = 'd-controls';

            const range = document.createElement('input');
            range.type = 'range';
            range.min = 0;
            range.max = 100;
            range.value = sub.pct;
            range.addEventListener('input', function(e) {
                const val = parseInt(e.target.value, 10);
                sub.pct = val;
                // update this detail item
                updateDetailItemDisplay(div, sub);
                // sync track card
                syncTrackCard(sub.id);
                // re-render timeline & stats
                renderTimeline();
                updateStats();
            });
            controls.appendChild(range);

            const pctSpan = document.createElement('span');
            pctSpan.className = `d-pct ${status.cssClass}`;
            pctSpan.textContent = sub.pct + '%';
            controls.appendChild(pctSpan);

            div.appendChild(controls);

            return div;
        }

        function updateDetailItemDisplay(div, sub) {
            const status = getStatusInfo(sub.pct);
            const dot = div.querySelector('.d-status-dot');
            if (dot) {
                dot.className = `d-status-dot ${status.cssClass}`;
            }
            const pctSpan = div.querySelector('.d-pct');
            if (pctSpan) {
                pctSpan.textContent = sub.pct + '%';
                pctSpan.className = `d-pct ${status.cssClass}`;
            }
            const range = div.querySelector('input[type="range"]');
            if (range) {
                range.value = sub.pct;
            }
            // update track info in the detail item (just for consistency)
            const trackSpan = div.querySelector('.d-track');
            if (trackSpan) {
                const track = getTrackById(sub.trackId);
                trackSpan.textContent = `${track ? track.icon + ' ' + track.label : ''} · старт ${sub.month} мес.`;
            }
        }

        // ----- sync helpers -----
        function syncDetailItem(id) {
            const sub = subPhases.find(s => s.id === id);
            if (!sub) return;
            const items = document.querySelectorAll(`.detail-item[data-id="${id}"]`);
            items.forEach(el => updateDetailItemDisplay(el, sub));
        }

        function syncTrackCard(id) {
            const sub = subPhases.find(s => s.id === id);
            if (!sub) return;
            const cards = document.querySelectorAll(`.sub-card[data-id="${id}"]`);
            cards.forEach(el => updateCardDisplay(el, sub));
        }

        // ----- stats -----
        function updateStats() {
            const total = subPhases.length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();

            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            // update time
            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;
        }

        // ============================================================
        //  INIT
        // ============================================================

        renderAll();

        // Auto-update time every minute
        setInterval(() => {
            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;
        }, 60000);

        console.log('🚀 Arion Dashboard готов!');
        console.log(`📊 ${subPhases.length} подэтапов, ${getCompletedCount()} завершено, общий прогресс ${getOverallProgress()}%`);
    </script>

</body>
</html>
