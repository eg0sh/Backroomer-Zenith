<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith · Главная</title>
    <style>
        /* ===== CSS Variables (темы) ===== */
        :root {
            --bg-body: radial-gradient(ellipse at 50% 20%, #141c28, #070a0e);
            --bg-panel: rgba(17, 24, 34, 0.7);
            --bg-card: rgba(20, 28, 40, 0.8);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #e8edf5;
            --text-secondary: #b0c4de;
            --text-muted: #5a6a7e;
            --accent-gold: #f5b041;
            --accent-glow: rgba(245, 176, 65, 0.02);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #3a4a5e;
            --gradient-start: #f7e05e;
            --gradient-end: #e67e22;
        }
        [data-theme="light"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #f0f4f8, #d9e2ec);
            --bg-panel: rgba(255,255,255,0.85);
            --bg-card: rgba(255,255,255,0.9);
            --border-color: rgba(0,0,0,0.1);
            --text-primary: #1a2332;
            --text-secondary: #2a3a4e;
            --text-muted: #6a7a8e;
            --accent-gold: #d48c2c;
            --accent-glow: rgba(212,140,44,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #2b6a9e;
            --dot-active: #c0392b;
            --dot-pending: #8a9bb5;
            --gradient-start: #b08a2c;
            --gradient-end: #8a6a1a;
        }
        [data-theme="gold"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a1f0e, #1a1008);
            --bg-panel: rgba(40,30,20,0.85);
            --bg-card: rgba(40,30,20,0.9);
            --border-color: rgba(212,140,44,0.25);
            --text-primary: #f5e6c8;
            --text-secondary: #d4b88a;
            --text-muted: #8a7a5a;
            --accent-gold: #f5b041;
            --accent-glow: rgba(245,176,65,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.6);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #6a5a3a;
            --gradient-start: #f7e05e;
            --gradient-end: #e67e22;
        }
        [data-theme="blue"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1628, #050d1a);
            --bg-panel: rgba(10,22,40,0.8);
            --bg-card: rgba(10,22,40,0.9);
            --border-color: rgba(74,142,196,0.2);
            --text-primary: #b0d4f0;
            --text-secondary: #8ab4d4;
            --text-muted: #4a6a8a;
            --accent-gold: #4a8ec4;
            --accent-glow: rgba(74,142,196,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #3a5a7a;
            --gradient-start: #8ab4d4;
            --gradient-end: #4a6a9e;
        }
        [data-theme="green"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1a12, #050d08);
            --bg-panel: rgba(10,26,18,0.8);
            --bg-card: rgba(10,26,18,0.9);
            --border-color: rgba(76,217,160,0.2);
            --text-primary: #b0e8d0;
            --text-secondary: #80c8a8;
            --text-muted: #4a7a62;
            --accent-gold: #4cd9a0;
            --accent-glow: rgba(76,217,160,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #2b6a9e;
            --dot-active: #e74c3c;
            --dot-pending: #3a5a4a;
            --gradient-start: #80c8a8;
            --gradient-end: #4a7a62;
        }
        [data-theme="purple"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #1a0a2a, #0d0518);
            --bg-panel: rgba(26,10,42,0.8);
            --bg-card: rgba(26,10,42,0.9);
            --border-color: rgba(160,76,217,0.2);
            --text-primary: #d8b0f0;
            --text-secondary: #b080d4;
            --text-muted: #6a4a8a;
            --accent-gold: #a04cd9;
            --accent-glow: rgba(160,76,217,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #5a3a6a;
            --gradient-start: #b080d4;
            --gradient-end: #6a4a8a;
        }
        [data-theme="red"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a0a0a, #180505);
            --bg-panel: rgba(42,10,10,0.8);
            --bg-card: rgba(42,10,10,0.9);
            --border-color: rgba(217,76,76,0.2);
            --text-primary: #f0b0b0;
            --text-secondary: #d48080;
            --text-muted: #8a4a4a;
            --accent-gold: #d94c4c;
            --accent-glow: rgba(217,76,76,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #6a3a3a;
            --gradient-start: #d48080;
            --gradient-end: #8a4a4a;
        }
        [data-theme="eyecare"] {
            --bg-body: #d9d9d9;
            --bg-panel: rgba(220,220,220,0.85);
            --bg-card: rgba(230,230,230,0.9);
            --border-color: rgba(120,120,120,0.2);
            --text-primary: #404040;
            --text-secondary: #505050;
            --text-muted: #707070;
            --accent-gold: #8a8a8a;
            --accent-glow: rgba(128,128,128,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.05);
            --dot-done: #6a8a6a;
            --dot-active: #b06a6a;
            --dot-pending: #909090;
            --gradient-start: #8a8a8a;
            --gradient-end: #6a6a6a;
        }
        [data-theme="cyberpunk"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0010, #000005);
            --bg-panel: rgba(20,0,30,0.8);
            --bg-card: rgba(20,0,30,0.9);
            --border-color: rgba(255,0,200,0.3);
            --text-primary: #ff66ff;
            --text-secondary: #ff99ff;
            --text-muted: #cc66cc;
            --accent-gold: #ff00ff;
            --accent-glow: rgba(255,0,255,0.1);
            --shadow: 0 8px 40px rgba(255,0,255,0.1);
            --dot-done: #00ffaa;
            --dot-active: #ff0066;
            --dot-pending: #660066;
            --gradient-start: #ff66ff;
            --gradient-end: #cc33cc;
        }
        [data-theme="graphic"] {
            --bg-body: #f5f5f5;
            --bg-panel: rgba(255,255,255,0.9);
            --bg-card: #ffffff;
            --border-color: #cccccc;
            --text-primary: #000000;
            --text-secondary: #222222;
            --text-muted: #555555;
            --accent-gold: #000000;
            --accent-glow: rgba(0,0,0,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #000000;
            --dot-active: #000000;
            --dot-pending: #999999;
            --gradient-start: #333333;
            --gradient-end: #000000;
        }
        [data-theme="matrix"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #001000, #000800);
            --bg-panel: rgba(0,20,0,0.8);
            --bg-card: rgba(0,20,0,0.9);
            --border-color: rgba(0,255,0,0.2);
            --text-primary: #00ff00;
            --text-secondary: #66ff66;
            --text-muted: #006600;
            --accent-gold: #00ff00;
            --accent-glow: rgba(0,255,0,0.02);
            --shadow: 0 8px 40px rgba(0,255,0,0.05);
            --dot-done: #00ff00;
            --dot-active: #ff0000;
            --dot-pending: #006600;
            --gradient-start: #66ff66;
            --gradient-end: #00cc00;
        }
        [data-theme="space"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0a2a, #000010);
            --bg-panel: rgba(10,10,30,0.8);
            --bg-card: rgba(10,10,30,0.9);
            --border-color: rgba(100,100,255,0.2);
            --text-primary: #c0c0ff;
            --text-secondary: #8888ff;
            --text-muted: #4444aa;
            --accent-gold: #6666ff;
            --accent-glow: rgba(100,100,255,0.02);
            --shadow: 0 8px 40px rgba(100,100,255,0.05);
            --dot-done: #00ffaa;
            --dot-active: #ff6666;
            --dot-pending: #333366;
            --gradient-start: #8888ff;
            --gradient-end: #4444cc;
        }
        [data-theme="retro"] {
            --bg-body: #f0e8d0;
            --bg-panel: rgba(240,232,208,0.85);
            --bg-card: rgba(250,242,220,0.9);
            --border-color: #b0a080;
            --text-primary: #4a3a2a;
            --text-secondary: #6a5a4a;
            --text-muted: #8a7a6a;
            --accent-gold: #8a7a50;
            --accent-glow: rgba(138,122,80,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #6a8a6a;
            --dot-active: #b06a5a;
            --dot-pending: #b0a080;
            --gradient-start: #b0a080;
            --gradient-end: #8a7a50;
        }

        /* ----- base ----- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        /* ===== Верхнее меню ===== */
        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .theme-btn:focus-visible { outline: 2px solid var(--accent-gold); }

        /* ----- контент главной ----- */
        .main-content {
            max-width: 1200px;
            width: 100%;
            padding: 40px 24px 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .main-content .welcome-text {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.6;
            max-width: 700px;
        }
        .main-content .cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .main-content .card {
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            flex: 1 0 220px;
            max-width: 320px;
            min-height: 200px;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-content .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 50px var(--accent-glow);
        }
        .main-content .card .icon {
            font-size: 44px;
            margin-bottom: 14px;
            display: block;
        }
        .main-content .card h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .main-content .card p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        /* ----- версия ----- */
        .version {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 16px 0 8px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
            letter-spacing: 0.3px;
        }

        /* ===== Модальное окно тем ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 80px rgba(0,0,0,0.8);
            animation: modal-in 0.4s cubic-bezier(0.4,0,0.2,1);
            max-height: 80vh;
            overflow-y: auto;
            transition: background 0.4s, border-color 0.4s;
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        .modal .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .modal .modal-close {
            margin-top: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        .modal .modal-close:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .theme-modal .theme-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .theme-modal .theme-option {
            padding: 12px 8px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .theme-modal .theme-option:hover {
            border-color: var(--accent-gold);
            transform: scale(1.03);
        }
        .theme-modal .theme-option.active {
            border-color: var(--accent-gold);
            background: var(--accent-glow);
        }
        .theme-modal .theme-option .color-preview {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 0 auto 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* ----- адаптив ----- */
        @media (max-width: 820px) {
            .top-menu { padding: 10px 16px; flex-direction: column; align-items: stretch; gap:8px; }
            .top-menu .nav-links { justify-content: center; }
            .main-content { padding: 30px 16px; }
            .main-content .cards { flex-direction: column; align-items: center; }
            .main-content .card { max-width: 100%; width: 100%; min-height: 140px; padding: 24px 20px; }
            .theme-modal .theme-options { grid-template-columns: 1fr 1fr; }
            .modal { padding: 24px; }
        }
        @media (max-width: 480px) {
            .main-content .welcome-text { font-size: 17px; }
            .main-content .card .icon { font-size: 32px; }
            .main-content .card h3 { font-size: 18px; }
            .theme-modal .theme-options { grid-template-columns: 1fr; }
            .modal { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- ===== ВЕРХНЕЕ МЕНЮ ===== -->
    <header class="top-menu">
        <div class="logo">Zenith</div>
        <nav class="nav-links">
            <a href="index.html" class="active">Главная</a>
            <a href="arion.html">Arion</a>
            <a href="analysis.html">Аналитика</a>
        </nav>
        <div class="right-info">
            <span class="dot"></span>
            <span id="headerTime">—</span>
            <div class="header-controls">
                <button class="theme-btn" id="themeToggle">🎨 Тема</button>
            </div>
        </div>
    </header>

    <!-- ===== КОНТЕНТ ===== -->
    <main class="main-content">
        <div class="welcome-text">
            <strong>Центр управления проектами Zenith</strong><br />
            Выберите раздел для перехода к мониторингу и аналитике.
        </div>

        <div class="cards">
            <a href="arion.html" class="card">
                <span class="icon">⛰️</span>
                <h3>Arion</h3>
                <p>Дашборд статуса строительства</p>
            </a>
            <a href="analysis.html" class="card">
                <span class="icon">📊</span>
                <h3>Аналитика</h3>
                <p>Прогнозы и события Закулисья</p>
            </a>
            <a href="SCP-menu.html" class="card">
                <span class="icon">📁</span>
                <h3>SCP Foundation</h3>
                <p>База данных аномальных объектов</p>
            </a>
        </div>

        <div class="version">v1.3.0</div>
    </main>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ ВЫБОРА ТЕМЫ ===== -->
    <div class="modal-overlay" id="themeModalOverlay">
        <div class="modal theme-modal">
            <div class="modal-title">Выберите тему</div>
            <div class="theme-options" id="themeOptions"></div>
            <button class="modal-close" id="themeModalClose">Закрыть</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  VERSION: v1.3.0
        // ============================================================

        // ============================================================
        //  ТЕМЫ
        // ============================================================

        const themes = [
            { id: 'dark', label: 'Тёмная', color: '#141c28' },
            { id: 'light', label: 'Светлая', color: '#f0f4f8' },
            { id: 'gold', label: 'Золотая', color: '#2a1f0e' },
            { id: 'blue', label: 'Синяя', color: '#0a1628' },
            { id: 'green', label: 'Зелёная', color: '#0a1a12' },
            { id: 'purple', label: 'Фиолетовая', color: '#1a0a2a' },
            { id: 'red', label: 'Красная', color: '#2a0a0a' },
            { id: 'eyecare', label: 'Защита глаз', color: '#d9d9d9' },
            { id: 'cyberpunk', label: 'Киберпанк', color: '#0a0010' },
            { id: 'graphic', label: 'Графическая', color: '#f5f5f5' },
            { id: 'matrix', label: 'Матрица', color: '#001000' },
            { id: 'space', label: 'Космос', color: '#0a0a2a' },
            { id: 'retro', label: 'Ретро', color: '#f0e8d0' }
        ];

        let currentTheme = localStorage.getItem('arion-theme') || 'dark';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const optionsContainer = document.getElementById('themeOptions');
            optionsContainer.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `
                    <div class="color-preview" style="background:${t.color};"></div>
                    ${t.label}
                `;
                div.addEventListener('click', () => {
                    applyTheme(t.id);
                    overlay.classList.remove('active');
                });
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            document.getElementById('themeModalClose').focus();
        }

        // ============================================================
        //  ВРЕМЯ В ШАПКЕ
        // ============================================================

        function updateHeaderTime() {
            const now = new Date();
            document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        function init() {
            applyTheme(currentTheme);
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);

            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', function() {
                document.getElementById('themeModalOverlay').classList.remove('active');
            });
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('themeModalOverlay').classList.remove('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
