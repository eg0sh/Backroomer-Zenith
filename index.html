<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arion · Статус проекта</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <style>
        /* ----- CSS Variables (темы) ----- */
        :root {
            --bg-body: radial-gradient(ellipse at 50% 20%, #141c28, #070a0e);
            --bg-panel: rgba(17, 24, 34, 0.7);
            --bg-card: rgba(20, 28, 40, 0.8);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #e8edf5;
            --text-secondary: #b0c4de;
            --text-muted: #5a6a7e;
            --accent-gold: #f5b041;
            --accent-glow: rgba(245, 176, 65, 0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.3);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #3a4a5e;
            --line-bg: #4a5a6e;
            --line-fill: linear-gradient(90deg, #f5b041, #e67e22);
            --chart-bg: rgba(20,28,40,0.5);
            --chart-text: #b0c4de;
            --shadow-color: rgba(0,0,0,0.3);
        }
        [data-theme="light"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #f0f4f8, #d9e2ec);
            --bg-panel: rgba(255,255,255,0.85);
            --bg-card: rgba(255,255,255,0.9);
            --border-color: rgba(0,0,0,0.1);
            --text-primary: #1a2332;
            --text-secondary: #2a3a4e;
            --text-muted: #6a7a8e;
            --accent-gold: #d48c2c;
            --accent-glow: rgba(212,140,44,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #2b6a9e;
            --dot-active: #c0392b;
            --dot-pending: #8a9bb5;
            --line-bg: #b0c4de;
            --line-fill: linear-gradient(90deg, #d48c2c, #b06a1a);
            --chart-bg: rgba(255,255,255,0.6);
            --chart-text: #2a3a4e;
            --shadow-color: rgba(0,0,0,0.1);
        }
        [data-theme="gold"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a1f0e, #1a1008);
            --bg-panel: rgba(40,30,20,0.85);
            --bg-card: rgba(40,30,20,0.9);
            --border-color: rgba(212,140,44,0.25);
            --text-primary: #f5e6c8;
            --text-secondary: #d4b88a;
            --text-muted: #8a7a5a;
            --accent-gold: #f5b041;
            --accent-glow: rgba(245,176,65,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.6);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #6a5a3a;
            --line-bg: #5a4a2a;
            --line-fill: linear-gradient(90deg, #f5b041, #e67e22);
            --chart-bg: rgba(40,30,20,0.6);
            --chart-text: #d4b88a;
            --shadow-color: rgba(0,0,0,0.6);
        }
        [data-theme="blue"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1628, #050d1a);
            --bg-panel: rgba(10,22,40,0.8);
            --bg-card: rgba(10,22,40,0.9);
            --border-color: rgba(74,142,196,0.2);
            --text-primary: #b0d4f0;
            --text-secondary: #8ab4d4;
            --text-muted: #4a6a8a;
            --accent-gold: #4a8ec4;
            --accent-glow: rgba(74,142,196,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #3a5a7a;
            --line-bg: #2a4a6a;
            --line-fill: linear-gradient(90deg, #4a8ec4, #2a6a9e);
            --chart-bg: rgba(10,22,40,0.6);
            --chart-text: #8ab4d4;
            --shadow-color: rgba(0,0,0,0.5);
        }
        [data-theme="green"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1a12, #050d08);
            --bg-panel: rgba(10,26,18,0.8);
            --bg-card: rgba(10,26,18,0.9);
            --border-color: rgba(76,217,160,0.2);
            --text-primary: #b0e8d0;
            --text-secondary: #80c8a8;
            --text-muted: #4a7a62;
            --accent-gold: #4cd9a0;
            --accent-glow: rgba(76,217,160,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #2b6a9e;
            --dot-active: #e74c3c;
            --dot-pending: #3a5a4a;
            --line-bg: #2a5a42;
            --line-fill: linear-gradient(90deg, #4cd9a0, #2a9a6e);
            --chart-bg: rgba(10,26,18,0.6);
            --chart-text: #80c8a8;
            --shadow-color: rgba(0,0,0,0.5);
        }
        [data-theme="purple"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #1a0a2a, #0d0518);
            --bg-panel: rgba(26,10,42,0.8);
            --bg-card: rgba(26,10,42,0.9);
            --border-color: rgba(160,76,217,0.2);
            --text-primary: #d8b0f0;
            --text-secondary: #b080d4;
            --text-muted: #6a4a8a;
            --accent-gold: #a04cd9;
            --accent-glow: rgba(160,76,217,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #5a3a6a;
            --line-bg: #4a2a6a;
            --line-fill: linear-gradient(90deg, #a04cd9, #7a2a9e);
            --chart-bg: rgba(26,10,42,0.6);
            --chart-text: #b080d4;
            --shadow-color: rgba(0,0,0,0.5);
        }
        [data-theme="red"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a0a0a, #180505);
            --bg-panel: rgba(42,10,10,0.8);
            --bg-card: rgba(42,10,10,0.9);
            --border-color: rgba(217,76,76,0.2);
            --text-primary: #f0b0b0;
            --text-secondary: #d48080;
            --text-muted: #8a4a4a;
            --accent-gold: #d94c4c;
            --accent-glow: rgba(217,76,76,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #6a3a3a;
            --line-bg: #6a2a2a;
            --line-fill: linear-gradient(90deg, #d94c4c, #b02a2a);
            --chart-bg: rgba(42,10,10,0.6);
            --chart-text: #d48080;
            --shadow-color: rgba(0,0,0,0.5);
        }
        /* Защита глаз — мягкая нейтральная, без зелени */
        [data-theme="eyecare"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a2a2a, #1a1a1a);
            --bg-panel: rgba(40,40,40,0.85);
            --bg-card: rgba(50,50,50,0.9);
            --border-color: rgba(160,160,160,0.15);
            --text-primary: #d0d0d0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --accent-gold: #b0b0b0;
            --accent-glow: rgba(160,160,160,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #8a8a8a;
            --dot-active: #c08080;
            --dot-pending: #5a5a5a;
            --line-bg: #5a5a5a;
            --line-fill: linear-gradient(90deg, #b0b0b0, #888888);
            --chart-bg: rgba(50,50,50,0.6);
            --chart-text: #b0b0b0;
            --shadow-color: rgba(0,0,0,0.5);
        }
        /* Киберпанк */
        [data-theme="cyberpunk"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0a1a, #05050f);
            --bg-panel: rgba(10,10,26,0.85);
            --bg-card: rgba(15,15,35,0.9);
            --border-color: rgba(0,255,200,0.2);
            --text-primary: #00ffc8;
            --text-secondary: #80d0c0;
            --text-muted: #408080;
            --accent-gold: #ff00ff;
            --accent-glow: rgba(255,0,255,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.7);
            --dot-done: #00ffc8;
            --dot-active: #ff00ff;
            --dot-pending: #404060;
            --line-bg: #00ffc8;
            --line-fill: linear-gradient(90deg, #ff00ff, #00ffc8);
            --chart-bg: rgba(10,10,26,0.6);
            --chart-text: #00ffc8;
            --shadow-color: rgba(0,0,0,0.7);
        }
        /* Графическая (комикс) */
        [data-theme="comic"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #f0e8d0, #e0d0b0);
            --bg-panel: rgba(240,232,208,0.85);
            --bg-card: rgba(240,232,208,0.9);
            --border-color: rgba(0,0,0,0.3);
            --text-primary: #1a1a1a;
            --text-secondary: #3a3a3a;
            --text-muted: #6a6a6a;
            --accent-gold: #c0392b;
            --accent-glow: rgba(192,57,43,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.2);
            --dot-done: #2b6a9e;
            --dot-active: #c0392b;
            --dot-pending: #8a8a7a;
            --line-bg: #5a5a4a;
            --line-fill: linear-gradient(90deg, #c0392b, #2b6a9e);
            --chart-bg: rgba(240,232,208,0.6);
            --chart-text: #1a1a1a;
            --shadow-color: rgba(0,0,0,0.2);
        }
        /* Монохромная */
        [data-theme="monochrome"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a2a2a, #1a1a1a);
            --bg-panel: rgba(40,40,40,0.85);
            --bg-card: rgba(50,50,50,0.9);
            --border-color: rgba(128,128,128,0.15);
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #707070;
            --accent-gold: #a0a0a0;
            --accent-glow: rgba(160,160,160,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #909090;
            --dot-active: #b0b0b0;
            --dot-pending: #4a4a4a;
            --line-bg: #5a5a5a;
            --line-fill: linear-gradient(90deg, #a0a0a0, #707070);
            --chart-bg: rgba(50,50,50,0.6);
            --chart-text: #b0b0b0;
            --shadow-color: rgba(0,0,0,0.5);
        }
        /* Неоновая */
        [data-theme="neon"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0a1a, #05050f);
            --bg-panel: rgba(10,10,26,0.85);
            --bg-card: rgba(15,15,35,0.9);
            --border-color: rgba(0,255,255,0.2);
            --text-primary: #00ffff;
            --text-secondary: #80d0d0;
            --text-muted: #408080;
            --accent-gold: #ff00ff;
            --accent-glow: rgba(255,0,255,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.7);
            --dot-done: #00ffff;
            --dot-active: #ff00ff;
            --dot-pending: #404060;
            --line-bg: #00ffff;
            --line-fill: linear-gradient(90deg, #ff00ff, #00ffff);
            --chart-bg: rgba(10,10,26,0.6);
            --chart-text: #00ffff;
            --shadow-color: rgba(0,0,0,0.7);
        }

        /* ----- base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 24px 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            position: relative;
        }

        /* ----- scrollbar ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7a8f;
        }

        /* ----- animations ----- */
        @keyframes glow-title {
            0% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(245,176,65,0.05); }
            100% { text-shadow: 0 0 70px var(--accent-glow), 0 0 140px rgba(245,176,65,0.2); }
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        @keyframes pulse-red {
            0%,100% { box-shadow: 0 0 30px rgba(231,76,60,0.4), 0 0 60px rgba(231,76,60,0.2); }
            50% { box-shadow: 0 0 80px rgba(231,76,60,0.8), 0 0 150px rgba(231,76,60,0.3); }
        }
        @keyframes ring-pulse {
            0%,100% { transform:scale(1); opacity:0.6; }
            50% { transform:scale(1.6); opacity:0; }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes wave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .wave-bg {
            background: linear-gradient(270deg, var(--bg-panel), var(--bg-card), var(--bg-panel));
            background-size: 200% 200%;
            animation: wave 6s ease-in-out infinite;
        }

        /* ----- header ----- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            gap: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .header-left h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f7e05e, #f5b041, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            animation: glow-title 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
        }
        .header-left h1::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, #f5b041, transparent);
            border-radius: 4px;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .control-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .control-btn:focus-visible { outline: 2px solid var(--accent-gold); }
        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .stat-badge:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 4px 30px var(--accent-glow);
        }
        .stat-badge .num {
            font-weight: 700;
            font-size: 18px;
            color: var(--accent-gold);
        }
        .stat-badge .num.green { color: var(--dot-done); }
        .stat-badge .num.danger { color: var(--dot-active); }
        .stat-badge .label { color: var(--text-muted); font-weight: 400; }
        .update-time {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.4;
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
        }
        .update-time .time-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .update-time .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-gold);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            pointer-events: auto;
            animation: fadeInUp 0.3s ease forwards;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .toast.warning { border-left-color: var(--dot-active); }
        .toast.success { border-left-color: var(--dot-done); }
        .toast .toast-close { background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:0 4px; }

        /* ----- timeline ----- */
        .timeline-wrapper {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px 20px 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 28px;
            position: relative;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: background 0.4s, border-color 0.4s;
        }
        .timeline-track {
            position: relative;
            height: 100px;
            width: 100%;
            padding: 0 6%;
        }
        .timeline-line {
            position: absolute;
            top: 50%;
            left: 6%;
            right: 6%;
            height: 5px;
            background: var(--line-bg);
            border-radius: 4px;
            transform: translateY(-50%);
            z-index: 1;
            box-shadow: 0 0 20px rgba(255,255,255,0.05), inset 0 0 8px rgba(0,0,0,0.5);
            overflow: visible;
        }
        .seg-fill {
            position: absolute;
            top: 0;
            height: 100%;
            border-radius: 4px;
            background: var(--line-fill);
            box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(245,176,65,0.1);
            transition: width 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s cubic-bezier(0.4,0,0.2,1);
            width: 0%;
            left: 0%;
        }
        .timeline-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%,-50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            background: #1a2332;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            will-change: transform;
        }
        .timeline-dot .dot-pct { font-size:17px; line-height:1.1; }
        .timeline-dot .dot-label { font-size:9px; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; opacity:0.8; margin-top:1px; text-align:center; max-width:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .timeline-dot.done { background:linear-gradient(135deg,#2b6a9e,#1d4a7a); border-color:#4a8ec4; box-shadow:0 0 30px rgba(42,106,158,0.4), inset 0 0 20px rgba(74,142,196,0.2); }
        .timeline-dot.active { background:linear-gradient(135deg,#c0392b,#e74c3c); border-color:#e74c3c; box-shadow:0 0 50px rgba(231,76,60,0.6), inset 0 0 30px rgba(231,76,60,0.3); animation:pulse-red 1.8s ease-in-out infinite; }
        .timeline-dot.active::after { border-color:rgba(231,76,60,0.3); animation:ring-pulse 1.8s ease-in-out infinite; }
        .timeline-dot.pending { background:linear-gradient(135deg,#2a3a4e,#1a2332); border-color:#3a4a5e; box-shadow:0 0 20px rgba(0,0,0,0.3); }
        .timeline-dot:hover { transform:translate(-50%,-50%) scale(1.12); z-index:5; }
        .timeline-dot:focus-visible { outline:2px solid var(--accent-gold); outline-offset:4px; }

        /* info panel */
        .info-panel {
            margin-top: 18px;
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 14px 22px;
            min-height: 56px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }
        .info-panel .info-placeholder { color: var(--text-muted); font-size:14px; }
        .info-panel .info-name { font-size:20px; font-weight:600; transition:color 0.3s; }
        .info-panel .info-name.status-done { color:var(--dot-done); text-shadow:0 0 30px rgba(76,217,160,0.3); }
        .info-panel .info-name.status-active { color:var(--accent-gold); text-shadow:0 0 30px var(--accent-glow); }
        .info-panel .info-name.status-pending { color:var(--text-muted); text-shadow:none; }
        .info-panel .info-details { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
        .info-panel .info-details .detail-item { display:flex; align-items:baseline; gap:6px; }
        .info-panel .info-details .detail-item .label { color:var(--text-muted); }

        /* phases */
        .phases-section {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .phase-block {
            background: var(--bg-panel);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 18px 22px 20px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .phase-block:hover {
            border-color: var(--accent-gold);
            box-shadow: var(--shadow);
        }
        .phase-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); letter-spacing:0.2px; }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress { font-size:14px; font-weight:500; color:var(--accent-gold); background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-cards { display:flex; flex-wrap:wrap; gap:12px; }
        .phase-card {
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 12px 18px;
            border: 1px solid var(--border-color);
            flex: 0 1 auto;
            min-width: 180px;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: var(--shadow);
            position: relative;
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }
        .phase-card:nth-child(1){ animation-delay:0.02s; }
        .phase-card:nth-child(2){ animation-delay:0.06s; }
        .phase-card:nth-child(3){ animation-delay:0.10s; }
        .phase-card:nth-child(4){ animation-delay:0.14s; }
        .phase-card:nth-child(5){ animation-delay:0.18s; }
        .phase-card:nth-child(6){ animation-delay:0.22s; }
        .phase-card:nth-child(7){ animation-delay:0.26s; }
        .phase-card:nth-child(8){ animation-delay:0.30s; }
        .phase-card:nth-child(9){ animation-delay:0.34s; }
        .phase-card:nth-child(10){ animation-delay:0.38s; }
        .phase-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-3px) scale(1.02);
            box-shadow: var(--shadow), 0 0 40px var(--accent-glow);
        }
        .phase-card:focus-visible { outline:2px solid var(--accent-gold); outline-offset:2px; }
        .phase-card.overdue { border-color: var(--dot-active); box-shadow: 0 0 20px rgba(231,76,60,0.3); }
        .phase-card .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .phase-card .card-name { font-size:14px; font-weight:500; color:var(--text-primary); flex:1; min-width:0; white-space:normal; word-break:break-word; }
        .phase-card .card-pct { font-size:16px; font-weight:700; color:var(--accent-gold); min-width:48px; text-align:right; flex-shrink:0; }
        .phase-card .card-pct.done { color:var(--dot-done); }
        .phase-card .card-pct.pending { color:var(--text-muted); }
        .phase-card .card-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 12px rgba(0,0,0,0.3); transition:box-shadow 0.3s; }
        .phase-card .card-status-dot.done { background:var(--dot-done); box-shadow:0 0 16px rgba(76,217,160,0.3); }
        .phase-card .card-status-dot.active { background:var(--dot-active); box-shadow:0 0 20px rgba(231,76,60,0.5); animation:pulse-dot 1.6s ease-in-out infinite; }
        .phase-card .card-status-dot.pending { background:var(--dot-pending); }
        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta span { display:flex; align-items:center; gap:4px; }
        .phase-card .card-meta .eta { color:var(--accent-gold); }

        /* modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 36px;
            max-width: 560px;
            width: 100%;
            border: 1px solid var(--border-color);
            box-shadow: 0 24px 80px rgba(0,0,0,0.8);
            animation: modal-in 0.4s cubic-bezier(0.4,0,0.2,1);
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal .modal-title { font-size:24px; font-weight:600; margin-bottom:16px; transition:color 0.3s; }
        .modal .modal-title.status-done { color:var(--dot-done); text-shadow:0 0 30px rgba(76,217,160,0.3); }
        .modal .modal-title.status-active { color:var(--accent-gold); text-shadow:0 0 30px var(--accent-glow); }
        .modal .modal-title.status-pending { color:var(--text-muted); text-shadow:none; }
        .modal .modal-body { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text-secondary); }
        .modal .modal-body .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .modal .modal-body .row .key { color:var(--text-muted); flex-shrink:0; margin-right:12px; }
        .modal .modal-body .row .value { font-weight:500; color:var(--text-primary); text-align:right; word-break:break-word; }
        .modal .modal-body .row .value.dependencies { font-weight:400; color:var(--text-muted); font-size:13px; }
        .modal .modal-close { margin-top:20px; background:var(--bg-card); border:1px solid var(--border-color); color:var(--text-secondary); padding:10px 24px; border-radius:40px; font-size:14px; cursor:pointer; transition:all 0.2s; width:100%; }
        .modal .modal-close:hover { border-color:var(--accent-gold); box-shadow:0 0 20px var(--accent-glow); }
        .modal .modal-close:focus-visible { outline:2px solid var(--accent-gold); }

        /* export bar */
        .export-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .export-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .export-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .export-btn:focus-visible { outline:2px solid var(--accent-gold); }

        /* analytics */
        .analytics-section {
            margin-top: 32px;
            background: var(--bg-panel);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: background 0.4s, border-color 0.4s;
        }
        .analytics-section .analytics-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            letter-spacing: 0.2px;
        }
        .analytics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .analytics-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        .analytics-card h3 {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 12px;
            letter-spacing: 0.2px;
        }
        .analytics-card canvas {
            width: 100% !important;
            height: auto !important;
            max-height: 160px;
            border-radius: 8px;
        }
        .analytics-card .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .analytics-card .chart-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .analytics-card .chart-legend .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }
        .analytics-card .risk-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .analytics-card .risk-item .risk-name { color: var(--text-secondary); }
        .analytics-card .risk-item .risk-score { font-weight:500; }
        .analytics-card .risk-item .risk-score.high { color: var(--dot-active); }
        .analytics-card .risk-item .risk-score.medium { color: var(--accent-gold); }
        .analytics-card .risk-item .risk-score.low { color: var(--dot-done); }

        /* theme modal */
        .theme-modal .theme-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .theme-modal .theme-option {
            padding: 12px 8px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .theme-modal .theme-option:hover {
            border-color: var(--accent-gold);
            transform: scale(1.03);
        }
        .theme-modal .theme-option.active {
            border-color: var(--accent-gold);
            background: var(--accent-glow);
        }
        .theme-modal .theme-option .color-preview {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 0 auto 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* language modal */
        .lang-modal .lang-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .lang-modal .lang-option {
            padding: 12px 8px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .lang-modal .lang-option:hover {
            border-color: var(--accent-gold);
            transform: scale(1.03);
        }
        .lang-modal .lang-option.active {
            border-color: var(--accent-gold);
            background: var(--accent-glow);
        }

        /* responsive */
        @media (max-width: 820px) {
            body { padding: 16px 12px 30px; }
            .header { flex-direction: column; align-items: stretch; gap: 12px; }
            .header-left h1 { font-size: 38px; }
            .header-right { justify-content: flex-start; gap: 12px; }
            .timeline-track { height: 80px; padding: 0 4%; }
            .timeline-dot { width: 52px; height: 52px; }
            .timeline-dot .dot-pct { font-size: 14px; }
            .timeline-dot .dot-label { font-size: 7px; max-width: 44px; }
            .info-panel { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 16px; }
            .info-panel .info-details { flex-direction: column; gap: 4px; }
            .phase-header .phase-title { font-size: 16px; }
            .phase-header .phase-meta { font-size: 12px; gap: 8px; flex-wrap: wrap; }
            .phase-cards { flex-direction: column; }
            .phase-card { max-width: 100%; min-width: 0; }
            .modal { padding: 24px; }
            .analytics-grid { grid-template-columns: 1fr; }
            .theme-modal .theme-options, .lang-modal .lang-options { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .header-left h1 { font-size: 30px; }
            .stat-badge { padding: 4px 12px; font-size: 12px; }
            .stat-badge .num { font-size: 15px; }
            .timeline-track { height: 70px; padding: 0 2%; }
            .timeline-dot { width: 44px; height: 44px; }
            .timeline-dot .dot-pct { font-size: 12px; }
            .timeline-dot .dot-label { font-size: 6px; max-width: 36px; }
            .phase-block { padding: 12px 14px; }
            .theme-modal .theme-options, .lang-modal .lang-options { grid-template-columns: 1fr; }
        }

        /* print */
        @media print {
            .export-bar, .control-btn, .update-time, .stat-badge .label { display: none; }
            .header { margin-bottom: 16px; }
            .timeline-wrapper, .phase-block, .analytics-section { break-inside: avoid; }
            body { background: #fff; color: #000; }
            .phase-card, .analytics-card { border: 1px solid #ccc; background: #f9f9f9; }
            .phase-card .card-name, .phase-header .phase-title, .analytics-card h3 { color: #000; }
            .phase-card .card-pct, .phase-header .phase-progress { color: #000; }
            .info-panel { border: 1px solid #ccc; background: #f9f9f9; }
        }
    </style>
</head>
<body>

    <div class="dashboard" id="dashboard">
        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <h1>Arion</h1>

            <button class="export-btn" id="exportPNG" data-lang="export-png">🖼️ PNG</button>
            <button class="export-btn" id="exportCSV" data-lang="export-csv">📊 CSV</button>

        <!-- ===== TIMELINE ===== -->
        <div class="timeline-wrapper wave-bg">

                <div class="info-details" id="infoDetails" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== PHASES SECTION ===== -->
        <div class="phases-section" id="phasesContainer"></div>

        <!-- ===== ANALYTICS SECTION ===== -->
        <div class="analytics-section" id="analyticsSection">
            <div class="analytics-title" data-lang="analytics-title">📊 Аналитика проекта</div>
            <div class="analytics-grid">
                <!-- Бюджет -->
                <div class="analytics-card">
                    <h3 data-lang="budget-title">Бюджет проекта ($ млн)</h3>
                    <canvas id="budgetChart" width="400" height="160"></canvas>
                    <div class="chart-legend" id="budgetLegend">
                        <div class="legend-item">
                            <span class="legend-color" style="background:var(--dot-active);"></span>
                            <span data-lang="budget-spent">Использовано</span>
                        </div>
                        <div class="legend-item">
                            <span class="legend-color" style="background:var(--dot-done);"></span>
                            <span data-lang="budget-remaining">Остаток</span>
                        </div>
                    </div>
                </div>
                <!-- Риски -->
                <div class="analytics-card">
                    <h3 data-lang="risks-title">Оценка рисков</h3>
                    <div id="riskList"></div>
                </div>
            </div>
        </div>

        <!-- ===== MODAL (основная) ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-title" id="modalTitle">Название</div>
                <div class="modal-body" id="modalBody"></div>
                <button class="modal-close" id="modalClose" data-lang="close">Закрыть</button>
            </div>

        <!-- ===== MODAL ДЛЯ ВЫБОРА ТЕМЫ ===== -->
        <div class="modal-overlay" id="themeModalOverlay">
            <div class="modal theme-modal">
                <div class="modal-title" style="color:var(--text-primary);" data-lang="theme-title">Выберите тему</div>

                <button class="modal-close" id="themeModalClose" data-lang="close">Закрыть</button>

        <div class="modal-overlay" id="langModalOverlay">
            <div class="modal lang-modal">
                <div class="modal-title" style="color:var(--text-primary);" data-lang="lang-title">Выберите язык</div>
                <div class="lang-options" id="langOptions"></div>
                <button class="modal-close" id="langModalClose" data-lang="close">Закрыть</button>
            </div>
        </div>

        <!-- ===== TOAST CONTAINER ===== -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

        // ============================================================
        //  STATE
        // ============================================================

        let currentTheme = localStorage.getItem('arion-theme') || 'dark';
        let currentLang = localStorage.getItem('arion-lang') || 'ru';

        // ============================================================
        //  HELPERS
        // ============================================================

        function getPhaseById(id) { return phases.find(p => p.id === id); }

        function getSubsByPhase(phaseId) { return subPhases.filter(s => s.phaseId === phaseId); }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getOverallProgress() {
            if (!subPhases.length) return 0;
            const sum = subPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subPhases.length);
        }

        function getCompletedCount() { return subPhases.filter(s => s.pct >= 100).length; }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getSubName(id) {
            const sub = subPhases.find(s => s.id === id);
            return sub ? sub.name : id;
        }

        function getLastMonday() {
            const now = new Date();
            const day = now.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            const monday = new Date(now);
            monday.setDate(now.getDate() - diff);
            monday.setHours(0,0,0,0);
            return monday;
        }

        function calculateForecast(sub) {
            if (!sub.startDate || sub.pct <= 0 || sub.pct >= 100) return null;
            const start = new Date(sub.startDate);
            const refDate = getLastMonday();
            const elapsed = (refDate - start) / (1000 * 60 * 60 * 24);
            if (elapsed <= 0) return null;
            const rate = sub.pct / elapsed;
            if (rate <= 0) return null;
            const daysLeft = (100 - sub.pct) / rate;
            return new Date(refDate.getTime() + daysLeft * 86400000);
        }

        function formatForecast(sub) {
            const fc = calculateForecast(sub);
            if (!fc) return '—';
            return fc.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function isOverdue(sub) {
            if (sub.pct >= 100) return false;
            const fc = calculateForecast(sub);
            if (!fc) return false;
            const now = new Date();
            return fc < now;
        }

        // Локализация
        function t(key, ...args) {
            const dict = langData[currentLang] || langData['ru'];
            let val = dict[key];
            if (typeof val === 'function') {
                return val(...args);
            }
            if (typeof val === 'string') {
                return val;
            }
            return key;
        }

        function getPhaseLabel(id) {
            const dict = langData[currentLang] || langData['ru'];
            const labels = dict['phase-label'] || {};
            return labels[id] || id;
        }

        function getStatusLabel(pct) {
            const status = getStatusInfo(pct);
            const dict = langData[currentLang] || langData['ru'];
            switch(status.status) {
                case 'done': return dict['status-done'] || 'Завершён';
                case 'active': return dict['status-active'] || 'В процессе';
                default: return dict['status-pending'] || 'Не начат';
            }
        }

        // ============================================================
        //  RENDER
        // ============================================================

        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            let line = document.getElementById('timelineLine');
            if (!line) {
                line = document.createElement('div');
                line.id = 'timelineLine';
                line.className = 'timeline-line';
                track.appendChild(line);
            }
            line.querySelectorAll('.seg-fill').forEach(el => el.remove());

            const n = phases.length;
            const leftMargin = 6, rightMargin = 6, range = 100 - leftMargin - rightMargin;
            const dotPositions = phases.map((_, i) => leftMargin + (i / (n - 1)) * range);

            phases.forEach((phase, index) => {
                const progress = getPhaseProgress(phase.id);
                const status = getStatusInfo(progress);
                const x = dotPositions[index];
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = x + '%';
                dot.dataset.phaseId = phase.id;
                dot.setAttribute('tabindex', '0');
                dot.setAttribute('role', 'button');
                dot.setAttribute('aria-label', `Фаза ${phase.label}, прогресс ${progress}%`);

                const pctSpan = document.createElement('span');
                pctSpan.className = 'dot-pct';
                pctSpan.textContent = progress + '%';
                dot.appendChild(pctSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'dot-label';
                labelSpan.textContent = phase.label.split(' ')[0];
                dot.appendChild(labelSpan);

                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showPhaseInfo(phase.id);
                });
                dot.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        showPhaseInfo(phase.id);
                    }
                });

                track.appendChild(dot);
            });

            for (let i = 0; i < n - 1; i++) {
                const leftPos = dotPositions[i];
                const rightPos = dotPositions[i + 1];
                const segmentWidth = rightPos - leftPos;
                const progress = getPhaseProgress(phases[i].id);
                const fillWidth = (progress / 100) * segmentWidth;
                if (fillWidth > 0) {
                    const fill = document.createElement('div');
                    fill.className = 'seg-fill';
                    fill.style.left = leftPos + '%';
                    fill.style.width = fillWidth + '%';
                    line.appendChild(fill);
                }
            }
        }

        function showPhaseInfo(phaseId) {
            const phase = getPhaseById(phaseId);
            if (!phase) return;
            const panel = document.getElementById('infoPanel');
            const placeholder = panel.querySelector('.info-placeholder');
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');

            placeholder.style.display = 'none';
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';

            const progress = getPhaseProgress(phaseId);
            const status = getStatusInfo(progress);
            nameEl.textContent = getPhaseLabel(phase.id);
            nameEl.className = 'info-name status-' + status.status;

            const subs = getSubsByPhase(phaseId);
            const completed = subs.filter(s => s.pct >= 100).length;
            const start = formatDate(phase.startDate);
            const end = formatDate(phase.endDate);
            const budget = phase.budget ? '$' + phase.budget + ' млн' : '—';

            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">${t('progress')}:</span> ${progress}%</div>
                <div class="detail-item"><span class="label">${t('phase')}:</span> ${getPhaseLabel(phase.id)}</div>
                <div class="detail-item"><span class="label">${t('status')}:</span> ${getStatusLabel(progress)}</div>
                <div class="detail-item"><span class="label">${t('start')}:</span> ${start}</div>
                <div class="detail-item"><span class="label">${t('end')}:</span> ${end}</div>
                <div class="detail-item"><span class="label">Бюджет:</span> ${budget}</div>
            `;
        }

        function renderPhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            phases.forEach(phase => {
                const subs = getSubsByPhase(phase.id);
                if (!subs.length) return;
                const progress = getPhaseProgress(phase.id);
                const start = formatDate(phase.startDate);
                const end = formatDate(phase.endDate);
                const budget = phase.budget ? '$' + phase.budget + ' млн' : '—';

                const block = document.createElement('div');
                block.className = 'phase-block';

                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <span class="phase-title">${getPhaseLabel(phase.id)}</span>
                    <div class="phase-meta">
                        <span>${t('start')}: ${start}</span>
                        <span>${t('end')}: ${end}</span>
                        <span>Бюджет: ${budget}</span>
                    </div>
                    <span class="phase-progress">${progress}%</span>
                `;
                block.appendChild(header);

                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'phase-cards';

                const sorted = [...subs].sort((a, b) => a.id.localeCompare(b.id));
                sorted.forEach((sub, idx) => {
                    const card = createPhaseCard(sub, idx);
                    cardsWrap.appendChild(card);
                });

                block.appendChild(cardsWrap);
                container.appendChild(block);
            });
        }

        function createPhaseCard(sub, index) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.dataset.id = sub.id;
            card.style.setProperty('--i', index + 1);
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Подэтап ${sub.name}, прогресс ${sub.pct}%`);

            const overdue = isOverdue(sub);
            if (overdue) {
                card.classList.add('overdue');
                showToast(t('toast-overdue', sub.name), 'warning');
            }

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startDate) {
                meta.innerHTML += `<span>${t('start')}: ${formatDate(sub.startDate)}</span>`;
            }
            if (sub.endDate) {
                meta.innerHTML += `<span>${t('end')}: ${formatDate(sub.endDate)}</span>`;
            }
            if (sub.pct > 0 && sub.pct < 100) {
                const forecast = formatForecast(sub);
                if (forecast !== '—') {
                    meta.innerHTML += `<span class="eta">${t('forecast')}: ${forecast}</span>`;
                }
            }
            card.appendChild(meta);

            card.addEventListener('click', function() { openModal(sub); });
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(sub);
                }
            });

            return card;
        }

        // ============================================================
        //  MODAL (основной)
        // ============================================================

        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const status = getStatusInfo(sub.pct);
            title.textContent = sub.name;
            title.className = 'modal-title status-' + status.status;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const phase = getPhaseById(sub.phaseId);
            const fields = [
                { key: t('phase'), value: phase ? getPhaseLabel(phase.id) : '—' },
                { key: t('status'), value: getStatusLabel(sub.pct) },
                { key: t('progress'), value: sub.pct + '%' },
                { key: t('start'), value: formatDate(sub.startDate) },
                { key: t('end'), value: formatDate(sub.endDate) },
                { key: t('forecast'), value: (sub.pct > 0 && sub.pct < 100) ? formatForecast(sub) : '—' },
                { key: t('overdue'), value: isOverdue(sub) ? t('yes') : t('no') },
                { key: t('description'), value: sub.description || '—' },
                { key: t('characteristics'), value: sub.characteristics || '—' },
            ];
            if (sub.dependencies && sub.dependencies.length) {
                const depNames = sub.dependencies.map(id => getSubName(id)).join(', ');
                fields.push({ key: t('dependencies'), value: depNames, extraClass: 'dependencies' });
            }
            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const valueClass = f.extraClass ? `value ${f.extraClass}` : 'value';
                row.innerHTML = `<span class="key">${f.key}</span><span class="${valueClass}">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
            document.getElementById('modalClose').focus();
        }

        // ============================================================
        //  TOAST
        // ============================================================

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close">&times;</button>
            `;
            container.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ============================================================
        //  ANALYTICS
        // ============================================================

        function renderAnalytics() {
            const ctxBudget = document.getElementById('budgetChart').getContext('2d');
            const totalBudget = extraData.totalBudget;
            const spent = extraData.spentBudget;
            const remaining = totalBudget - spent;
            const data = [spent, remaining];
            const colors = [
                getComputedStyle(document.documentElement).getPropertyValue('--dot-active').trim(),
                getComputedStyle(document.documentElement).getPropertyValue('--dot-done').trim()
            ];

            const w = ctxBudget.canvas.width;
            const h = ctxBudget.canvas.height;
            ctxBudget.clearRect(0, 0, w, h);
            const cx = w/2, cy = h/2, r = Math.min(w, h) * 0.35;
            let startAngle = -Math.PI/2;
            const total = data.reduce((a,b) => a+b, 0);
            if (total > 0) {
                data.forEach((val, i) => {
                    const slice = (val / total) * 2 * Math.PI;
                    ctxBudget.beginPath();
                    ctxBudget.moveTo(cx, cy);
                    ctxBudget.arc(cx, cy, r, startAngle, startAngle + slice);
                    ctxBudget.closePath();
                    ctxBudget.fillStyle = colors[i];
                    ctxBudget.shadowColor = 'rgba(0,0,0,0.2)';
                    ctxBudget.shadowBlur = 8;
                    ctxBudget.fill();
                    ctxBudget.shadowBlur = 0;
                    startAngle += slice;
                });
            }

            // Легенда уже в HTML — обновляем только текст
            document.querySelector('#budgetLegend .legend-item:first-child span:last-child').textContent = t('budget-spent');
            document.querySelector('#budgetLegend .legend-item:last-child span:last-child').textContent = t('budget-remaining');

            // Риски
            const riskList = document.getElementById('riskList');
            riskList.innerHTML = extraData.risks.map(r => {
                const score = (r.probability * r.impact * 100).toFixed(0);
                let cls = 'low';
                if (score > 30) cls = 'medium';
                if (score > 60) cls = 'high';
                return `<div class="risk-item">
                    <span class="risk-name">${r.name}</span>
                    <span class="risk-score ${cls}">${score}%</span>
                </div>`;
            }).join('');
        }

        // ============================================================
        //  STATS & TIME
        // ============================================================

        function updateStats() {
            const total = subPhases.length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();
            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;

            const overdue = subPhases.filter(s => isOverdue(s)).length;
            const badge = document.getElementById('overdueBadge');
            const countEl = document.getElementById('overdueCount');
            if (overdue > 0) {
                badge.style.display = 'flex';
                countEl.textContent = overdue;
            } else {
                badge.style.display = 'none';
            }

            renderAnalytics();
            updateLang();
        }

        // ============================================================
        //  ЛОКАЛИЗАЦИЯ ИНТЕРФЕЙСА
        // ============================================================

        function updateLang() {
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.dataset.lang;
                const text = t(key);
                if (text) el.textContent = text;
            });
            // Обновить заголовки фаз (они перерендерятся при следующем обновлении)
            // Но мы перерендерим фазы при смене языка
            renderPhases();
            // Обновить info panel если открыт
            // Просто перерендерим timeline и фазы
            renderTimeline();
            renderPhases();
            updateStats();
        }

        // ============================================================
        //  EXPORT
        // ============================================================

        function exportPDF() { window.print(); }

        function exportPNG() {
            const body = document.body;
            const originalBg = body.style.background;
            const originalBgColor = getComputedStyle(body).backgroundColor;
            body.style.background = originalBgColor;
            const element = document.getElementById('dashboard');
            html2canvas(element, {
                scale: 2,
                backgroundColor: originalBgColor,
                useCORS: true,
                allowTaint: true,
            }).then(canvas => {
                body.style.background = originalBg;
                const link = document.createElement('a');
                link.download = 'Arion_dashboard.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                body.style.background = originalBg;
                showToast(t('toast-png-error') + err.message, 'warning');
            });
        }

        function exportCSV() {
            const headers = ['ID', t('phase'), t('progress'), t('start'), t('end'), t('status'), t('overdue')];
            const rows = subPhases.map(s => {
                const phase = getPhaseById(s.phaseId);
                return [
                    s.id,
                    phase ? getPhaseLabel(phase.id) : '—',
                    s.pct + '%',
                    formatDate(s.startDate),
                    formatDate(s.endDate),
                    getStatusLabel(s.pct),
                    isOverdue(s) ? t('yes') : t('no')
                ];
            });
            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Arion_status.csv';
            link.click();
            showToast(t('toast-csv'), 'success');
        }

        // ============================================================
        //  THEME
        // ============================================================

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const optionsContainer = document.getElementById('themeOptions');
            optionsContainer.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `
                    <div class="color-preview" style="background:${t.color};"></div>
                    ${t.label}
                `;
                div.addEventListener('click', () => {
                    applyTheme(t.id);
                    overlay.classList.remove('active');
                    showToast(t('toast-theme', t.label), 'success');
                });
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            document.getElementById('themeModalClose').focus();
        }

        // ============================================================
        //  LANGUAGE
        // ============================================================

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('arion-lang', lang);
            updateLang();
            // Обновить активную кнопку в модалке
            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.toggle('active', el.dataset.lang === lang);
            });
        }

        function openLangModal() {
            const overlay = document.getElementById('langModalOverlay');
            const optionsContainer = document.getElementById('langOptions');
            optionsContainer.innerHTML = '';
            Object.keys(languages).forEach(id => {
                const div = document.createElement('div');
                div.className = 'lang-option' + (id === currentLang ? ' active' : '');
                div.dataset.lang = id;
                div.textContent = languages[id].label;
                div.addEventListener('click', () => {
                    applyLanguage(id);
                    overlay.classList.remove('active');
                    showToast(`Язык: ${languages[id].label}`, 'success');
                });
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            document.getElementById('langModalClose').focus();
        }

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            applyTheme(currentTheme);
            applyLanguage(currentLang);

            renderTimeline();
            renderPhases();
            updateStats();

            const overdueCount = subPhases.filter(s => isOverdue(s)).length;
            if (overdueCount > 0) {
                showToast(t('toast-overdue-many', overdueCount), 'warning');
            }

            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
            });
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', function() {
                document.getElementById('themeModalOverlay').classList.remove('active');
            });
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('langToggle').addEventListener('click', openLangModal);
            document.getElementById('langModalClose').addEventListener('click', function() {
                document.getElementById('langModalOverlay').classList.remove('active');
            });
            document.getElementById('langModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('modalOverlay').classList.remove('active');
                    document.getElementById('themeModalOverlay').classList.remove('active');
                    document.getElementById('langModalOverlay').classList.remove('active');
                }
            });

            setInterval(updateStats, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
