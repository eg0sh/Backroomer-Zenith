        }
        [data-theme="matrix"] {

            --bg-card: rgba(0, 20, 0, 0.9);

            --text-secondary: #66ff66;

            --dot-pending: #006600;

        [data-theme="space"] {

        [data-theme="retro"] {
            --bg-body: #f0e8d0;
            --bg-panel: rgba(240, 232, 208, 0.85);
            --bg-card: rgba(250, 242, 220, 0.9);
            --border-color: #b0a080;
            --text-primary: #4a3a2a;
            --text-secondary: #6a5a4a;
            --text-muted: #8a7a6a;

            --shadow: 0 8px 40px rgba(0, 0, 0, 0.1);
            --dot-done: #6a8a6a;
            --dot-active: #b06a5a;
            --dot-pending: #b0a080;
            --gradient-start: #b0a080;
            --gradient-end: #8a7a50;
            --version-color: #8a7a6a;
        }

        /* ----- base ----- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        /* ===== Верхнее меню (улучшенное) ===== */
        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .top-menu .logo-block {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .logo {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .top-menu .logo-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.3px;
            border-left: 1px solid var(--border-color);
            padding-left: 12px;
            display: none;
        }
        @media (min-width: 600px) {
            .top-menu .logo-sub { display: inline-block; }
        }

        .top-menu .nav-links {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            align-items: center;
        }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-menu .nav-links a .nav-icon {
            font-size: 18px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .top-menu .nav-links a:hover .nav-icon,
        .top-menu .nav-links a.active .nav-icon {
            opacity: 1;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        .top-menu .right-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .top-menu .right-info .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .top-menu .right-info .status-indicator .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .top-menu .right-info .header-time {
            font-size: 13px;
            color: var(--text-muted);
        }
        .top-menu .right-info .version-badge {
            font-size: 11px;
            color: var(--version-color);
            background: var(--bg-card);
            padding: 2px 10px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        /* ----- контент главной ----- */
        .main-content {
            max-width: 1200px;
            width: 100%;
            padding: 60px 24px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .main-content h1 {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }
        .main-content .subhead {
            font-size: 18px;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .main-content .cards {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .main-content .card {
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 32px 28px;
            flex: 1 0 220px;
            max-width: 320px;
            min-height: 200px;
            transition: all 0.3s;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .main-content .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 50px var(--accent-glow);
        }
        .main-content .card .icon {
            font-size: 44px;
            margin-bottom: 14px;
            display: block;
        }
        .main-content .card h3 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }
        .main-content .card p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        /* ----- версия внизу ----- */
        .version {
            text-align: center;
            font-size: 12px;
            color: var(--version-color);
            padding: 16px 0 8px;
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
            letter-spacing: 0.3px;
        }

        /* ----- адаптив ----- */
        @media (max-width: 820px) {
            .top-menu { padding: 10px 16px; flex-direction: column; align-items: stretch; gap:8px; }
            .top-menu .nav-links { justify-content: center; }
            .top-menu .right-info { justify-content: center; }
            .main-content { padding: 40px 16px 30px; }
            .main-content h1 { font-size: 36px; }
            .main-content .cards { flex-direction: column; align-items: center; }
            .main-content .card { max-width: 100%; width: 100%; min-height: 140px; padding: 24px 20px; }
        }
        @media (max-width: 480px) {
            .main-content h1 { font-size: 28px; }
            .main-content .subhead { font-size: 15px; }
            .main-content .card .icon { font-size: 32px; }
            .main-content .card h3 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <!-- ===== ВЕРХНЕЕ МЕНЮ (улучшенное) ===== -->
    <header class="top-menu">
        <div class="logo-block">
            <div class="logo">Zenith</div>
            <div class="logo-sub">Управление проектами</div>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">
                <span class="nav-icon">🏠</span> Главная
            </a>
            <a href="arion.html">
                <span class="nav-icon">⛰️</span> Arion
            </a>
            <a href="analysis.html">
                <span class="nav-icon">📊</span> Аналитика
            </a>
        </nav>
        <div class="right-info">
            <div class="status-indicator">
                <span class="dot"></span>
                <span>Система работает</span>
            </div>
            <span class="header-time" id="headerTime">—</span>
            <span class="version-badge">v1.2.3</span>
        </div>
    </header>

    <!-- ===== КОНТЕНТ ===== -->
    <main class="main-content">
        <h1>Добро пожаловать</h1>
        <p class="subhead">Центр управления проектами Zenith. Выберите раздел для перехода.</p>

        <div class="cards">
            <a href="arion.html" class="card">
                <span class="icon">⛰️</span>
                <h3>Arion</h3>
                <p>Дашборд статуса строительства</p>
            </a>
            <a href="analysis.html" class="card">
                <span class="icon">📊</span>
                <h3>Аналитика</h3>
                <p>Прогнозы и события Закулисья</p>
            </a>
        </div>

        <!-- ===== ВЕРСИЯ ===== -->
        <div class="version">v1.2.3</div>
    </main>

    <script>
        // обновление времени в шапке
        function updateTime() {
            const now = new Date();
            document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        updateTime();
        setInterval(updateTime, 60000);

        // Тема синхронизируется с localStorage (применяется на всех страницах)
        const savedTheme = localStorage.getItem('arion-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
