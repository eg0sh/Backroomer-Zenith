        // ============================================================
        //  ОБРАБОТЧИКИ СОБЫТИЙ (ДЕЛЕГИРОВАНИЕ)
        // ============================================================

        function setupEventDelegation() {
            // 1. Закрытие модалок по клику на .modal-close
            document.addEventListener('click', function(e) {
                const closeBtn = e.target.closest('.modal-close');
                if (closeBtn) {
                    const overlayId = closeBtn.dataset.close;
                    if (overlayId) {
                        const overlay = document.getElementById(overlayId);
                        if (overlay) {
                            overlay.classList.remove('active');
                            e.preventDefault();
                            e.stopPropagation();
                        }
                    }
                }
            });

            // 2. Закрытие модалок по клику на фон (overlay)
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('modal-overlay')) {
                    e.target.classList.remove('active');
                }
            });

            // 3. Открытие модалки темы
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) {
                themeToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    openThemeModal();
                });
            }

            // 4. Открытие модалки языка
            const langToggle = document.getElementById('langToggle');
            if (langToggle) {
                langToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    openLangModal();
                });
            }

            // 5. Выбор темы (делегирование на #themeOptions)
            document.getElementById('themeOptions').addEventListener('click', function(e) {
                const option = e.target.closest('.theme-option');
                if (option) {
                    const themeId = option.dataset.themeId;
                    if (themeId) {
                        applyTheme(themeId);
                        document.getElementById('themeModalOverlay').classList.remove('active');
                        showToast(`${t('themeBtn')}: ${themes.find(t => t.id === themeId)?.label || themeId}`, 'success');
                    }
                }
            });

            // 6. Выбор языка (делегирование на #langOptions)
            document.getElementById('langOptions').addEventListener('click', function(e) {
                const option = e.target.closest('.lang-option');
                if (option) {
                    const langId = option.dataset.langId;
                    if (langId) {
                        applyLanguage(langId);
                        document.getElementById('langModalOverlay').classList.remove('active');
                        showToast(`Язык: ${languages.find(l => l.id === langId)?.label || langId}`, 'success');
                    }
                }
            });

            // 7. Экспорт
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            // 8. ESC для закрытия всех модалок
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal-overlay.active').forEach(el => el.classList.remove('active'));
                }
            });
        }

        // ============================================================
        //  ФУНКЦИИ ОТКРЫТИЯ МОДАЛОК
        // ============================================================

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const optionsContainer = document.getElementById('themeOptions');
            optionsContainer.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.dataset.themeId = t.id;
                div.innerHTML = `
                    <div class="color-preview" style="background:${t.color};"></div>
                    ${t.label}
                `;
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            // Фокус на первую опцию для удобства
            const firstOption = optionsContainer.querySelector('.theme-option');
            if (firstOption) firstOption.focus();
        }

        function openLangModal() {
            const overlay = document.getElementById('langModalOverlay');
            const optionsContainer = document.getElementById('langOptions');
            optionsContainer.innerHTML = '';
            languages.forEach(l => {
                const div = document.createElement('div');
                div.className = 'lang-option' + (l.id === currentLang ? ' active' : '');
                div.dataset.langId = l.id;
                div.textContent = l.label;
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            const firstOption = optionsContainer.querySelector('.lang-option');
            if (firstOption) firstOption.focus();
        }

        // ============================================================
        //  ПРИМЕНЕНИЕ ТЕМЫ И ЯЗЫКА
        // ============================================================

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function applyLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('arion-lang', lang);
            applyTranslations();
            renderPhases();
            renderTimeline();
            updateStats();
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        function init() {
            applyTheme(currentTheme);
            applyLanguage(currentLang);

            renderTimeline();
            renderPhases();
            updateStats();

            // Настройка делегирования событий
            setupEventDelegation();

            // Проверка просрочек
            const overdueCount = subPhases.filter(s => isOverdue(s)).length;
            if (overdueCount > 0) {
                showToast(`⚠️ ${overdueCount} ${t('exceededLabel')}`, 'warning');
            }

            // Обновление времени каждую минуту
            setInterval(updateStats, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
