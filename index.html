<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arion · Статус проекта</title>
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e14;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            padding: 20px 24px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
        }

        /* ----- scrollbar ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f2a;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7a8f;
        }

        /* ----- header ----- */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }

        .header-left h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f5d6a8, #f5b041);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(245, 176, 65, 0.15);
            margin: 0;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        .stat-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #141b26;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #25303e;
            font-size: 14px;
        }

        .stat-badge .num {
            font-weight: 700;
            font-size: 18px;
            color: #f5b041;
        }
        .stat-badge .num.green {
            color: #4cd9a0;
        }
        .stat-badge .num.gold {
            color: #f5b041;
        }
        .stat-badge .label {
            color: #8a9bb5;
            font-weight: 400;
        }

        .update-time {
            font-size: 13px;
            color: #5a6a7e;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.4;
        }
        .update-time .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4cd9a0;
            animation: pulse-dot 2s ease-in-out infinite;
            margin-right: 6px;
        }
        .update-time .time-row {
            display: flex;
            align-items: center;
        }
        .update-time .date-range {
            font-size: 12px;
            color: #5a6a7e;
            margin-top: 2px;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ----- timeline (шкала с кружками) ----- */
        .timeline-wrapper {
            background: #111822;
            border-radius: 20px;
            padding: 30px 20px 20px;
            border: 1px solid #1e2938;
            margin-bottom: 28px;
            position: relative;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
            overflow-y: visible;
        }

        .timeline-track {
            position: relative;
            height: 80px;
            width: 100%;
            min-width: 600px;
            /* чтобы не сжималось слишком */;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: #1a2332;
            border-radius: 4px;
            transform: translateY(-50%);
            z-index: 1;
        }

        .timeline-line .phase-fill {
            height: 100%;
            border-radius: 4px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.3;
            transition: width 0.6s ease;
        }

        .timeline-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            z-index: 2;
            transition: all 0.2s ease;
            background: #2a3a4e;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .timeline-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .timeline-dot.done {
            background: #2b6a9e;
            border-color: #4a8ec4;
            box-shadow: 0 0 20px rgba(42, 106, 158, 0.3);
        }

        .timeline-dot.active {
            background: #c0392b;
            border-color: #e74c3c;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.6);
            animation: pulse-red 1.6s ease-in-out infinite;
        }

        .timeline-dot.active::after {
            border-color: rgba(231, 76, 60, 0.4);
            animation: ring-pulse 1.6s ease-in-out infinite;
        }

        .timeline-dot.pending {
            background: #2a3a4e;
            border-color: #3a4a5e;
            box-shadow: none;
        }

        .timeline-dot:hover {
            transform: translate(-50%, -50%) scale(1.12);
            z-index: 5;
        }

        .timeline-dot .dot-label {
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .timeline-dot.done .dot-label {
            color: #b0d4f0;
        }
        .timeline-dot.active .dot-label {
            color: #fff;
        }
        .timeline-dot.pending .dot-label {
            color: #8a9bb5;
        }

        @keyframes pulse-red {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(231, 76, 60, 0.4);
            }
            50% {
                box-shadow: 0 0 50px rgba(231, 76, 60, 0.8);
            }
        }

        @keyframes ring-pulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .timeline-dot .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 12px);
            left: 50%;
            transform: translateX(-50%);
            background: #0f1722;
            border: 1px solid #2a3a4e;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #e8edf5;
            white-space: nowrap;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            z-index: 10;
        }

        .timeline-dot:hover .tooltip {
            display: block;
        }

        /* ----- информационная панель (по клику на кружок) ----- */
        .info-panel {
            margin-top: 16px;
            background: #141c28;
            border-radius: 16px;
            border: 1px solid #1e2938;
            padding: 14px 20px;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: all 0.3s ease;
        }

        .info-panel .info-placeholder {
            color: #5a6a7e;
            font-size: 14px;
        }

        .info-panel .info-name {
            font-size: 18px;
            font-weight: 600;
            color: #f5b041;
        }

        .info-panel .info-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #b0c4de;
        }

        .info-panel .info-details .detail-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .info-panel .info-details .detail-item .label {
            color: #5a6a7e;
        }

        /* ----- нижняя секция: фазы с плашками ----- */
        .phases-section {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .phase-block {
            background: #111822;
            border-radius: 20px;
            border: 1px solid #1e2938;
            padding: 18px 22px 20px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
            transition: border-color 0.2s;
        }

        .phase-block:hover {
            border-color: #2a3a4e;
        }

        .phase-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .phase-header .phase-title {
            font-size: 18px;
            font-weight: 600;
            color: #d0dcec;
            letter-spacing: 0.2px;
        }

        .phase-header .phase-progress {
            font-size: 14px;
            font-weight: 500;
            color: #f5b041;
            background: #1a2332;
            padding: 4px 16px;
            border-radius: 40px;
        }

        .phase-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .phase-card {
            background: #141c28;
            border-radius: 14px;
            padding: 12px 18px;
            border: 1px solid #1e2938;
            flex: 0 1 auto;
            min-width: 140px;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .phase-card:hover {
            border-color: #3a4a5e;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .phase-card .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .phase-card .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #d0dcec;
        }

        .phase-card .card-pct {
            font-size: 16px;
            font-weight: 700;
            color: #f5b041;
        }

        .phase-card .card-pct.done {
            color: #4cd9a0;
        }
        .phase-card .card-pct.pending {
            color: #5a6a7e;
        }

        .phase-card .card-status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 6px;
        }

        .phase-card .card-status-dot.done {
            background: #4cd9a0;
            box-shadow: 0 0 12px rgba(76, 217, 160, 0.3);
        }
        .phase-card .card-status-dot.active {
            background: #e74c3c;
            box-shadow: 0 0 16px rgba(231, 76, 60, 0.5);
            animation: pulse-dot 1.6s ease-in-out infinite;
        }
        .phase-card .card-status-dot.pending {
            background: #3a4a5e;
        }

        .phase-card .card-meta {
            font-size: 11px;
            color: #5a6a7e;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }

        .phase-card .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ----- модальное окно для деталей ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #111822;
            border-radius: 24px;
            padding: 30px 34px;
            max-width: 520px;
            width: 100%;
            border: 1px solid #2a3a4e;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: modal-in 0.3s ease;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: #f5b041;
            margin-bottom: 16px;
        }

        .modal .modal-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 15px;
            color: #b0c4de;
        }

        .modal .modal-body .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #1a2332;
        }

        .modal .modal-body .row .key {
            color: #5a6a7e;
        }

        .modal .modal-body .row .value {
            font-weight: 500;
            color: #d0dcec;
            text-align: right;
        }

        .modal .modal-close {
            margin-top: 20px;
            background: #1a2332;
            border: none;
            color: #b0c4de;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .modal .modal-close:hover {
            background: #2a3a4e;
        }

        /* ----- responsive ----- */
        @media (max-width: 820px) {
            body {
                padding: 12px 12px 30px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left h1 {
                font-size: 32px;
            }
            .header-right {
                justify-content: flex-start;
                gap: 12px;
            }
            .timeline-track {
                min-width: 500px;
                height: 70px;
            }
            .timeline-dot {
                width: 36px;
                height: 36px;
                font-size: 10px;
            }
            .timeline-dot .dot-label {
                font-size: 9px;
            }
            .info-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .info-panel .info-details {
                flex-direction: column;
                gap: 4px;
            }
            .phase-header .phase-title {
                font-size: 16px;
            }
            .phase-cards {
                flex-direction: column;
            }
            .phase-card {
                max-width: 100%;
                min-width: 0;
            }
            .modal {
                padding: 24px;
            }
        }

        @media (max-width: 480px) {
            .header-left h1 {
                font-size: 26px;
            }
            .stat-badge {
                padding: 4px 12px;
                font-size: 12px;
            }
            .stat-badge .num {
                font-size: 15px;
            }
            .timeline-track {
                min-width: 400px;
                height: 60px;
            }
            .timeline-dot {
                width: 30px;
                height: 30px;
                font-size: 9px;
            }
            .timeline-dot .dot-label {
                font-size: 8px;
            }
            .phase-block {
                padding: 12px 14px;
            }
        }
    </style>
</head>

    <div class="dashboard">
        <!-- ===== HEADER ===== -->
        <header class="header">

                <h1>Arion</h1>
            </div>
            <div class="header-right">

                <div class="stat-badge">

                    <span class="num green" id="completedCount">0</span>
                    <span class="label">/ <span id="totalCount">0</span></span>
                </div>
                <div class="update-time">
                    <div class="time-row">
                        <span class="dot"></span>
                        <span>Обновлено: <span id="lastUpdate">—</span></span>
                    </div>
                    <div class="date-range" id="projectDates">Строительство: <span id="projectStart">—</span> — <span id="projectEnd">—</span></div>
                </div>

        </header>

        <!-- ===== TIMELINE ===== -->

                <!-- dots will be rendered by JS -->

            <!-- info panel (при клике на кружок) -->

                <span class="info-name" id="infoName" style="display:none;"></span>
                <div class="info-details" id="infoDetails" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== PHASES SECTION ===== -->
        <div class="phases-section" id="phasesContainer">
            <!-- rendered by JS -->
        </div>

        <!-- ===== MODAL ===== -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-title" id="modalTitle">Название</div>
                <div class="modal-body" id="modalBody">
                    <!-- dynamic rows -->
                </div>
                <button class="modal-close" id="modalClose">Закрыть</button>
            </div>
        </div>
    </div>

        }, {

        }, {

            startMonth: 20,

            description: 'Энергообеспечение всего проекта',
            responsible: 'Энергостроительная компания'
        }, {

            startMonth: 24,
            endMonth: 30,

            description: 'Линии электропередачи',
            responsible: 'Сетевая организация'
        }, {
            id: '4.7',
            phaseId: 'p4',
            name: 'Танкеры и газовозы (верфи)',
            startMonth: 16,
            endMonth: 36,
            pct: 0,
            description: 'Строительство флота для вывоза',
            responsible: 'Судостроительный завод'
        }, {
            id: '4.8',
            phaseId: 'p4',
            name: 'Береговая оборона (Sentinel)',
            startMonth: 26,
            endMonth: 34,
            pct: 0,
            description: 'Системы защиты и наблюдения',
            responsible: 'Оборонный подрядчик'
        }];

        // ============================================================
        //  HELPERS
        // ============================================================

        const TOTAL_MONTHS = 36; // от 0 до 36

        function getPhaseById(id) {
            return phases.find(p => p.id === id);
        }

        function getSubsByPhase(phaseId) {
            return subPhases.filter(s => s.phaseId === phaseId);
        }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getOverallProgress() {
            if (!subPhases.length) return 0;
            const sum = subPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subPhases.length);
        }

        function getCompletedCount() {
            return subPhases.filter(s => s.pct >= 100).length;
        }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // ============================================================
        //  RENDER
        // ============================================================

        // ---- timeline dots ----
        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            // remove old dots (keep line)
            const line = track.querySelector('.timeline-line');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            // sort by startMonth
            const sorted = [...subPhases].sort((a, b) => a.startMonth - b.startMonth);

            sorted.forEach(sub => {
                const x = (sub.startMonth / TOTAL_MONTHS) * 100;
                const status = getStatusInfo(sub.pct);

                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = x + '%';
                dot.dataset.id = sub.id;

                // label with percent
                const label = document.createElement('span');
                label.className = 'dot-label';
                label.textContent = sub.pct + '%';
                dot.appendChild(label);

                // tooltip (название при наведении)
                const tooltip = document.createElement('div');
                tooltip.className = 'tooltip';
                tooltip.textContent = sub.name;
                dot.appendChild(tooltip);

                // click -> show name in info panel
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showInfo(sub);
                });

                track.appendChild(dot);
            });

            // обновить заливку фазы на линии (просто для красоты, показываем общий прогресс)
            const fill = document.getElementById('phaseFill');
            const overall = getOverallProgress();
            fill.style.width = overall + '%';
            fill.style.background = 'linear-gradient(90deg, #f5b041, #e67e22)';
        }

        // ---- info panel (при клике на кружок) ----
        function showInfo(sub) {
            const panel = document.getElementById('infoPanel');
            const placeholder = panel.querySelector('.info-placeholder');
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');

            placeholder.style.display = 'none';
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';

            nameEl.textContent = sub.name;

            // детали: показываем только даты начала/окончания, если есть
            let detailsHtml = '';
            if (sub.startMonth !== undefined && sub.startMonth !== null) {
                detailsHtml +=
                    `<div class="detail-item"><span class="label">Начало:</span> ${sub.startMonth} мес.</div>`;
            }
            if (sub.endMonth !== undefined && sub.endMonth !== null) {
                detailsHtml +=
                    `<div class="detail-item"><span class="label">Окончание:</span> ${sub.endMonth} мес.</div>`;
            }
            if (sub.responsible) {
                detailsHtml +=
                    `<div class="detail-item"><span class="label">Ответственный:</span> ${sub.responsible}</div>`;
            }
            if (sub.characteristics) {
                detailsHtml +=
                    `<div class="detail-item"><span class="label">Характеристики:</span> ${sub.characteristics}</div>`;
            }
            detailsEl.innerHTML = detailsHtml || '<span class="label">Нет дополнительных данных</span>';
        }

        // ---- phases section ----
        function renderPhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            phases.forEach(phase => {
                const subs = getSubsByPhase(phase.id);
                if (!subs.length) return;

                const progress = getPhaseProgress(phase.id);

                const block = document.createElement('div');
                block.className = 'phase-block';

                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <span class="phase-title">${phase.label}</span>
                    <span class="phase-progress">${progress}%</span>
                `;
                block.appendChild(header);

                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'phase-cards';

                // сортировка по startMonth
                const sorted = [...subs].sort((a, b) => a.startMonth - b.startMonth);
                sorted.forEach(sub => {
                    const card = createPhaseCard(sub);
                    cardsWrap.appendChild(card);
                });

                block.appendChild(cardsWrap);
                container.appendChild(block);
            });
        }

        function createPhaseCard(sub) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.dataset.id = sub.id;

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            // мета (даты)
            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startMonth !== undefined && sub.startMonth !== null) {
                meta.innerHTML += `<span>Старт: ${sub.startMonth} мес.</span>`;
            }
            if (sub.endMonth !== undefined && sub.endMonth !== null) {
                meta.innerHTML += `<span>Финиш: ${sub.endMonth} мес.</span>`;
            }
            if (sub.responsible) {
                meta.innerHTML += `<span>Ответственный: ${sub.responsible}</span>`;
            }
            card.appendChild(meta);

            // клик -> открыть модальное окно с полными данными
            card.addEventListener('click', function() {
                openModal(sub);
            });

            return card;
        }

        // ---- modal ----
        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = sub.name;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const fields = [
                { key: 'Фаза', value: getPhaseById(sub.phaseId)?.label || '—' },
                { key: 'Статус', value: getStatusInfo(sub.pct).label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало (мес.)', value: sub.startMonth !== undefined ? sub.startMonth : '—' },
                { key: 'Окончание (мес.)', value: sub.endMonth !== undefined ? sub.endMonth : '—' },
                { key: 'Описание', value: sub.description || '—' },
                { key: 'Ответственный', value: sub.responsible || '—' },
                { key: 'Характеристики', value: sub.characteristics || '—' }
            ];

            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `<span class="key">${f.key}</span><span class="value">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
        }

        // ---- stats & dates ----
        function updateStats() {
            const total = subPhases.length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();

            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            // время обновления
            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;

            // даты проекта
            document.getElementById('projectStart').textContent = formatDate(PROJECT_START);
            document.getElementById('projectEnd').textContent = formatDate(PROJECT_END);
        }

        // ---- init ----
        function init() {
            renderTimeline();
            renderPhases();
            updateStats();

            // закрытие модалки
            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
            });
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
