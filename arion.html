        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }
        .theme-btn:focus-visible { outline: 2px solid var(--accent-gold); }

        .dashboard { max-width: 1400px; width: 100%; padding: 20px 24px 40px; }

        @keyframes glow-title {
            0% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(245,176,65,0.05); }
            100% { text-shadow: 0 0 70px var(--accent-glow), 0 0 140px rgba(245,176,65,0.2); }
        }
        @keyframes pulse-red {
            0%,100% { box-shadow:0 0 30px rgba(231,76,60,0.4),0 0 60px rgba(231,76,60,0.2); }
            50% { box-shadow:0 0 80px rgba(231,76,60,0.8),0 0 150px rgba(231,76,60,0.3); }
        }
        @keyframes ring-pulse {
            0%,100% { transform:scale(1); opacity:0.6; }
            50% { transform:scale(1.6); opacity:0; }
        }
        @keyframes pulse-fleet {
            0%,100% { box-shadow: 0 0 30px rgba(110,198,255,0.4), 0 0 60px rgba(110,198,255,0.2); }
            50% { box-shadow: 0 0 80px rgba(110,198,255,0.8), 0 0 150px rgba(110,198,255,0.3); }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes wave {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        .wave-bg {
            background: linear-gradient(270deg, var(--bg-panel), var(--bg-card), var(--bg-panel));
            background-size: 200% 200%;
            animation: wave 6s ease-in-out infinite;
        }

        .header {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px;
        }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin:0;
            animation: glow-title 3s ease-in-out infinite alternate;
            position:relative;
            display:inline-block;
        }
        .header-left h1::after {
            content:''; position:absolute; bottom:-6px; left:0; width:60%; height:3px;
            background:linear-gradient(90deg, var(--gradient-start), transparent); border-radius:4px;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card); backdrop-filter:blur(8px);
            padding:6px 14px; border-radius:40px; border:1px solid var(--border-color);
            font-size:14px; box-shadow:var(--shadow);
            transition:border-color 0.3s, box-shadow 0.3s;
        }
        .stat-badge:hover { border-color:var(--accent-gold); box-shadow:0 4px 30px var(--accent-glow); }
        .stat-badge .num { font-weight:700; font-size:18px; color:var(--accent-gold); }
        .stat-badge .num.green { color:var(--dot-done); }
        .stat-badge .num.danger { color:var(--dot-active); }
        .stat-badge .label { color:var(--text-muted); font-weight:400; }
        .update-time {
            font-size:13px; color:var(--text-muted);
            display:flex; flex-direction:column; align-items:flex-end; line-height:1.4;
            background:var(--bg-card); backdrop-filter:blur(4px);
            padding:4px 14px; border-radius:40px; border:1px solid var(--border-color);
        }
        .update-time .time-row { display:flex; align-items:center; gap:6px; }
        .update-time .dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--dot-done); animation:pulse-dot 2s ease-in-out infinite;
            box-shadow:0 0 12px rgba(76,217,160,0.4);
        }

        .toast-container {
            position:fixed; top:20px; right:20px; z-index:9999;
            display:flex; flex-direction:column; gap:10px; max-width:360px; width:100%; pointer-events:none;
        }
        .toast {
            background:var(--bg-card); backdrop-filter:blur(8px);
            border:1px solid var(--border-color); border-left:4px solid var(--accent-gold);
            border-radius:12px; padding:12px 16px;
            box-shadow:0 8px 30px rgba(0,0,0,0.4);
            pointer-events:auto; animation:fadeInUp 0.3s ease forwards;
            color:var(--text-secondary); font-size:14px;
            display:flex; justify-content:space-between; align-items:center; gap:12px;
        }
        .toast.warning { border-left-color:var(--dot-active); }
        .toast.success { border-left-color:var(--dot-done); }
        .toast .toast-close { background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:0 4px; }

        .export-bar {
            display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px;
        }
        .export-btn {
            background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:6px 16px; border-radius:40px;
            font-size:13px; cursor:pointer; transition:all 0.2s;
            display:flex; align-items:center; gap:6px;
        }
        .export-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); box-shadow:0 0 20px var(--accent-glow); }
        .export-btn:focus-visible { outline:2px solid var(--accent-gold); }

        .timeline-wrapper {
            background:var(--bg-panel); backdrop-filter:blur(10px);
            border-radius:24px; padding:30px 20px 24px;
            border:1px solid var(--border-color); margin-bottom:28px;
            box-shadow:var(--shadow); overflow:hidden;
            transition:background 0.4s, border-color 0.4s;
        }
        .timeline-track { position:relative; height:100px; width:100%; padding:0 6%; }
        .timeline-line {
            position:absolute; top:50%; left:6%; right:6%; height:5px;
            background:var(--line-bg); border-radius:4px; transform:translateY(-50%);
            z-index:1; box-shadow:0 0 20px rgba(255,255,255,0.05), inset 0 0 8px rgba(0,0,0,0.5);
            overflow:visible;
        }
        .seg-fill {
            position:absolute; top:0; height:100%; border-radius:4px;
            background:var(--line-fill);
            box-shadow:0 0 20px var(--accent-glow), 0 0 40px rgba(245,176,65,0.1);
            transition:width 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s cubic-bezier(0.4,0,0.2,1);
            width:0%; left:0%;
        }
        .timeline-dot {
            position:absolute; top:50%; transform:translate(-50%,-50%);
            width:64px; height:64px; border-radius:50%;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-weight:700; color:#fff; cursor:pointer; z-index:2;
            transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
            user-select:none; border:2px solid rgba(255,255,255,0.15);
            box-shadow:0 4px 24px rgba(0,0,0,0.6);
            background:#1a2332; text-shadow:0 1px 6px rgba(0,0,0,0.6);
            will-change:transform;
        }
        .timeline-dot .dot-pct { font-size:17px; line-height:1.1; }
        .timeline-dot .dot-label { font-size:9px; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; opacity:0.8; margin-top:1px; text-align:center; max-width:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .timeline-dot.done { background:linear-gradient(135deg,#2b6a9e,#1d4a7a); border-color:#4a8ec4; box-shadow:0 0 30px rgba(42,106,158,0.4), inset 0 0 20px rgba(74,142,196,0.2); }
        .timeline-dot.active { background:linear-gradient(135deg,#c0392b,#e74c3c); border-color:#e74c3c; box-shadow:0 0 50px rgba(231,76,60,0.6), inset 0 0 30px rgba(231,76,60,0.3); animation:pulse-red 1.8s ease-in-out infinite; }
        .timeline-dot.active::after { border-color:rgba(231,76,60,0.3); animation:ring-pulse 1.8s ease-in-out infinite; }
        .timeline-dot.pending { background:linear-gradient(135deg,#2a3a4e,#1a2332); border-color:#3a4a5e; box-shadow:0 0 20px rgba(0,0,0,0.3); }
        .timeline-dot:hover { transform:translate(-50%,-50%) scale(1.12); z-index:5; }
        .timeline-dot:focus-visible { outline:2px solid var(--accent-gold); outline-offset:4px; }

        .fleet-track {
            position: relative;
            margin-top: 18px;
            padding: 14px 6% 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fleet-track::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: repeating-linear-gradient(
                90deg,
                var(--fleet-accent) 0 6px,
                transparent 6px 14px
            );
            opacity: 0.5;
        }
        .fleet-dot {
            position: relative;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            user-select: none;
            border: 2px dashed var(--fleet-accent);
            background: radial-gradient(circle at 50% 40%, rgba(110,198,255,0.15), rgba(26,35,50,0.95));
            box-shadow: 0 0 30px rgba(110,198,255,0.2), inset 0 0 20px rgba(110,198,255,0.08);
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            will-change: transform;
        }
        .fleet-dot .dot-pct { font-size:17px; line-height:1.1; }
        .fleet-dot .dot-label { font-size:9px; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; opacity:0.85; margin-top:1px; text-align:center; max-width:64px; }
        .fleet-dot:hover {
            transform: scale(1.1);
            box-shadow: 0 0 45px rgba(110,198,255,0.35);
        }
        .fleet-dot:focus-visible { outline:2px solid var(--fleet-accent); outline-offset:4px; }
        .fleet-dot .fleet-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--fleet-accent);
            color: #0b0e14;
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 40px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .fleet-dot.pending {
            border-color: #3a4a5e;
            background: radial-gradient(circle at 50% 40%, rgba(90,106,126,0.15), rgba(26,35,50,0.95));
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .fleet-dot.active {
            border-color: var(--fleet-accent);
            background: radial-gradient(circle at 50% 40%, rgba(110,198,255,0.3), rgba(26,35,50,0.95));
            box-shadow: 0 0 50px rgba(110,198,255,0.6), inset 0 0 30px rgba(110,198,255,0.3);
            animation: pulse-fleet 1.8s ease-in-out infinite;
        }
        .fleet-dot.done {
            border-color: var(--dot-done);
            background: radial-gradient(circle at 50% 40%, rgba(76,217,160,0.3), rgba(26,35,50,0.95));
            box-shadow: 0 0 40px rgba(76,217,160,0.4), inset 0 0 25px rgba(76,217,160,0.2);
            border-style: solid;
        }

        .info-panel {
            margin-top:18px; background:var(--bg-card); backdrop-filter:blur(6px);
            border-radius:16px; border:1px solid var(--border-color);
            padding:14px 22px; min-height:56px;
            display:flex; align-items:center; gap:20px; flex-wrap:wrap;
            transition:all 0.3s ease; box-shadow:var(--shadow);
        }
        .info-panel .info-placeholder { color:var(--text-muted); font-size:14px; }
        .info-panel .info-name { font-size:20px; font-weight:600; transition:color 0.3s; }
        .info-panel .info-name.status-done { color:var(--dot-done); text-shadow:0 0 30px rgba(76,217,160,0.3); }
        .info-panel .info-name.status-active { color:var(--accent-gold); text-shadow:0 0 30px var(--accent-glow); }
        .info-panel .info-name.status-pending { color:var(--text-muted); text-shadow:none; }
        .info-panel .info-name.fleet-active { color: var(--fleet-accent); text-shadow: 0 0 30px rgba(110,198,255,0.4); }
        .info-panel .info-name.fleet-done { color: var(--dot-done); }
        .info-panel .info-name.fleet-pending { color: var(--text-muted); }
        .info-panel .info-details { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
        .info-panel .info-details .detail-item { display:flex; align-items:baseline; gap:6px; }
        .info-panel .info-details .detail-item .label { color:var(--text-muted); }

        .phases-section { margin-top:28px; display:flex; flex-direction:column; gap:24px; }
        .phase-block {
            background:var(--bg-panel); backdrop-filter:blur(6px);
            border-radius:20px; border:1px solid var(--border-color);
            padding:18px 22px 20px; box-shadow:var(--shadow);
            transition:border-color 0.3s, box-shadow 0.3s;
        }
        .phase-block:hover { border-color:var(--accent-gold); box-shadow:var(--shadow); }
        .phase-block.fleet-block { border-left: 4px dashed var(--fleet-accent); }
        .phase-block.fleet-block:hover { border-color: var(--fleet-accent); }
        .phase-header {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px; flex-wrap:wrap; gap:8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); letter-spacing:0.2px; }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress { font-size:14px; font-weight:500; color:var(--accent-gold); background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color); }
        .fleet-block .phase-progress { color: var(--fleet-accent); border-color: rgba(110,198,255,0.3); }
        .phase-cards { display:flex; flex-wrap:wrap; gap:12px; }
        .phase-card {
            background:var(--bg-card); backdrop-filter:blur(4px);
            border-radius:14px; padding:12px 18px;
            border:1px solid var(--border-color);
            flex:0 1 auto; min-width:180px; max-width:320px;
            display:flex; flex-direction:column; gap:4px;
            cursor:pointer; transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow:var(--shadow); position:relative;
            opacity:0; animation:fadeInUp 0.5s ease forwards;
        }
        .phase-card:hover { border-color:var(--accent-gold); transform:translateY(-3px) scale(1.02); box-shadow:var(--shadow), 0 0 40px var(--accent-glow); }
        .phase-card:focus-visible { outline:2px solid var(--accent-gold); outline-offset:2px; }
        .phase-card.overdue { border-color:var(--dot-active); box-shadow:0 0 20px rgba(231,76,60,0.3); }
        .fleet-card:hover { border-color: var(--fleet-accent); box-shadow: 0 0 30px rgba(110,198,255,0.15); }
        .phase-card .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .phase-card .card-name { font-size:14px; font-weight:500; color:var(--text-primary); flex:1; min-width:0; }
        .phase-card .card-pct { font-size:16px; font-weight:700; color:var(--accent-gold); min-width:48px; text-align:right; flex-shrink:0; }
        .phase-card .card-pct.done { color:var(--dot-done); }
        .phase-card .card-pct.pending { color:var(--text-muted); }
        .fleet-card .card-name.active { color: var(--fleet-accent); }
        .fleet-card .card-pct.active { color: var(--fleet-accent); }
        .phase-card .card-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 12px rgba(0,0,0,0.3); transition:box-shadow 0.3s; }
        .phase-card .card-status-dot.done { background:var(--dot-done); box-shadow:0 0 16px rgba(76,217,160,0.3); }
        .phase-card .card-status-dot.active { background:var(--dot-active); box-shadow:0 0 20px rgba(231,76,60,0.5); animation:pulse-dot 1.6s ease-in-out infinite; }
        .phase-card .card-status-dot.pending { background:var(--dot-pending); }
        .fleet-card .card-status-dot.active { background: var(--fleet-accent); box-shadow: 0 0 20px rgba(110,198,255,0.6); }
        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta span { display:flex; align-items:center; gap:4px; }
        .phase-card .card-meta .eta { color:var(--accent-gold); }
        .fleet-card .card-meta .eta { color: var(--fleet-accent); }

        .modal-overlay {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
            z-index:1000; justify-content:center; align-items:center; padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--bg-panel); backdrop-filter:blur(12px);
            border-radius:24px; padding:32px 36px;
            max-width:560px; width:100%;
            border:1px solid var(--border-color);
            box-shadow:0 24px 80px rgba(0,0,0,0.8);
            animation:modal-in 0.4s cubic-bezier(0.4,0,0.2,1);
            max-height:80vh; overflow-y:auto;
            transition:background 0.4s, border-color 0.4s;
        }
        .modal .modal-title {
            font-size:20px; font-weight:600; margin-bottom:8px;
            transition:color 0.3s;
        }
        .modal .modal-title.status-done { color: var(--dot-done) !important; text-shadow: 0 0 30px rgba(76,217,160,0.3); }
        .modal .modal-title.status-active { color: var(--accent-gold) !important; text-shadow: 0 0 30px var(--accent-glow); }
        .modal .modal-title.status-pending { color: var(--text-muted) !important; text-shadow: none; }
        .modal .modal-title.fleet-active { color: var(--fleet-accent) !important; text-shadow: 0 0 30px rgba(110,198,255,0.4); }
        .modal .modal-close {
            margin-top:20px; background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:10px 24px; border-radius:40px;
            font-size:14px; cursor:pointer; transition:all 0.2s; width:100%;
        }
        .modal .modal-close:hover { border-color:var(--accent-gold); box-shadow:0 0 20px var(--accent-glow); }
        .modal .modal-close:focus-visible { outline:2px solid var(--accent-gold); }
        .modal .modal-body { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text-secondary); }
        .modal .modal-body .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .modal .modal-body .row .key { color:var(--text-muted); flex-shrink:0; margin-right:12px; }
        .modal .modal-body .row .value { font-weight:500; color:var(--text-primary); text-align:right; word-break:break-word; }
        .modal .modal-body .row .value.dependencies { font-weight:400; color:var(--text-muted); font-size:13px; }

        .theme-modal .theme-options {
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:12px; margin-top:16px;
        }
        .theme-modal .theme-option {
            padding:12px 8px; border-radius:12px;
            border:2px solid var(--border-color);
            background:var(--bg-card); cursor:pointer;
            text-align:center; transition:all 0.2s;
            color:var(--text-secondary); font-size:14px;
        }
        .theme-modal .theme-option:hover { border-color:var(--accent-gold); transform:scale(1.03); }
        .theme-modal .theme-option.active { border-color:var(--accent-gold); background:var(--accent-glow); }
        .theme-modal .theme-option .color-preview {
            width:24px; height:24px; border-radius:50%;
            margin:0 auto 6px; border:1px solid rgba(255,255,255,0.1);
        }

        .analytics-section {
            margin-top:32px;
            background:var(--bg-panel); backdrop-filter:blur(6px);
            border-radius:24px; border:1px solid var(--border-color);
            padding:24px; box-shadow:var(--shadow);
            transition:background 0.4s, border-color 0.4s;
        }
        .analytics-section .analytics-title {
            font-size:20px; font-weight:600; color:var(--text-primary);
            margin-bottom:20px; letter-spacing:0.2px;
        }
        .analytics-grid {
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:20px;
        }
        .analytics-card {
            background:var(--bg-card); border-radius:16px;
            padding:18px; border:1px solid var(--border-color);
            box-shadow:var(--shadow);
        }
        .analytics-card h3 {
            font-size:14px; font-weight:500; color:var(--text-muted);
            margin-bottom:12px; letter-spacing:0.2px;
        }
        .analytics-card canvas {
            width:100% !important;
            height:auto !important;
            max-height:180px;
            border-radius:8px;
        }
        /* Обёртка для графика нефти (Chart.js) */
        .oil-chart-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .oil-chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
            max-height: none !important;
            border-radius: 8px;
            display: block;
        }
        .analytics-card .risk-item {
            display:flex; justify-content:space-between;
            padding:6px 0; border-bottom:1px solid var(--border-color);
            font-size:13px;
        }
        .analytics-card .risk-item .risk-name { color:var(--text-secondary); }
        .analytics-card .risk-item .risk-score { font-weight:500; }
        .analytics-card .risk-item .risk-score.high { color:var(--dot-active); }
        .analytics-card .risk-item .risk-score.medium { color:var(--accent-gold); }
        .analytics-card .risk-item .risk-score.low { color:var(--dot-done); }

        .version {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 16px 0 8px;
            border-top: 1px solid var(--border-color);
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 820px) {
            .top-menu { padding: 10px 16px; flex-direction: column; align-items: stretch; gap:8px; }
            .top-menu .nav-links { justify-content: center; }
            .dashboard { padding: 16px 12px; }
            .header-left h1 { font-size:38px; }
            .header-right { justify-content:flex-start; gap:12px; }
            .timeline-track { height:80px; padding:0 4%; }
            .timeline-dot { width:52px; height:52px; }
            .timeline-dot .dot-pct { font-size:14px; }
            .timeline-dot .dot-label { font-size:7px; max-width:44px; }
            .fleet-dot { width:60px; height:60px; }
            .fleet-dot .dot-pct { font-size: 14px; }
            .info-panel { flex-direction:column; align-items:flex-start; gap:8px; padding:12px 16px; }
            .info-panel .info-details { flex-direction:column; gap:4px; }
            .phase-header .phase-title { font-size:16px; }
            .phase-header .phase-meta { font-size:12px; gap:8px; flex-wrap:wrap; }
            .phase-cards { flex-direction:column; }
            .phase-card { max-width:100%; min-width:0; }
            .modal { padding:24px; }
            .analytics-grid { grid-template-columns:1fr; }
            .theme-modal .theme-options { grid-template-columns:1fr 1fr; }
            .export-bar { flex-direction:column; align-items:stretch; }
        }
        @media (max-width: 480px) {
            .header-left h1 { font-size:30px; }
            .stat-badge { padding:4px 12px; font-size:12px; }
            .stat-badge .num { font-size:15px; }
            .timeline-track { height:70px; padding:0 2%; }
            .timeline-dot { width:44px; height:44px; }
            .timeline-dot .dot-pct { font-size:12px; }
            .timeline-dot .dot-label { font-size:6px; max-width:36px; }
            .fleet-dot { width:52px; height:52px; }
            .fleet-dot .dot-pct { font-size: 12px; }
            .fleet-dot .dot-label { font-size: 7px; }
            .phase-block { padding:12px 14px; }
            .theme-modal .theme-options { grid-template-columns:1fr; }
            .modal { padding:20px; }
        }

        @media print {
            .export-bar, .theme-btn, .update-time, .stat-badge .label, .top-menu { display:none; }
            .header { margin-bottom:16px; }
            .timeline-wrapper, .phase-block, .analytics-section { break-inside:avoid; }
            body { background:#fff; color:#000; }
            .phase-card, .analytics-card { border:1px solid #ccc; background:#f9f9f9; }
            .phase-card .card-name, .phase-header .phase-title, .analytics-card h3 { color:#000; }
            .phase-card .card-pct, .phase-header .phase-progress { color:#000; }
            .info-panel { border:1px solid #ccc; background:#f9f9f9; }
        }
    </style>
</head>
<body>

    <header class="top-menu">
        <div class="logo">Zenith</div>
        <nav class="nav-links">
            <a href="index.html">Главная</a>
            <a href="arion.html" class="active">Arion</a>
            <a href="analysis.html">Аналитика</a>
        </nav>
        <div class="right-info">
            <span class="dot"></span>
            <span id="headerTime">—</span>
            <div class="header-controls">
                <button class="theme-btn" id="themeToggle">🎨 Тема</button>
            </div>
        </div>
    </header>

    <div class="dashboard" id="dashboard">

        <header class="header">
            <div class="header-left">
                <h1>Arion</h1>
            </div>
            <div class="header-right">
                <div class="stat-badge">
                    <span class="label">Общий прогресс</span>
                    <span class="num gold" id="totalProgress">0%</span>
                </div>
                <div class="stat-badge">
                    <span class="label">Завершено</span>
                    <span class="num green" id="completedCount">0</span>
                    <span class="label">/ <span id="totalCount">0</span></span>
                </div>
                <div class="stat-badge" id="overdueBadge" style="display:none;">
                    <span class="label">Превышение прогноза</span>
                    <span class="num danger" id="overdueCount" style="color:var(--dot-active);">0</span>
                </div>
                <div class="update-time">
                    <div class="time-row">
                        <span class="dot"></span>
                        <span>Текущее время: <span id="lastUpdate">—</span></span>
                    </div>
                </div>
            </div>
        </header>

        <div class="export-bar">
            <button class="export-btn" id="exportPDF">📄 PDF</button>
            <button class="export-btn" id="exportPNG">🖼️ PNG</button>
            <button class="export-btn" id="exportCSV">📊 CSV</button>
        </div>

        <div class="timeline-wrapper wave-bg">
            <div class="timeline-track" id="timelineTrack">
                <div class="timeline-line" id="timelineLine"></div>
            </div>
            <div class="fleet-track" id="fleetTrack"></div>
            <div class="info-panel" id="infoPanel">
                <span class="info-placeholder">Нажмите на кружок этапа, чтобы увидеть информацию</span>
                <span class="info-name" id="infoName" style="display:none;"></span>
                <div class="info-details" id="infoDetails" style="display:none;"></div>
            </div>
        </div>

        <div class="phases-section" id="phasesContainer"></div>
        <div class="phases-section" id="fleetContainer"></div>

        <div class="analytics-section" id="analyticsSection">
            <div class="analytics-title">📊 Аналитика проекта</div>
            <div class="analytics-grid">
                <div class="analytics-card">
                    <h3>Бюджет проекта ($ млн)</h3>
                    <canvas id="budgetChart" width="400" height="160"></canvas>
                </div>
                <div class="analytics-card">
                    <h3>Оценка рисков</h3>
                    <div id="riskList"></div>
                </div>
