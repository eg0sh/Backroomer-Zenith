        /* ----- base ----- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        /* ===== Верхнее меню ===== */
        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .theme-btn:focus-visible { outline: 2px solid var(--accent-gold); }

        /* ----- dashboard container ----- */
        .dashboard {
            max-width: 1400px;
            width: 100%;
            padding: 20px 24px 40px;
        }

        /* ----- animations ----- */
        @keyframes glow-title {
            0% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(245,176,65,0.05); }
            100% { text-shadow: 0 0 70px var(--accent-glow), 0 0 140px rgba(245,176,65,0.2); }
        }
        @keyframes pulse-red {
            0%,100% { box-shadow:0 0 30px rgba(231,76,60,0.4),0 0 60px rgba(231,76,60,0.2); }
            50% { box-shadow:0 0 80px rgba(231,76,60,0.8),0 0 150px rgba(231,76,60,0.3); }
        }
        @keyframes ring-pulse {
            0%,100% { transform:scale(1); opacity:0.6; }
            50% { transform:scale(1.6); opacity:0; }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes wave {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        .wave-bg {
            background: linear-gradient(270deg, var(--bg-panel), var(--bg-card), var(--bg-panel));
            background-size: 200% 200%;
            animation: wave 6s ease-in-out infinite;
        }

        /* ----- внутренние стили дашборда ----- */
        .header {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px;
        }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin:0;
            animation: glow-title 3s ease-in-out infinite alternate;
            position:relative;
            display:inline-block;
        }
        .header-left h1::after {
            content:''; position:absolute; bottom:-6px; left:0; width:60%; height:3px;
            background:linear-gradient(90deg, var(--gradient-start), transparent); border-radius:4px;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card); backdrop-filter:blur(8px);
            padding:6px 14px; border-radius:40px; border:1px solid var(--border-color);
            font-size:14px; box-shadow:var(--shadow);
            transition:border-color 0.3s, box-shadow 0.3s;
        }

        .modal-overlay {

        function getPhaseById(id) { return phases.find(p => p.id === id); }
        function getSubsByPhase(phaseId) { return subPhases.filter(s => s.phaseId === phaseId); }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getOverallProgress() {
            if (!subPhases.length) return 0;
            const sum = subPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subPhases.length);
        }

        function getCompletedCount() { return subPhases.filter(s => s.pct >= 100).length; }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getSubName(id) {
            const sub = subPhases.find(s => s.id === id);
            return sub ? sub.name : id;
        }

        // ============================================================
        //  РАСЧЁТ ПРОГНОЗА
        // ============================================================

        function getLastMonday() {
            const base = new Date(FORECAST_REF_DATE);
            const day = base.getDay();
            const diff = (day === 0 ? 6 : day - 1);
            const monday = new Date(base);
            monday.setDate(base.getDate() - diff);
            monday.setHours(0,0,0,0);
            return monday;
        }

        function calculateForecast(sub) {
            if (!sub.startDate || sub.pct <= 0 || sub.pct >= 100) return null;
            const start = new Date(sub.startDate);
            const refDate = getLastMonday();
            const elapsed = (refDate - start) / (1000 * 60 * 60 * 24);
            if (elapsed <= 0) return null;
            const rate = sub.pct / elapsed;
            if (rate <= 0) return null;
            const daysLeft = (100 - sub.pct) / rate;
            return new Date(refDate.getTime() + daysLeft * 86400000);
        }

        function formatForecast(sub) {
            const fc = calculateForecast(sub);
            if (!fc) return '—';
            return fc.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function isOverdue(sub) {
            if (sub.pct >= 100) return false;
            const fc = calculateForecast(sub);
            if (!fc) return false;
            const now = new Date();
            return fc < now;
        }

        // ============================================================
        //  RENDER
        // ============================================================

        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            let line = document.getElementById('timelineLine');
            if (!line) {
                line = document.createElement('div');
                line.id = 'timelineLine';
                line.className = 'timeline-line';
                track.appendChild(line);
            }
            line.querySelectorAll('.seg-fill').forEach(el => el.remove());

            const n = phases.length;
            const leftMargin = 6, rightMargin = 6, range = 100 - leftMargin - rightMargin;
            const dotPositions = phases.map((_, i) => leftMargin + (i / (n - 1)) * range);

            phases.forEach((phase, index) => {
                const progress = getPhaseProgress(phase.id);
                const status = getStatusInfo(progress);
                const x = dotPositions[index];
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = x + '%';
                dot.dataset.phaseId = phase.id;
                dot.setAttribute('tabindex', '0');
                dot.setAttribute('role', 'button');
                dot.setAttribute('aria-label', `Фаза ${phase.label}, прогресс ${progress}%`);

                const pctSpan = document.createElement('span');
                pctSpan.className = 'dot-pct';
                pctSpan.textContent = progress + '%';
                dot.appendChild(pctSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'dot-label';
                labelSpan.textContent = phase.label.split(' ')[0];
                dot.appendChild(labelSpan);

                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showPhaseInfo(phase.id);
                });
                dot.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        showPhaseInfo(phase.id);
                    }
                });

                track.appendChild(dot);
            });

            for (let i = 0; i < n - 1; i++) {
                const leftPos = dotPositions[i];
                const rightPos = dotPositions[i + 1];
                const segmentWidth = rightPos - leftPos;
                const progress = getPhaseProgress(phases[i].id);
                const fillWidth = (progress / 100) * segmentWidth;
                if (fillWidth > 0) {
                    const fill = document.createElement('div');
                    fill.className = 'seg-fill';
                    fill.style.left = leftPos + '%';
                    fill.style.width = fillWidth + '%';
                    line.appendChild(fill);
                }
            }
        }

        function showPhaseInfo(phaseId) {
            const phase = getPhaseById(phaseId);
            if (!phase) return;
            const panel = document.getElementById('infoPanel');
            const placeholder = panel.querySelector('.info-placeholder');
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');

            placeholder.style.display = 'none';
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';

            const progress = getPhaseProgress(phaseId);
            const status = getStatusInfo(progress);
            nameEl.textContent = phase.label;
            nameEl.className = 'info-name status-' + status.status;

            const subs = getSubsByPhase(phaseId);
            const completed = subs.filter(s => s.pct >= 100).length;
            const start = formatDate(phase.startDate);
            const end = formatDate(phase.endDate);
            const budget = phase.budget ? '$' + phase.budget + ' млн' : '—';

            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">Прогресс:</span> ${progress}%</div>
                <div class="detail-item"><span class="label">Подэтапов:</span> ${subs.length}</div>
                <div class="detail-item"><span class="label">Завершено:</span> ${completed}</div>
                <div class="detail-item"><span class="label">Начало:</span> ${start}</div>
                <div class="detail-item"><span class="label">Окончание:</span> ${end}</div>
                <div class="detail-item"><span class="label">Бюджет:</span> ${budget}</div>
            `;
        }

        function renderPhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            phases.forEach(phase => {
                const subs = getSubsByPhase(phase.id);
                if (!subs.length) return;
                const progress = getPhaseProgress(phase.id);
                const start = formatDate(phase.startDate);
                const end = formatDate(phase.endDate);
                const budget = phase.budget ? '$' + phase.budget + ' млн' : '—';

                const block = document.createElement('div');
                block.className = 'phase-block';

                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <span class="phase-title">${phase.label}</span>
                    <div class="phase-meta">
                        <span>Начало: ${start}</span>
                        <span>Окончание: ${end}</span>
                        <span>Бюджет: ${budget}</span>
                    </div>
                    <span class="phase-progress">${progress}%</span>
                `;
                block.appendChild(header);

                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'phase-cards';

                const sorted = [...subs].sort((a, b) => a.id.localeCompare(b.id));
                sorted.forEach((sub, idx) => {
                    const card = createPhaseCard(sub, idx);
                    cardsWrap.appendChild(card);
                });

                block.appendChild(cardsWrap);
                container.appendChild(block);
            });
        }

        function createPhaseCard(sub, index) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.dataset.id = sub.id;
            card.style.setProperty('--i', index + 1);
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Подэтап ${sub.name}, прогресс ${sub.pct}%`);

            const overdue = isOverdue(sub);
            if (overdue) {
                card.classList.add('overdue');
                showToast(`⚠️ Подэтап "${sub.name}" идёт дольше прогноза`, 'warning');
            }

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startDate) {
                meta.innerHTML += `<span>Старт: ${formatDate(sub.startDate)}</span>`;
            }
            if (sub.endDate) {
                meta.innerHTML += `<span>Финиш: ${formatDate(sub.endDate)}</span>`;
            }
            if (sub.pct > 0 && sub.pct < 100) {
                const forecast = formatForecast(sub);
                if (forecast !== '—') {
                    meta.innerHTML += `<span class="eta">Прогноз: ${forecast}</span>`;
                }
            }
            card.appendChild(meta);

            card.addEventListener('click', function() { openModal(sub); });
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(sub);
                }
            });

            return card;
        }

        // ============================================================
        //  MODAL (основной)
        // ============================================================

        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const status = getStatusInfo(sub.pct);
            title.textContent = sub.name;
            title.className = 'modal-title status-' + status.status;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const phase = getPhaseById(sub.phaseId);
            const fields = [
                { key: 'Фаза', value: phase ? phase.label : '—' },
                { key: 'Статус', value: status.label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало', value: formatDate(sub.startDate) },
                { key: 'Окончание', value: formatDate(sub.endDate) },
                { key: 'Прогноз завершения', value: (sub.pct > 0 && sub.pct < 100) ? formatForecast(sub) : '—' },
                { key: 'Превышение прогноза', value: isOverdue(sub) ? 'Да' : 'Нет' },
                { key: 'Описание', value: sub.description || '—' },
                { key: 'Характеристики', value: sub.characteristics || '—' },
            ];
            if (sub.dependencies && sub.dependencies.length) {
                const depNames = sub.dependencies.map(id => getSubName(id)).join(', ');
                fields.push({ key: 'Зависимости', value: depNames, extraClass: 'dependencies' });
            }
            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const valueClass = f.extraClass ? `value ${f.extraClass}` : 'value';
                row.innerHTML = `<span class="key">${f.key}</span><span class="${valueClass}">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
            document.getElementById('modalClose').focus();
        }

        function showToast(message, type = 'info') {

        // ============================================================
        //  ANALYTICS
        // ============================================================

        function renderAnalytics() {
            // Бюджет
            const ctxBudget = document.getElementById('budgetChart').getContext('2d');
            const totalBudget = extraData.totalBudget;
            const spent = extraData.spentBudget;
            const remaining = totalBudget - spent;
            const data = [spent, remaining];
            const colors = [
                getComputedStyle(document.documentElement).getPropertyValue('--dot-active').trim(),
                getComputedStyle(document.documentElement).getPropertyValue('--dot-done').trim()
            ];
            const w = ctxBudget.canvas.width;
            const h = ctxBudget.canvas.height;
            ctxBudget.clearRect(0, 0, w, h);
            const cx = w/2, cy = h/2 - 10, r = Math.min(w, h) * 0.32;
            let startAngle = -Math.PI/2;
            const total = data.reduce((a,b) => a+b, 0);
            if (total > 0) {
                data.forEach((val, i) => {
                    const slice = (val / total) * 2 * Math.PI;
                    ctxBudget.beginPath();
                    ctxBudget.moveTo(cx, cy);
                    ctxBudget.arc(cx, cy, r, startAngle, startAngle + slice);
                    ctxBudget.closePath();
                    ctxBudget.fillStyle = colors[i];
                    ctxBudget.shadowColor = 'rgba(0,0,0,0.2)';
                    ctxBudget.shadowBlur = 8;
                    ctxBudget.fill();
                    ctxBudget.shadowBlur = 0;
                    startAngle += slice;
                });
            }
            const legendY = h - 30;
            ctxBudget.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim();
            ctxBudget.font = '12px Inter, sans-serif';
            ctxBudget.textAlign = 'left';
            ctxBudget.fillStyle = colors[0];
            ctxBudget.fillRect(10, legendY, 12, 12);
            ctxBudget.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim();
            ctxBudget.fillText('Использовано $' + spent + ' млн', 28, legendY + 10);
            ctxBudget.fillStyle = colors[1];
            ctxBudget.fillRect(170, legendY, 12, 12);
            ctxBudget.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim();
            ctxBudget.fillText('Не использовано $' + remaining + ' млн', 188, legendY + 10);

            // Риски
            const riskList = document.getElementById('riskList');
            riskList.innerHTML = extraData.risks.map(r => {
                const score = (r.probability * r.impact * 100).toFixed(0);
                let cls = 'low';
                if (score > 30) cls = 'medium';
                if (score > 60) cls = 'high';
                return `<div class="risk-item">
                    <span class="risk-name">${r.name}</span>
                    <span class="risk-score ${cls}">${score}%</span>
                </div>`;
            }).join('');

            // Нефть
            const ctxOil = document.getElementById('oilChart').getContext('2d');
            const oilData = extraData.oilPrices;
            const wO = ctxOil.canvas.width;
            const hO = ctxOil.canvas.height;
            ctxOil.clearRect(0, 0, wO, hO);

            const bgGrad = ctxOil.createRadialGradient(wO/2, hO/2, 0, wO/2, hO/2, Math.max(wO, hO));
            bgGrad.addColorStop(0, '#1a1a3a');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctxOil.fillStyle = bgGrad;
            ctxOil.fillRect(0, 0, wO, hO);

            const pad = { top: 24, bottom: 32, left: 40, right: 30 };
            const chartW = wO - pad.left - pad.right;
            const chartH = hO - pad.top - pad.bottom;
            const values = oilData.map(d => d.value);
            const minVal = 0;
            const maxVal = 900;
            const range = maxVal - minVal;

            ctxOil.strokeStyle = 'rgba(200,200,200,0.15)';
            ctxOil.lineWidth = 1;
            ctxOil.setLineDash([4,6]);
            for (let i=0; i<=4; i++) {
                const y = pad.top + chartH - (i/4)*chartH;
                ctxOil.beginPath(); ctxOil.moveTo(pad.left, y); ctxOil.lineTo(pad.left+chartW, y); ctxOil.stroke();
            }
            for (let i=0; i<oilData.length; i++) {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                ctxOil.beginPath(); ctxOil.moveTo(x, pad.top); ctxOil.lineTo(x, pad.top+chartH); ctxOil.stroke();
            }
            ctxOil.setLineDash([]);

            ctxOil.fillStyle = '#ffffff';
            ctxOil.font = '11px Inter, sans-serif';
            ctxOil.textAlign = 'center';
            const yLabels = [100,300,500,700,900];
            yLabels.forEach(label => {
                const y = pad.top + chartH - ((label - minVal)/range)*chartH;
                ctxOil.textAlign = 'right';
                ctxOil.fillText(label, pad.left - 6, y+4);
            });
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                ctxOil.textAlign = 'center';
                ctxOil.fillText(d.month, x, pad.top + chartH + 18);
            });

            ctxOil.textAlign = 'left';
            ctxOil.font = '12px Inter, sans-serif';
            ctxOil.strokeStyle = '#ff1493';
            ctxOil.lineWidth = 2;
            ctxOil.beginPath(); ctxOil.moveTo(8,8); ctxOil.lineTo(28,8); ctxOil.stroke();
            ctxOil.fillStyle = '#ffffff';
            ctxOil.fillText('цена за баррель', 34, 12);

            const lineColor = '#ff1493';
            const areaColor = 'rgba(255,20,147,0.15)';
            ctxOil.beginPath();
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                if (i===0) ctxOil.moveTo(x,y); else ctxOil.lineTo(x,y);
            });
            ctxOil.strokeStyle = lineColor;
            ctxOil.lineWidth = 2.5;
            ctxOil.shadowColor = lineColor;
            ctxOil.shadowBlur = 6;
            ctxOil.stroke();
            ctxOil.shadowBlur = 0;

            const lastX = pad.left + ((oilData.length-1)/(oilData.length-1))*chartW;
            const lastY = pad.top + chartH - ((oilData[oilData.length-1].value - minVal)/range)*chartH;
            ctxOil.beginPath();
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                if (i===0) ctxOil.moveTo(x,y); else ctxOil.lineTo(x,y);
            });
            ctxOil.lineTo(lastX, pad.top + chartH);
            ctxOil.lineTo(pad.left, pad.top + chartH);
            ctxOil.closePath();
            ctxOil.fillStyle = areaColor;
            ctxOil.fill();

            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                ctxOil.beginPath();
                ctxOil.arc(x, y, 6, 0, 2*Math.PI);
                ctxOil.fillStyle = '#ffffff';
                ctxOil.shadowBlur = 0;
                ctxOil.fill();
                ctxOil.beginPath();
                ctxOil.arc(x, y, 4, 0, 2*Math.PI);
                ctxOil.fillStyle = '#ff1493';
                ctxOil.fill();
                ctxOil.fillStyle = '#ffffff';
                ctxOil.font = '10px Inter, sans-serif';
                ctxOil.textAlign = 'center';
                ctxOil.fillText(d.value, x, y-10);
            });
        }

        // ============================================================
        //  STATS & TIME
        // ============================================================

        function updateStats() {
            const total = subPhases.length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();
            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;

            const overdue = subPhases.filter(s => isOverdue(s)).length;
            const badge = document.getElementById('overdueBadge');
            const countEl = document.getElementById('overdueCount');
            if (overdue > 0) {
                badge.style.display = 'flex';
                countEl.textContent = overdue;
            } else {
                badge.style.display = 'none';
            }

            renderAnalytics();
        }

        //  EXPORT
        // ============================================================

        function exportPDF() { window.print(); }

        function exportPNG() {
            const body = document.body;
            const originalBg = body.style.background;
            const originalBgColor = getComputedStyle(body).backgroundColor;
            body.style.background = originalBgColor;
            const element = document.getElementById('dashboard');
            html2canvas(element, {
                scale: 2,
                backgroundColor: originalBgColor,
                useCORS: true,
                allowTaint: true,
            }).then(canvas => {
                body.style.background = originalBg;
                const link = document.createElement('a');
                link.download = 'Arion_dashboard.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                body.style.background = originalBg;
                showToast('Ошибка экспорта PNG: ' + err.message, 'warning');
            });
        }

        function exportCSV() {
            const headers = ['ID', 'Фаза', 'Название', 'Прогресс (%)', 'Начало', 'Окончание', 'Статус', 'Превышение прогноза'];
            const rows = subPhases.map(s => {
                const phase = getPhaseById(s.phaseId);
                return [
                    s.id,
                    phase ? phase.label : '—',
                    s.name,
                    s.pct,
                    formatDate(s.startDate),
                    formatDate(s.endDate),
                    getStatusInfo(s.pct).label,
                    isOverdue(s) ? 'Да' : 'Нет'
                ];
            });
            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Arion_status.csv';
            link.click();
            showToast('CSV экспортирован успешно', 'success');
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const optionsContainer = document.getElementById('themeOptions');
            optionsContainer.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `
                    <div class="color-preview" style="background:${t.color};"></div>
                    ${t.label}
                `;
                div.addEventListener('click', () => {
                    applyTheme(t.id);
                    overlay.classList.remove('active');
                });
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            document.getElementById('themeModalClose').focus();
        }

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            // Время в шапке
            function updateHeaderTime() {
                const now = new Date();
                document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            }
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);

            applyTheme(currentTheme);
            renderTimeline();
            renderPhases();
            updateStats();

            const overdueCount = subPhases.filter(s => isOverdue(s)).length;
            if (overdueCount > 0) {
                showToast(`⚠️ Обнаружено ${overdueCount} подэтапов с превышением прогноза`, 'warning');
            }

            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
            });
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', function() {
                document.getElementById('themeModalOverlay').classList.remove('active');
            });
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('modalOverlay').classList.remove('active');
                    document.getElementById('themeModalOverlay').classList.remove('active');
                }
            });

            setInterval(updateStats, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
