        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
            transition: background 0.3s;
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(76,217,160,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }
        .theme-btn:focus-visible { outline: 2px solid var(--accent-gold); }

        .dashboard { max-width: 1400px; width: 100%; padding: 20px 24px 40px; }

        @keyframes glow-title {
            0% { text-shadow: 0 0 40px var(--accent-glow), 0 0 80px rgba(245,176,65,0.05); }
            100% { text-shadow: 0 0 70px var(--accent-glow), 0 0 140px rgba(245,176,65,0.2); }
        }
        @keyframes pulse-red {
            0%,100% { box-shadow:0 0 30px rgba(231,76,60,0.4),0 0 60px rgba(231,76,60,0.2); }
            50% { box-shadow:0 0 80px rgba(231,76,60,0.8),0 0 150px rgba(231,76,60,0.3); }
        }
        @keyframes ring-pulse {
            0%,100% { transform:scale(1); opacity:0.6; }
            50% { transform:scale(1.6); opacity:0; }
        }
        @keyframes pulse-fleet {
            0%,100% { box-shadow: 0 0 30px rgba(110,198,255,0.4), 0 0 60px rgba(110,198,255,0.2); }
            50% { box-shadow: 0 0 80px rgba(110,198,255,0.8), 0 0 150px rgba(110,198,255,0.3); }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes wave {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        .wave-bg {
            background: linear-gradient(270deg, var(--bg-panel), var(--bg-card), var(--bg-panel));
            background-size: 200% 200%;
            animation: wave 6s ease-in-out infinite;
        }

        .header {
            display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px;
        }
        .header-left { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin:0;
            animation: glow-title 3s ease-in-out infinite alternate;
            position:relative;
            display:inline-block;
        }
        .header-left h1::after {
            content:''; position:absolute; bottom:-6px; left:0; width:60%; height:3px;
            background:linear-gradient(90deg, var(--gradient-start), transparent); border-radius:4px;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card); backdrop-filter:blur(8px);
            padding:6px 14px; border-radius:40px; border:1px solid var(--border-color);
            font-size:14px; box-shadow:var(--shadow);
            transition:border-color 0.3s, box-shadow 0.3s;
        }
        .stat-badge:hover { border-color:var(--accent-gold); box-shadow:0 4px 30px var(--accent-glow); }
        .stat-badge .num { font-weight:700; font-size:18px; color:var(--accent-gold); }
        .stat-badge .num.green { color:var(--dot-done); }
        .stat-badge .num.danger { color:var(--dot-active); }
        .stat-badge .label { color:var(--text-muted); font-weight:400; }
        .update-time {
            font-size:13px; color:var(--text-muted);
            display:flex; flex-direction:column; align-items:flex-end; line-height:1.4;
            background:var(--bg-card); backdrop-filter:blur(4px);
            padding:4px 14px; border-radius:40px; border:1px solid var(--border-color);
        }
        .update-time .time-row { display:flex; align-items:center; gap:6px; }
        .update-time .dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--dot-done); animation:pulse-dot 2s ease-in-out infinite;
            box-shadow:0 0 12px rgba(76,217,160,0.4);
        }

        .toast-container {
            position:fixed; top:20px; right:20px; z-index:9999;
            display:flex; flex-direction:column; gap:10px; max-width:360px; width:100%; pointer-events:none;
        }
        .toast {
            background:var(--bg-card); backdrop-filter:blur(8px);
            border:1px solid var(--border-color); border-left:4px solid var(--accent-gold);
            border-radius:12px; padding:12px 16px;
            box-shadow:0 8px 30px rgba(0,0,0,0.4);
            pointer-events:auto; animation:fadeInUp 0.3s ease forwards;
            color:var(--text-secondary); font-size:14px;
            display:flex; justify-content:space-between; align-items:center; gap:12px;
        }
        .toast.warning { border-left-color:var(--dot-active); }
        .toast.success { border-left-color:var(--dot-done); }
        .toast .toast-close { background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:0 4px; }

        .export-bar {
            display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px;
        }
        .export-btn {
            background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:6px 16px; border-radius:40px;
            font-size:13px; cursor:pointer; transition:all 0.2s;
            display:flex; align-items:center; gap:6px;
        }
        .export-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); box-shadow:0 0 20px var(--accent-glow); }
        .export-btn:focus-visible { outline:2px solid var(--accent-gold); }

        .timeline-wrapper {
            background:var(--bg-panel); backdrop-filter:blur(10px);
            border-radius:24px; padding:30px 20px 24px;
            border:1px solid var(--border-color); margin-bottom:28px;
            box-shadow:var(--shadow); overflow:hidden;
            transition:background 0.4s, border-color 0.4s;
        }
        .timeline-track { position:relative; height:100px; width:100%; padding:0 6%; }
        .timeline-line {
            position:absolute; top:50%; left:6%; right:6%; height:5px;
            background:var(--line-bg); border-radius:4px; transform:translateY(-50%);
            z-index:1; box-shadow:0 0 20px rgba(255,255,255,0.05), inset 0 0 8px rgba(0,0,0,0.5);
            overflow:visible;
        }
        .seg-fill {
            position:absolute; top:0; height:100%; border-radius:4px;
            background:var(--line-fill);
            box-shadow:0 0 20px var(--accent-glow), 0 0 40px rgba(245,176,65,0.1);
            transition:width 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s cubic-bezier(0.4,0,0.2,1);
            width:0%; left:0%;
        }
        .timeline-dot {
            position:absolute; top:50%; transform:translate(-50%,-50%);
            width:64px; height:64px; border-radius:50%;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-weight:700; color:#fff; cursor:pointer; z-index:2;
            transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
            user-select:none; border:2px solid rgba(255,255,255,0.15);
            box-shadow:0 4px 24px rgba(0,0,0,0.6);
            background:#1a2332; text-shadow:0 1px 6px rgba(0,0,0,0.6);
            will-change:transform;
        }
        .timeline-dot .dot-pct { font-size:17px; line-height:1.1; }
        .timeline-dot .dot-label { font-size:9px; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; opacity:0.8; margin-top:1px; text-align:center; max-width:56px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .timeline-dot.done { background:linear-gradient(135deg,#2b6a9e,#1d4a7a); border-color:#4a8ec4; box-shadow:0 0 30px rgba(42,106,158,0.4), inset 0 0 20px rgba(74,142,196,0.2); }
        .timeline-dot.active { background:linear-gradient(135deg,#c0392b,#e74c3c); border-color:#e74c3c; box-shadow:0 0 50px rgba(231,76,60,0.6), inset 0 0 30px rgba(231,76,60,0.3); animation:pulse-red 1.8s ease-in-out infinite; }
        .timeline-dot.active::after { border-color:rgba(231,76,60,0.3); animation:ring-pulse 1.8s ease-in-out infinite; }
        .timeline-dot.pending { background:linear-gradient(135deg,#2a3a4e,#1a2332); border-color:#3a4a5e; box-shadow:0 0 20px rgba(0,0,0,0.3); }
        .timeline-dot:hover { transform:translate(-50%,-50%) scale(1.12); z-index:5; }
        .timeline-dot:focus-visible { outline:2px solid var(--accent-gold); outline-offset:4px; }

        /* ===== Fleet track (отдельная линия под основной) ===== */
        .fleet-track {

        .fleet-dot {

        .fleet-dot:hover {

        .fleet-dot:focus-visible { outline:2px solid var(--fleet-accent); outline-offset:4px; }

        /* Статусы флот-кружка: серый / голубой / зелёный */
        .fleet-dot.pending {
            border-color: #3a4a5e;

        .fleet-dot.active {
            border-color: var(--fleet-accent);
            background: radial-gradient(circle at 50% 40%, rgba(110,198,255,0.3), rgba(26,35,50,0.95));

        .fleet-dot.done {

        .info-panel {

        .info-panel .info-name.status-done { color:var(--dot-done); text-shadow:0 0 30px rgba(76,217,160,0.3); }
        .info-panel .info-name.status-active { color:var(--accent-gold); text-shadow:0 0 30px var(--accent-glow); }
        .info-panel .info-name.status-pending { color:var(--text-muted); text-shadow:none; }
        .info-panel .info-name.fleet-active { color: var(--fleet-accent); text-shadow: 0 0 30px rgba(110,198,255,0.4); }
        .info-panel .info-name.fleet-done { color: var(--dot-done); }
        .info-panel .info-name.fleet-pending { color: var(--text-muted); }
        .info-panel .info-details { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }

        .phases-section { margin-top:28px; display:flex; flex-direction:column; gap:24px; }
        .phase-block {
            background:var(--bg-panel); backdrop-filter:blur(6px);

        }
        .phase-block:hover { border-color:var(--accent-gold); box-shadow:var(--shadow); }

        .phase-header {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px; flex-wrap:wrap; gap:8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); letter-spacing:0.2px; }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress { font-size:14px; font-weight:500; color:var(--accent-gold); background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color); }
        .fleet-block .phase-progress { color: var(--fleet-accent); border-color: rgba(110,198,255,0.3); }
        .phase-cards { display:flex; flex-wrap:wrap; gap:12px; }
        .phase-card {

        .phase-card .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .phase-card .card-name { font-size:14px; font-weight:500; color:var(--text-primary); flex:1; min-width:0; }
        .phase-card .card-pct { font-size:16px; font-weight:700; color:var(--accent-gold); min-width:48px; text-align:right; flex-shrink:0; }
        .phase-card .card-pct.done { color:var(--dot-done); }
        .phase-card .card-pct.pending { color:var(--text-muted); }
        /* Флот: голубые названия и % когда в процессе */
        .fleet-card .card-name.active { color: var(--fleet-accent); }

        .phase-card .card-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 12px rgba(0,0,0,0.3); transition:box-shadow 0.3s; }
        .phase-card .card-status-dot.done { background:var(--dot-done); box-shadow:0 0 16px rgba(76,217,160,0.3); }
        .phase-card .card-status-dot.active { background:var(--dot-active); box-shadow:0 0 20px rgba(231,76,60,0.5); animation:pulse-dot 1.6s ease-in-out infinite; }
        .phase-card .card-status-dot.pending { background:var(--dot-pending); }

        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta span { display:flex; align-items:center; gap:4px; }

        .modal-overlay {

        .modal .modal-title {
            font-size:20px; font-weight:600; margin-bottom:8px;

        }
        .modal .modal-title.status-done { color: var(--dot-done) !important; text-shadow: 0 0 30px rgba(76,217,160,0.3); }
        .modal .modal-title.status-active { color: var(--accent-gold) !important; text-shadow: 0 0 30px var(--accent-glow); }
        .modal .modal-title.status-pending { color: var(--text-muted) !important; text-shadow: none; }
        .modal .modal-title.fleet-active { color: var(--fleet-accent) !important; text-shadow: 0 0 30px rgba(110,198,255,0.4); }

        .modal .modal-close:focus-visible { outline:2px solid var(--accent-gold); }
        .modal .modal-body { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text-secondary); }
        .modal .modal-body .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .modal .modal-body .row .key { color:var(--text-muted); flex-shrink:0; margin-right:12px; }
        .modal .modal-body .row .value { font-weight:500; color:var(--text-primary); text-align:right; word-break:break-word; }
        .modal .modal-body .row .value.dependencies { font-weight:400; color:var(--text-muted); font-size:13px; }

        .theme-modal .theme-options {
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:12px; margin-top:16px;
        }
        .theme-modal .theme-option {

        .theme-modal .theme-option .color-preview {

        .version {

        @media (max-width: 820px) {

    </style>
</head>

    <script>

        const phases = [
            { id: 'p1', label: 'Разведка и бурение', startDate: '2026-08-16', endDate: '2026-09-04', budget: 500 },

        // ============================================================
        //  HELPERS
        // ============================================================

        function getPhaseById(id) { return phases.find(p => p.id === id); }
        function getSubsByPhase(phaseId) { return subPhases.filter(s => s.phaseId === phaseId); }

        function getAllSubs() {
            return subPhases.concat(fleetPhases);
        }

        function getPhaseProgress(phaseId) {
            const subs = getSubsByPhase(phaseId);
            if (!subs.length) return 0;
            const sum = subs.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / subs.length);
        }

        function getFleetProgress() {
            if (!fleetPhases.length) return 0;
            const sum = fleetPhases.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / fleetPhases.length);
        }

        function getOverallProgress() {
            const all = getAllSubs();
            if (!all.length) return 0;
            const sum = all.reduce((acc, s) => acc + s.pct, 0);
            return Math.round(sum / all.length);
        }

        function getCompletedCount() { return getAllSubs().filter(s => s.pct >= 100).length; }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getSubName(id) {
            const all = getAllSubs();
            const sub = all.find(s => s.id === id);
            return sub ? sub.name : id;
        }

        function getPhaseLabel(phaseId) {
            const phase = getPhaseById(phaseId);
            if (phase) return phase.label;
            if (phaseId === 'fleet') return 'Флот и судостроение';
            return '—';
        }

        // ============================================================
        //  РАСЧЁТ ПРОГНОЗА
        //  Прогноз = CURRENT_DATE + (100 - pct) / (pct / дней_прошло)
        // ============================================================

        function calculateForecast(sub) {
            if (!sub.startDate || sub.pct <= 0 || sub.pct >= 100) return null;
            const start = new Date(sub.startDate);
            const elapsed = (CURRENT_DATE - start) / (1000 * 60 * 60 * 24);
            if (elapsed <= 0) return null;
            const rate = sub.pct / elapsed;
            if (rate <= 0) return null;
            const daysLeft = (100 - sub.pct) / rate;
            return new Date(CURRENT_DATE.getTime() + daysLeft * 86400000);
        }

        function formatForecast(sub) {
            const fc = calculateForecast(sub);
            if (!fc) return '—';
            return fc.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function isOverdue(sub) {
            if (sub.pct >= 100) return false;
            const fc = calculateForecast(sub);
            if (!fc) return false;
            return fc < new Date();
        }

        // ============================================================
        //  RENDER TIMELINE
        // ============================================================

        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            let line = document.getElementById('timelineLine');
            if (!line) {
                line = document.createElement('div');
                line.id = 'timelineLine';
                line.className = 'timeline-line';
                track.appendChild(line);
            }
            line.querySelectorAll('.seg-fill').forEach(el => el.remove());

            const n = phases.length;
            const leftMargin = 6, rightMargin = 6, range = 100 - leftMargin - rightMargin;
            const dotPositions = phases.map((_, i) => leftMargin + (i / (n - 1)) * range);

            phases.forEach((phase, index) => {
                const progress = getPhaseProgress(phase.id);
                const status = getStatusInfo(progress);
                const x = dotPositions[index];
                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = x + '%';
                dot.dataset.phaseId = phase.id;
                dot.setAttribute('tabindex', '0');
                dot.setAttribute('role', 'button');
                dot.setAttribute('aria-label', `Фаза ${phase.label}, прогресс ${progress}%`);

                const pctSpan = document.createElement('span');
                pctSpan.className = 'dot-pct';
                pctSpan.textContent = progress + '%';
                dot.appendChild(pctSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'dot-label';
                labelSpan.textContent = phase.label.split(' ')[0];
                dot.appendChild(labelSpan);

                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    showPhaseInfo(phase.id);
                });
                dot.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        showPhaseInfo(phase.id);
                    }
                });

                track.appendChild(dot);
            });

            for (let i = 0; i < n - 1; i++) {
                const leftPos = dotPositions[i];
                const rightPos = dotPositions[i + 1];
                const segmentWidth = rightPos - leftPos;
                const progress = getPhaseProgress(phases[i].id);
                const fillWidth = (progress / 100) * segmentWidth;
                if (fillWidth > 0) {
                    const fill = document.createElement('div');
                    fill.className = 'seg-fill';
                    fill.style.left = leftPos + '%';
                    fill.style.width = fillWidth + '%';
                    line.appendChild(fill);
                }
            }
        }

            const header = document.createElement('div');
            header.className = 'phase-header';
            header.innerHTML = `
                <span class="phase-title">Флот и судостроение</span>
                <div class="phase-meta">
                    <span>Начало: ${start}</span>
                    <span>Окончание: ${end}</span>
                    <span>Бюджет: ${budget}</span>
                </div>
                <span class="phase-progress">${fleetProgress}%</span>
            `;
            block.appendChild(header);

            const cardsWrap = document.createElement('div');
            cardsWrap.className = 'phase-cards';

            fleetPhases.forEach((sub, idx) => {
                const card = createPhaseCard(sub, idx);
                cardsWrap.appendChild(card);
            });

            block.appendChild(cardsWrap);
            container.appendChild(block);
        }

        function createPhaseCard(sub, index) {
            const status = getStatusInfo(sub.pct);
            const isFleet = sub.phaseId === 'fleet';
            const card = document.createElement('div');
            card.className = 'phase-card' + (isFleet ? ' fleet-card' : '');
            card.dataset.id = sub.id;
            card.style.setProperty('--i', index + 1);
            card.style.animationDelay = (0.02 * (index + 1)) + 's';
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-label', `Подэтап ${sub.name}, прогресс ${sub.pct}%`);

            const overdue = isOverdue(sub);
            if (overdue) {
                card.classList.add('overdue');
                showToast(`⚠️ Подэтап "${sub.name}" идёт дольше прогноза`, 'warning');
            }

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name' + (isFleet && status.status === 'active' ? ' active' : '');
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startDate) {
                meta.innerHTML += `<span>Старт: ${formatDate(sub.startDate)}</span>`;
            }
            if (sub.endDate) {
                meta.innerHTML += `<span>Финиш: ${formatDate(sub.endDate)}</span>`;
            }
            if (sub.pct > 0 && sub.pct < 100) {
                const forecast = formatForecast(sub);
                if (forecast !== '—') {
                    meta.innerHTML += `<span class="eta">Прогноз: ${forecast}</span>`;
                }
            }
            card.appendChild(meta);

            card.addEventListener('click', function() { openModal(sub); });
            card.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openModal(sub);
                }
            });

            return card;
        }

        // ============================================================
        //  MODAL
        // ============================================================

        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const status = getStatusInfo(sub.pct);
            const isFleet = sub.phaseId === 'fleet';
            title.textContent = sub.name;
            title.className = 'modal-title status-' + status.status + (isFleet && status.status === 'active' ? ' fleet-active' : '');

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const fields = [
                { key: 'Фаза / Трек', value: getPhaseLabel(sub.phaseId) },
                { key: 'Статус', value: status.label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало', value: formatDate(sub.startDate) },
                { key: 'Окончание', value: formatDate(sub.endDate) },
                { key: 'Прогноз завершения', value: (sub.pct > 0 && sub.pct < 100) ? formatForecast(sub) : '—' },
                { key: 'Превышение прогноза', value: isOverdue(sub) ? 'Да' : 'Нет' },
                { key: 'Описание', value: sub.description || '—' },
                { key: 'Характеристики', value: sub.characteristics || '—' }
            ];
            if (sub.dependencies && sub.dependencies.length) {
                const depNames = sub.dependencies.map(id => getSubName(id)).join(', ');
                fields.push({ key: 'Зависимости', value: depNames, extraClass: 'dependencies' });
            }
            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const valueClass = f.extraClass ? `value ${f.extraClass}` : 'value';
                row.innerHTML = `<span class="key">${f.key}</span><span class="${valueClass}">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
            document.getElementById('modalClose').focus();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span><button class="toast-close">&times;</button>`;
            container.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ============================================================
        //  ANALYTICS
        // ============================================================

        function renderAnalytics() {
            const ctxBudget = document.getElementById('budgetChart').getContext('2d');
            const spent1 = spentByPhase.p1 || 0;
            const spent2 = spentByPhase.p2 || 0;
            const spent3 = spentByPhase.p3 || 0;
            const spent4 = spentByPhase.p4 || 0;
            const spent5 = spentByPhase.p5 || 0;
            const spentFleet = spentByPhase.fleet || 0;
            const totalBudget = budgetByPhase.p1 + budgetByPhase.p2 + budgetByPhase.p3 + budgetByPhase.p4 + budgetByPhase.p5 + budgetByPhase.fleet;
            const totalSpent = spent1 + spent2 + spent3 + spent4 + spent5 + spentFleet;
            const remaining = totalBudget - totalSpent;

            const data = [spent1, spent2, spent3, spent4, spent5, spentFleet, remaining];
            const labels = ['Этап 1 (потрачено)', 'Этап 2 (потрачено)', 'Этап 3 (потрачено)', 'Этап 4 (потрачено)', 'Этап 5 (потрачено)', 'Флот (потрачено)', 'Остаток бюджета'];
            const colors = ['#f5b041', '#4a8ec4', '#9b59b6', '#e74c3c', '#2ecc71', '#6ec6ff', '#5a6a7e'];

            const w = ctxBudget.canvas.width;
            const h = ctxBudget.canvas.height;
            ctxBudget.clearRect(0, 0, w, h);

            const cx = w/2, cy = h/2 - 10, r = Math.min(w, h) * 0.32;
            let startAngle = -Math.PI/2;
            const total = data.reduce((a,b) => a+b, 0);

            if (total > 0) {
                data.forEach((val, i) => {
                    const slice = (val / total) * 2 * Math.PI;
                    ctxBudget.beginPath();
                    ctxBudget.moveTo(cx, cy);
                    ctxBudget.arc(cx, cy, r, startAngle, startAngle + slice);
                    ctxBudget.closePath();
                    ctxBudget.fillStyle = colors[i % colors.length];
                    ctxBudget.shadowColor = 'rgba(0,0,0,0.2)';
                    ctxBudget.shadowBlur = 8;
                    ctxBudget.fill();
                    ctxBudget.shadowBlur = 0;
                    startAngle += slice;
                });
            }

            let legendY = h - 30;
            ctxBudget.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() || '#b0c4de';
            ctxBudget.font = '11px Inter, sans-serif';
            ctxBudget.textAlign = 'left';

            let legendX = 10;
            const maxWidth = w - 20;
            labels.forEach((label, i) => {
                const val = data[i];
                if (val > 0) {
                    const text = label + ' $' + val + ' млн';
                    const textWidth = ctxBudget.measureText(text).width;
                    if (legendX + textWidth + 20 > maxWidth) {
                        legendX = 10;
                        legendY += 18;
                    }
                    ctxBudget.fillStyle = colors[i % colors.length];
                    ctxBudget.fillRect(legendX, legendY, 12, 12);
                    ctxBudget.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() || '#b0c4de';
                    ctxBudget.fillText(text, legendX + 16, legendY + 10);
                    legendX += textWidth + 24;
                }
            });

            const riskList = document.getElementById('riskList');
            riskList.innerHTML = extraData.risks.map(r => {
                const score = (r.probability * r.impact * 100).toFixed(0);
                let cls = 'low';
                if (score > 30) cls = 'medium';
                if (score > 60) cls = 'high';
                return `<div class="risk-item"><span class="risk-name">${r.name}</span><span class="risk-score ${cls}">${score}%</span></div>`;
            }).join('');

            const ctxOil = document.getElementById('oilChart').getContext('2d');
            const oilData = extraData.oilPrices;
            const wO = ctxOil.canvas.width;
            const hO = ctxOil.canvas.height;
            ctxOil.clearRect(0, 0, wO, hO);

            const bgGrad = ctxOil.createRadialGradient(wO/2, hO/2, 0, wO/2, hO/2, Math.max(wO, hO));
            bgGrad.addColorStop(0, '#1a1a3a');
            bgGrad.addColorStop(1, '#0a0a1a');
            ctxOil.fillStyle = bgGrad;
            ctxOil.fillRect(0, 0, wO, hO);

            const pad = { top: 24, bottom: 32, left: 40, right: 30 };
            const chartW = wO - pad.left - pad.right;
            const chartH = hO - pad.top - pad.bottom;
            const minVal = 0, maxVal = 900, range = maxVal - minVal;

            ctxOil.strokeStyle = 'rgba(200,200,200,0.15)';
            ctxOil.lineWidth = 1;
            ctxOil.setLineDash([4,6]);
            for (let i=0; i<=4; i++) {
                const y = pad.top + chartH - (i/4)*chartH;
                ctxOil.beginPath(); ctxOil.moveTo(pad.left, y); ctxOil.lineTo(pad.left+chartW, y); ctxOil.stroke();
            }
            for (let i=0; i<oilData.length; i++) {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                ctxOil.beginPath(); ctxOil.moveTo(x, pad.top); ctxOil.lineTo(x, pad.top+chartH); ctxOil.stroke();
            }
            ctxOil.setLineDash([]);

            ctxOil.fillStyle = '#ffffff';
            ctxOil.font = '11px Inter, sans-serif';
            ctxOil.textAlign = 'center';
            [100,300,500,700,900].forEach(label => {
                const y = pad.top + chartH - ((label - minVal)/range)*chartH;
                ctxOil.textAlign = 'right';
                ctxOil.fillText(label, pad.left - 6, y+4);
            });
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                ctxOil.textAlign = 'center';
                ctxOil.fillText(d.month, x, pad.top + chartH + 18);
            });

            ctxOil.textAlign = 'left';
            ctxOil.font = '12px Inter, sans-serif';
            ctxOil.strokeStyle = '#ff1493';
            ctxOil.lineWidth = 2;
            ctxOil.beginPath(); ctxOil.moveTo(8,8); ctxOil.lineTo(28,8); ctxOil.stroke();
            ctxOil.fillStyle = '#ffffff';
            ctxOil.fillText('цена за баррель', 34, 12);

            const lineColor = '#ff1493';
            const areaColor = 'rgba(255,20,147,0.15)';
            ctxOil.beginPath();
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                if (i===0) ctxOil.moveTo(x,y); else ctxOil.lineTo(x,y);
            });
            ctxOil.strokeStyle = lineColor;
            ctxOil.lineWidth = 2.5;
            ctxOil.shadowColor = lineColor;
            ctxOil.shadowBlur = 6;
            ctxOil.stroke();
            ctxOil.shadowBlur = 0;

            const lastX = pad.left + ((oilData.length-1)/(oilData.length-1))*chartW;
            ctxOil.beginPath();
            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                if (i===0) ctxOil.moveTo(x,y); else ctxOil.lineTo(x,y);
            });
            ctxOil.lineTo(lastX, pad.top + chartH);
            ctxOil.lineTo(pad.left, pad.top + chartH);
            ctxOil.closePath();
            ctxOil.fillStyle = areaColor;
            ctxOil.fill();

            oilData.forEach((d,i) => {
                const x = pad.left + (i/(oilData.length-1))*chartW;
                const y = pad.top + chartH - ((d.value - minVal)/range)*chartH;
                ctxOil.beginPath();
                ctxOil.arc(x, y, 6, 0, 2*Math.PI);
                ctxOil.fillStyle = '#ffffff';
                ctxOil.shadowBlur = 0;
                ctxOil.fill();
                ctxOil.beginPath();
                ctxOil.arc(x, y, 4, 0, 2*Math.PI);
                ctxOil.fillStyle = '#ff1493';
                ctxOil.fill();
                ctxOil.fillStyle = '#ffffff';
                ctxOil.font = '10px Inter, sans-serif';
                ctxOil.textAlign = 'center';
                ctxOil.fillText(d.value, x, y-10);
            });
        }

        function updateStats() {
            const total = getAllSubs().length;
            const completed = getCompletedCount();
            const overall = getOverallProgress();
            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = total;

            const now = new Date();
            const timeStr = now.toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;

            const overdue = getAllSubs().filter(s => isOverdue(s)).length;
            const badge = document.getElementById('overdueBadge');
            const countEl = document.getElementById('overdueCount');
            if (overdue > 0) {
                badge.style.display = 'flex';
                countEl.textContent = overdue;
            } else {
                badge.style.display = 'none';
            }

            renderAnalytics();
        }

        function exportPDF() { window.print(); }

        function exportPNG() {
            const body = document.body;
            const originalBg = body.style.background;
            const originalBgColor = getComputedStyle(body).backgroundColor;
            body.style.background = originalBgColor;
            const element = document.getElementById('dashboard');
            html2canvas(element, {
                scale: 2, backgroundColor: originalBgColor, useCORS: true, allowTaint: true,
            }).then(canvas => {
                body.style.background = originalBg;
                const link = document.createElement('a');
                link.download = 'Arion_dashboard.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                body.style.background = originalBg;
                showToast('Ошибка экспорта PNG: ' + err.message, 'warning');
            });
        }

        function exportCSV() {
            const headers = ['ID', 'Фаза/Трек', 'Название', 'Прогресс (%)', 'Начало', 'Окончание', 'Статус', 'Превышение прогноза'];
            const rows = getAllSubs().map(s => [
                s.id,
                getPhaseLabel(s.phaseId),
                s.name,
                s.pct,
                formatDate(s.startDate),
                formatDate(s.endDate),
                getStatusInfo(s.pct).label,
                isOverdue(s) ? 'Да' : 'Нет'
            ]);
            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'Arion_status.csv';
            link.click();
            showToast('CSV экспортирован успешно', 'success');
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const optionsContainer = document.getElementById('themeOptions');
            optionsContainer.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `<div class="color-preview" style="background:${t.color};"></div>${t.label}`;
                div.addEventListener('click', () => {
                    applyTheme(t.id);
                    overlay.classList.remove('active');
                });
                optionsContainer.appendChild(div);
            });
            overlay.classList.add('active');
            document.getElementById('themeModalClose').focus();
        }

        function init() {
            function updateHeaderTime() {
                const now = new Date();
                document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            }
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);

            applyTheme(currentTheme);
            renderTimeline();
            renderFleetTrack();
            renderPhases();
            renderFleetPhases();
            updateStats();

            const overdueCount = getAllSubs().filter(s => isOverdue(s)).length;
            if (overdueCount > 0) {
                showToast(`⚠️ Обнаружено ${overdueCount} подэтапов с превышением прогноза`, 'warning');
            }

            document.getElementById('modalClose').addEventListener('click', function() {
                document.getElementById('modalOverlay').classList.remove('active');
            });
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', function() {
                document.getElementById('themeModalOverlay').classList.remove('active');
            });
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    document.getElementById('modalOverlay').classList.remove('active');
                    document.getElementById('themeModalOverlay').classList.remove('active');
                }
            });

            setInterval(updateStats, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
