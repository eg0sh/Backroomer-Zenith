        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .top-menu .nav-links { display: flex; gap: 24px; flex-wrap: wrap; }
        .top-menu .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; }
        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .dashboard { max-width: 1400px; width: 100%; padding: 20px 24px 40px; }

        @keyframes pulse-red {
            0%,100% { box-shadow:0 0 30px rgba(231,76,60,0.4); }
            50% { box-shadow:0 0 80px rgba(231,76,60,0.8); }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }

        .header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin:0;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card);
            padding:6px 14px; border-radius:40px; border:1px solid var(--border-color);
            font-size:14px; box-shadow:var(--shadow);
        }
        .stat-badge .num { font-weight:700; font-size:18px; color:var(--accent-gold); }
        .stat-badge .num.green { color:var(--dot-done); }
        .stat-badge .label { color:var(--text-muted); font-weight:400; }
        .update-time {
            font-size:13px; color:var(--text-muted);
            background:var(--bg-card);
            padding:4px 14px; border-radius:40px; border:1px solid var(--border-color);
            display:flex; align-items:center; gap:6px;
        }
        .update-time .dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--dot-done); animation:pulse-dot 2s ease-in-out infinite;
        }

        .export-bar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
        .export-btn {
            background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:6px 16px; border-radius:40px;
            font-size:13px; cursor:pointer; transition:all 0.2s;
        }
        .export-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }

        .timeline-wrapper {
            background:var(--bg-panel);
            border-radius:24px; padding:30px 20px 24px;
            border:1px solid var(--border-color); margin-bottom:28px;
            box-shadow:var(--shadow);
        }
        .extra-tracks {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 10px;
        }
        .track-row-extra {
            position: relative;
            padding: 14px 6% 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .track-row-extra::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            opacity: 0.5;
            background: repeating-linear-gradient(90deg, var(--zenith-accent) 0 6px, transparent 6px 14px);
        }
        .track-row-extra.sentinel-row::before {
            background: repeating-linear-gradient(90deg, var(--sentinel-accent) 0 6px, transparent 6px 14px);
        }
        .fleet-dot, .zenith-dot, .sentinel-dot {
            position: relative;
            width: 80px; height: 80px; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; cursor: pointer; z-index: 2;
            transition: all 0.3s; user-select: none; border: 2px dashed;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
        }
        .zenith-dot { border-color: var(--zenith-accent); background: radial-gradient(circle at 50% 40%, rgba(243,156,18,0.15), rgba(26,35,50,0.95)); }
        .sentinel-dot { border-color: var(--sentinel-accent); background: radial-gradient(circle at 50% 40%, rgba(231,76,60,0.15), rgba(26,35,50,0.95)); }
        .zenith-dot .dot-pct, .sentinel-dot .dot-pct { font-size:18px; line-height:1.1; }
        .zenith-dot .dot-label, .sentinel-dot .dot-label {
            font-size:10px; font-weight:500; text-transform:uppercase;
            letter-spacing:0.3px; opacity:0.85; margin-top:2px; text-align:center;
            max-width:72px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .zenith-dot:hover, .sentinel-dot:hover { transform: scale(1.08); }
        .zenith-dot.active { animation:pulse-dot 1.8s ease-in-out infinite; }
        .sentinel-dot.active { animation:pulse-red 1.8s ease-in-out infinite; }
        .zenith-dot.done, .sentinel-dot.done {
            border-style: solid;
            border-color: var(--dot-done);
            background: radial-gradient(circle at 50% 40%, rgba(76,217,160,0.3), rgba(26,35,50,0.95));
        }
        .zenith-dot.pending, .sentinel-dot.pending {
            border-color: #3a4a5e;
            background: radial-gradient(circle at 50% 40%, rgba(90,106,126,0.15), rgba(26,35,50,0.95));
        }

        .info-panel {
            margin-top:18px; background:var(--bg-card);
            border-radius:16px; border:1px solid var(--border-color);
            padding:14px 22px; min-height:56px;
            display:flex; align-items:center; gap:20px; flex-wrap:wrap;
            box-shadow:var(--shadow);
        }
        .info-panel .info-placeholder { color:var(--text-muted); font-size:14px; }
        .info-panel .info-name { font-size:20px; font-weight:600; }
        .info-panel .info-name.status-done { color:var(--dot-done); }
        .info-panel .info-name.status-active { color:var(--accent-gold); }
        .info-panel .info-name.status-pending { color:var(--text-muted); }
        .info-panel .info-name.zenith-active { color: var(--zenith-accent); }
        .info-panel .info-name.sentinel-active { color: var(--sentinel-accent); }
        .info-panel .info-details { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
        .info-panel .info-details .detail-item { display:flex; align-items:baseline; gap:6px; }
        .info-panel .info-details .detail-item .label { color:var(--text-muted); }

        .phases-section { margin-top:28px; display:flex; flex-direction:column; gap:24px; }
        .phase-block {
            background:var(--bg-panel);
            border-radius:20px; border:1px solid var(--border-color);
            padding:18px 22px 20px; box-shadow:var(--shadow);
        }
        .phase-block.zenith-block { border-left: 4px dashed var(--zenith-accent); }
        .phase-block.sentinel-block { border-left: 4px dashed var(--sentinel-accent); }
        .phase-header {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px; flex-wrap:wrap; gap:8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress { font-size:14px; font-weight:500; color:var(--accent-gold); background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color); }
        .zenith-block .phase-progress { color: var(--zenith-accent); }
        .sentinel-block .phase-progress { color: var(--sentinel-accent); }
        .phase-cards { display:flex; flex-wrap:wrap; gap:12px; }
        .phase-card {
            background:var(--bg-card);
            border-radius:14px; padding:12px 18px;
            border:1px solid var(--border-color);
            flex:0 1 auto; min-width:180px; max-width:320px;
            display:flex; flex-direction:column; gap:4px;
            cursor:pointer; transition:all 0.3s;
            box-shadow:var(--shadow);
            opacity:0; animation:fadeInUp 0.5s ease forwards;
        }
        .phase-card:hover { border-color:var(--accent-gold); transform:translateY(-3px) scale(1.02); }
        .zenith-card:hover { border-color: var(--zenith-accent); }
        .sentinel-card:hover { border-color: var(--sentinel-accent); }
        .phase-card.overdue { border-color:var(--dot-active); }
        .phase-card .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .phase-card .card-name { font-size:14px; font-weight:500; color:var(--text-primary); flex:1; min-width:0; }
        .phase-card .card-pct { font-size:16px; font-weight:700; color:var(--accent-gold); min-width:48px; text-align:right; flex-shrink:0; }
        .phase-card .card-pct.done { color:var(--dot-done); }
        .phase-card .card-pct.pending { color:var(--text-muted); }
        .zenith-card .card-name.active { color: var(--zenith-accent); }
        .sentinel-card .card-name.active { color: var(--sentinel-accent); }
        .zenith-card .card-pct.active { color: var(--zenith-accent); }
        .sentinel-card .card-pct.active { color: var(--sentinel-accent); }
        .phase-card .card-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .phase-card .card-status-dot.done { background:var(--dot-done); }
        .phase-card .card-status-dot.active { background:var(--dot-active); }
        .phase-card .card-status-dot.pending { background:var(--dot-pending); }
        .zenith-card .card-status-dot.active { background: var(--zenith-accent); }
        .sentinel-card .card-status-dot.active { background: var(--sentinel-accent); }
        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta span { display:flex; align-items:center; gap:4px; }
        .phase-card .card-meta .eta { color:var(--accent-gold); }
        .zenith-card .card-meta .eta { color: var(--zenith-accent); }
        .sentinel-card .card-meta .eta { color: var(--sentinel-accent); }

        .modal-overlay {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
            z-index:1000; justify-content:center; align-items:center; padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--bg-panel);
            border-radius:24px; padding:32px 36px;
            max-width:560px; width:100%;
            border:1px solid var(--border-color);
            box-shadow:0 24px 80px rgba(0,0,0,0.8);
            animation:modal-in 0.4s;
            max-height:80vh; overflow-y:auto;
        }
        .modal .modal-title { font-size:20px; font-weight:600; margin-bottom:8px; }
        .modal .modal-title.status-done { color: var(--dot-done) !important; }
        .modal .modal-title.status-active { color: var(--accent-gold) !important; }
        .modal .modal-title.status-pending { color: var(--text-muted) !important; }
        .modal .modal-title.zenith-active { color: var(--zenith-accent) !important; }
        .modal .modal-title.sentinel-active { color: var(--sentinel-accent) !important; }
        .modal .modal-close {
            margin-top:20px; background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:10px 24px; border-radius:40px;
            font-size:14px; cursor:pointer; width:100%;
        }
        .modal .modal-close:hover { border-color:var(--accent-gold); }
        .modal .modal-body { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text-secondary); }
        .modal .modal-body .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .modal .modal-body .row .key { color:var(--text-muted); flex-shrink:0; margin-right:12px; }
        .modal .modal-body .row .value { font-weight:500; color:var(--text-primary); text-align:right; word-break:break-word; }
        .modal .modal-body .row .value.dependencies { font-weight:400; color:var(--text-muted); font-size:13px; }

        .theme-modal .theme-options {
            display:grid; grid-template-columns: 1fr 1fr 1fr;
            gap:12px; margin-top:16px;
        }
        .theme-modal .theme-option {
            padding:12px 8px; border-radius:12px;
            border:2px solid var(--border-color);
            background:var(--bg-card); cursor:pointer;
            text-align:center; transition:all 0.2s;
            color:var(--text-secondary); font-size:14px;
        }
        .theme-modal .theme-option:hover { border-color:var(--accent-gold); }
        .theme-modal .theme-option.active { border-color:var(--accent-gold); background:var(--accent-glow); }
        .theme-modal .theme-option .color-preview {
            width:24px; height:24px; border-radius:50%;
            margin:0 auto 6px; border:1px solid rgba(255,255,255,0.1);
        }

        .analytics-section {
            margin-top:32px;
            background:var(--bg-panel);
            border-radius:24px; border:1px solid var(--border-color);
            padding:24px; box-shadow:var(--shadow);
        }
        .analytics-section .analytics-title {
            font-size:20px; font-weight:600; color:var(--text-primary);
            margin-bottom:20px;
        }
        .analytics-grid {
            display:grid; grid-template-columns: 1fr 1fr;
            gap:20px;
        }
        .analytics-card {
            background:var(--bg-card); border-radius:16px;
            padding:18px; border:1px solid var(--border-color);
            box-shadow:var(--shadow);
        }
        .analytics-card h3 {
            font-size:14px; font-weight:500; color:var(--text-muted);
            margin-bottom:12px;
        }
        .analytics-card canvas {
            width:100% !important; height:auto !important;
            max-height:200px; border-radius:8px;
        }
        .analytics-card .risk-item {
            display:flex; justify-content:space-between;
            padding:6px 0; border-bottom:1px solid var(--border-color);
            font-size:13px;
        }
        .analytics-card .risk-item .risk-name { color:var(--text-secondary); }
        .analytics-card .risk-item .risk-score { font-weight:500; }
        .analytics-card .risk-item .risk-score.high { color:var(--dot-active); }
        .analytics-card .risk-item .risk-score.medium { color:var(--accent-gold); }
        .analytics-card .risk-item .risk-score.low { color:var(--dot-done); }

        .version {
            text-align: center; font-size: 12px;
            color: var(--text-muted);
            padding: 16px 0 8px;
            border-top: 1px solid var(--border-color);
            margin-top: 12px;
        }

        @media (max-width: 820px) {
            .top-menu { padding: 10px 16px; flex-direction: column; align-items: stretch; gap:8px; }
            .top-menu .nav-links { justify-content: center; }
            .dashboard { padding: 16px 12px; }
            .header-left h1 { font-size:38px; }
            .zenith-dot, .sentinel-dot { width: 68px; height: 68px; }
            .zenith-dot .dot-pct, .sentinel-dot .dot-pct { font-size: 15px; }
            .phase-cards { flex-direction:column; }
            .phase-card { max-width:100%; min-width:0; }
            .analytics-grid { grid-template-columns:1fr; }
        }
        @media (max-width: 480px) {
            .header-left h1 { font-size:30px; }
            .zenith-dot, .sentinel-dot { width: 58px; height: 58px; }
            .zenith-dot .dot-pct, .sentinel-dot .dot-pct { font-size: 13px; }
            .zenith-dot .dot-label, .sentinel-dot .dot-label { font-size: 8px; max-width: 52px; }
        }

        @media print {
            .export-bar, .theme-btn, .update-time, .stat-badge .label, .top-menu { display:none; }
            body { background:#fff; color:#000; }
        }
    </style>
</head>

    <script>
        // VERSION: v1.3.0

        const CURRENT_DATE = new Date('2026-11-15');

        // ===== ZENITH C (горные ангары) =====
        const zenithPhases = [
            { id: 'C.0', name: 'Геологическое обследование горы', startDate: '2026-11-15', endDate: null, pct: 0,
                description: 'Инженерные изыскания в массиве между НПЗ и внешним склоном. Определение прочности породы, трещиноватости, водоносных горизонтов, зон тектонических нарушений. Без этого нельзя резать пещеры — можно получить обвал или затопление.',
                characteristics: 'Бурение 20–30 скважин глубиной до 200 м, сейсмика массива, гидрогеология. 2 месяца.',

            { id: 'C.1', name: 'Проходка пещер и заезд техники', startDate: null, endDate: null, pct: 0,

            { id: 'C.2', name: 'Укрепление стен, колонн и кровли', startDate: null, endDate: null, pct: 0,

            { id: 'C.3', name: 'Гермодвери и защитные затворы', startDate: null, endDate: null, pct: 0,

            { id: 'C.4', name: 'Лифты и вертикальный транспорт', startDate: null, endDate: null, pct: 0,

                characteristics: '4 лифта грузоподъёмностью 60 т, платформа 20 × 6 м. 2 пассажирских лифта.',

            { id: 'C.5', name: 'Вентиляция, климат, пожаротушение', startDate: null, endDate: null, pct: 0,

            { id: 'C.6', name: 'Энергоснабжение и освещение', startDate: null, endDate: null, pct: 0,

        const sentinelPhases = [
            { id: 'M.1', name: 'Разравнивание территории и грунтовая ВПП', startDate: null, endDate: null, pct: 0,

            { id: 'M.2', name: 'Периметр, ограждение, КПП', startDate: null, endDate: null, pct: 0,

                dependencies: ['M.1'] },
            { id: 'M.3', name: 'Капитальная ВПП', startDate: null, endDate: null, pct: 0,
                description: 'Бетонная или асфальтовая взлётно-посадочная полоса, рулёжные дорожки, перрон.',
                characteristics: '2 500 × 60 м, бетон 40 см, освещение, рулёжки.',
                dependencies: ['M.1', 'M.2'] },
            { id: 'M.4', name: 'Командно-диспетчерский пункт и радар', startDate: null, endDate: null, pct: 0,
                description: 'Вышка управления полётами, радиолокационные станции, связь.',
                characteristics: 'Вышка 30 м, 2 радара (обзор и посадка), 5 радиостанций.',
                dependencies: ['M.3'] },
            { id: 'M.5', name: 'Казармы и бытовые здания', startDate: null, endDate: null, pct: 0,
                description: 'Жилые модули для гарнизона, столовая, медпункт, спортзал, административный корпус.',
                characteristics: '500 мест, столовая на 200, госпиталь на 20 коек.',
                dependencies: ['M.2'] },
            { id: 'M.6', name: 'Позиции ПВО', startDate: null, endDate: null, pct: 0,
                description: 'Стационарные позиции для ЗРК, радары, укрытия для расчётов.',
                characteristics: '4 позиции ЗРК малой/средней дальности, 2 радиолокатора.',
                dependencies: ['M.2'] },
            { id: 'M.7', name: 'Внешние склады боеприпасов', startDate: null, endDate: null, pct: 0,
                description: 'Защищённые хранилища с обваловкой для боеприпасов, ракет, топлива. Отдельно от горных ангаров.',
                characteristics: '10 хранилищ по 500 м², обваловка 2 м, молниезащита.',
                dependencies: ['M.2'] },
            { id: 'M.8', name: 'Парки техники и ремонтные боксы', startDate: null, endDate: null, pct: 0,
                description: 'Открытые парковки и крытые боксы для техники, не поместившейся в горах, ремонтные мастерские.',
                characteristics: '20 000 м² парковок, 8 боксов по 1 000 м².',
                dependencies: ['M.3', 'M.5'] },
            { id: 'M.9', name: 'Ангары для техники на поверхности', startDate: null, endDate: null, pct: 0,
                description: 'Наземные ангары для техники, которую не нужно прятать в горе — текущее дежурство, быстрый выезд. Отдельно от горных пещер, ближе к ВПП и КПП.',
                characteristics: '4 ангара по 2 000 м². Ворота 20 м. Отопление, освещение, мастерские.',
                dependencies: ['M.2', 'M.3'] },
            { id: 'M.10', name: 'Топливозаправочный пункт для авиации', startDate: null, endDate: null, pct: 0,
                description: 'Склад авиационного топлива, заправщики, системы подачи к ВПП и перрону.',
                characteristics: '3 резервуара по 1 000 м³, 4 топливозаправщика, подземные линии к перрону.',
                dependencies: ['M.3'] }
        ];

        const extraData = {
            risks: [
                { name: 'Геология (обвал/затопление)', probability: 0.30, impact: 0.70 },
                { name: 'Задержка поставок', probability: 0.40, impact: 0.55 },
                { name: 'Финансирование', probability: 0.05, impact: 0.50 },
                { name: 'Кадровый дефицит', probability: 0.20, impact: 0.45 },
                { name: 'Технические сбои', probability: 0.20, impact: 0.40 }
            ]
        };

        const themes = [
            { id: 'dark', label: 'Тёмная', color: '#141c28' },
            { id: 'light', label: 'Светлая', color: '#f0f4f8' },
            { id: 'gold', label: 'Золотая', color: '#2a1f0e' },
            { id: 'blue', label: 'Синяя', color: '#0a1628' },
            { id: 'green', label: 'Зелёная', color: '#0a1a12' },
            { id: 'purple', label: 'Фиолетовая', color: '#1a0a2a' },
            { id: 'red', label: 'Красная', color: '#2a0a0a' },
            { id: 'eyecare', label: 'Защита глаз', color: '#d9d9d9' },
            { id: 'cyberpunk', label: 'Киберпанк', color: '#0a0010' },
            { id: 'graphic', label: 'Графическая', color: '#f5f5f5' },
            { id: 'matrix', label: 'Матрица', color: '#001000' },
            { id: 'space', label: 'Космос', color: '#0a0a2a' },
            { id: 'retro', label: 'Ретро', color: '#f0e8d0' }
        ];

        let currentTheme = localStorage.getItem('arion-theme') || 'dark';
        let progressChartInstance = null;

        // ===== HELPERS =====
        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function calcForecast(sub) {
            if (!sub.startDate || sub.pct <= 0 || sub.pct >= 100) return null;
            const start = new Date(sub.startDate);
            const elapsed = (CURRENT_DATE - start) / 86400000;
            if (elapsed <= 0) return null;
            const rate = sub.pct / elapsed;
            if (rate <= 0) return null;
            return new Date(CURRENT_DATE.getTime() + ((100 - sub.pct) / rate) * 86400000);
        }

        function formatForecast(sub) {
            const fc = calcForecast(sub);
            if (!fc) return '—';
            return fc.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getProgress(arr) {
            if (!arr.length) return 0;
            return Math.round(arr.reduce((a, s) => a + s.pct, 0) / arr.length);
        }

        // ===== RENDER TRACKS =====
        function renderTracks() {
            const zTrack = document.getElementById('zenithTrack');
            const sTrack = document.getElementById('sentinelTrack');
            zTrack.innerHTML = '';
            sTrack.innerHTML = '';

            const zProg = getProgress(zenithPhases);
            const sProg = getProgress(sentinelPhases);

            zTrack.appendChild(createDot('zenith', 'Zenith C', zProg, showZenithInfo));
            sTrack.appendChild(createDot('sentinel', 'Sentinel M', sProg, showSentinelInfo));
        }

        function createDot(type, label, progress, onClick) {
            const status = getStatusInfo(progress);
            const dot = document.createElement('div');
            dot.className = type + '-dot';
            if (status.status === 'active') dot.classList.add('active');
            if (status.status === 'done') dot.classList.add('done');
            if (status.status === 'pending') dot.classList.add('pending');
            dot.setAttribute('tabindex', '0');

            const pctSpan = document.createElement('span');
            pctSpan.className = 'dot-pct';
            pctSpan.textContent = progress + '%';
            dot.appendChild(pctSpan);

            const labelSpan = document.createElement('span');
            labelSpan.className = 'dot-label';
            labelSpan.textContent = label;
            dot.appendChild(labelSpan);

            dot.addEventListener('click', onClick);
            return dot;
        }

        // ===== INFO PANEL =====
        function showZenithInfo() {
            const panel = document.getElementById('infoPanel');
            panel.querySelector('.info-placeholder').style.display = 'none';
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';
            const prog = getProgress(zenithPhases);
            const st = getStatusInfo(prog);
            nameEl.textContent = 'Zenith C — горные ангары';
            nameEl.className = 'info-name zenith-' + st.status;
            const completed = zenithPhases.filter(s => s.pct >= 100).length;
            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">Прогресс:</span> ${prog}%</div>
                <div class="detail-item"><span class="label">Подэтапов:</span> ${zenithPhases.length}</div>
                <div class="detail-item"><span class="label">Завершено:</span> ${completed}</div>
            `;
        }

        function showSentinelInfo() {
            const panel = document.getElementById('infoPanel');
            panel.querySelector('.info-placeholder').style.display = 'none';
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';
            const prog = getProgress(sentinelPhases);
            const st = getStatusInfo(prog);
            nameEl.textContent = 'Sentinel M — внешняя база';
            nameEl.className = 'info-name sentinel-' + st.status;
            const completed = sentinelPhases.filter(s => s.pct >= 100).length;
            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">Прогресс:</span> ${prog}%</div>
                <div class="detail-item"><span class="label">Подэтапов:</span> ${sentinelPhases.length}</div>
                <div class="detail-item"><span class="label">Завершено:</span> ${completed}</div>
            `;
        }

        // ===== RENDER PHASE BLOCKS =====
        function renderBlocks() {
            const zCont = document.getElementById('zenithContainer');
            const sCont = document.getElementById('sentinelContainer');
            zCont.innerHTML = '';
            sCont.innerHTML = '';

            zCont.appendChild(createBlock(zenithPhases, 'zenith-block', 'zenith-card', '🏔️ Горные ангары Zenith (C)', '2026-11-15'));
            sCont.appendChild(createBlock(sentinelPhases, 'sentinel-block', 'sentinel-card', '🛡️ Внешняя база Sentinel (M)', null));
        }

        function createBlock(list, blockClass, cardClass, title, startDate) {
            const block = document.createElement('div');
            block.className = 'phase-block ' + blockClass;
            const prog = getProgress(list);
            block.innerHTML = `
                <div class="phase-header">
                    <span class="phase-title">${title}</span>
                    <div class="phase-meta">
                        <span>Начало: ${formatDate(startDate)}</span>
                    </div>
                    <span class="phase-progress">${prog}%</span>
                </div>
            `;
            const wrap = document.createElement('div');
            wrap.className = 'phase-cards';
            list.forEach((sub, idx) => {
                wrap.appendChild(createCard(sub, idx, cardClass));
            });
            block.appendChild(wrap);
            return block;
        }

        function createCard(sub, index, extraClass) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card ' + (extraClass || '');
            card.style.animationDelay = (0.02 * (index + 1)) + 's';
            card.setAttribute('tabindex', '0');

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name' + (status.status === 'active' ? ' active' : '');
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            if (sub.startDate) meta.innerHTML += `<span>Старт: ${formatDate(sub.startDate)}</span>`;
            if (sub.endDate) meta.innerHTML += `<span>Финиш: ${formatDate(sub.endDate)}</span>`;
            if (sub.pct > 0 && sub.pct < 100) {
                const fc = formatForecast(sub);
                if (fc !== '—') meta.innerHTML += `<span class="eta">Прогноз: ${fc}</span>`;
            }
            card.appendChild(meta);

            card.addEventListener('click', () => openModal(sub));
            return card;
        }

        // ===== MODAL =====
        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const status = getStatusInfo(sub.pct);
            const isZenith = sub.id.startsWith('C.');
            title.textContent = sub.name;
            title.className = 'modal-title status-' + status.status;
            if (isZenith && status.status === 'active') title.classList.add('zenith-active');
            if (!isZenith && status.status === 'active') title.classList.add('sentinel-active');

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const all = zenithPhases.concat(sentinelPhases);
            const fields = [
                { key: 'Категория', value: isZenith ? 'Zenith C — горные ангары' : 'Sentinel M — внешняя база' },
                { key: 'Статус', value: status.label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало', value: formatDate(sub.startDate) },
                { key: 'Окончание', value: formatDate(sub.endDate) },
                { key: 'Прогноз завершения', value: (sub.pct > 0 && sub.pct < 100) ? formatForecast(sub) : '—' },
                { key: 'Описание', value: sub.description },
                { key: 'Характеристики', value: sub.characteristics }
            ];
            if (sub.dependencies && sub.dependencies.length) {
                const depNames = sub.dependencies.map(id => {
                    const found = all.find(x => x.id === id);
                    return found ? found.name : id;
                }).join(', ');
                fields.push({ key: 'Зависимости', value: depNames, extraClass: 'dependencies' });
            }
            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const vc = f.extraClass ? `value ${f.extraClass}` : 'value';
                row.innerHTML = `<span class="key">${f.key}</span><span class="${vc}">${f.value}</span>`;
                body.appendChild(row);
            });

            overlay.classList.add('active');
            document.getElementById('modalClose').focus();
        }

        // ===== ANALYTICS =====
        function renderAnalytics() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            if (progressChartInstance) progressChartInstance.destroy();

            const chartText = getComputedStyle(document.documentElement).getPropertyValue('--chart-text').trim() || '#b0c4de';
            const chartGrid = getComputedStyle(document.documentElement).getPropertyValue('--chart-grid').trim() || 'rgba(255,255,255,0.06)';

            progressChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Zenith C', 'Sentinel M'],
                    datasets: [{
                        label: 'Прогресс, %',
                        data: [getProgress(zenithPhases), getProgress(sentinelPhases)],
                        backgroundColor: ['#f39c12', '#e74c3c'],
                        borderRadius: 6,
                        barPercentage: 0.6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: c => c.parsed.y + '%' } }
                    },
                    scales: {
                        y: { min: 0, max: 100, grid: { color: chartGrid }, ticks: { color: chartText, callback: v => v + '%' } },
                        x: { grid: { display: false }, ticks: { color: chartText } }
                    }
                }
            });

            const riskList = document.getElementById('riskList');
            riskList.innerHTML = extraData.risks.map(r => {
                const score = (r.probability * r.impact * 100).toFixed(0);
                let cls = 'low';
                if (score > 30) cls = 'medium';
                if (score > 60) cls = 'high';
                return `<div class="risk-item"><span class="risk-name">${r.name}</span><span class="risk-score ${cls}">${score}%</span></div>`;
            }).join('');
        }

        // ===== STATS =====
        function updateStats() {
            const all = zenithPhases.concat(sentinelPhases);
            const overall = getProgress(all);
            const completed = all.filter(s => s.pct >= 100).length;
            document.getElementById('totalProgress').textContent = overall + '%';
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = all.length;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            renderAnalytics();
        }

        // ===== THEME =====
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const c = document.getElementById('themeOptions');
            c.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `<div class="color-preview" style="background:${t.color};"></div>${t.label}`;
                div.addEventListener('click', () => { applyTheme(t.id); overlay.classList.remove('active'); });
                c.appendChild(div);
            });
            overlay.classList.add('active');
        }

        // ===== EXPORT =====
        function exportPDF() { window.print(); }

        function exportPNG() {
            const bg = getComputedStyle(document.body).backgroundColor;
            const orig = document.body.style.background;
            document.body.style.background = bg;
            html2canvas(document.getElementById('dashboard'), { scale: 2, backgroundColor: bg, useCORS: true })
                .then(canvas => {
                    document.body.style.background = orig;
                    const a = document.createElement('a');
                    a.download = 'Sentinel_dashboard.png';
                    a.href = canvas.toDataURL('image/png');
                    a.click();
                }).catch(() => { document.body.style.background = orig; });
        }

        function exportCSV() {
            const all = zenithPhases.concat(sentinelPhases);
            const headers = ['ID', 'Категория', 'Название', 'Прогресс (%)', 'Начало', 'Окончание'];
            const rows = all.map(s => [
                s.id, s.id.startsWith('C.') ? 'Zenith C' : 'Sentinel M',
                s.name, s.pct, formatDate(s.startDate), formatDate(s.endDate)
            ]);
            const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Sentinel_status.csv';
            a.click();
        }

        // ===== INIT =====
        function init() {
            function updateTime() {
                document.getElementById('headerTime').textContent = new Date().toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            }
            updateTime();
            setInterval(updateTime, 60000);

            applyTheme(currentTheme);
            renderTracks();
            renderBlocks();
            updateStats();

            document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('active'));
            document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', () => document.getElementById('themeModalOverlay').classList.remove('active'));
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    document.getElementById('modalOverlay').classList.remove('active');
                    document.getElementById('themeModalOverlay').classList.remove('active');
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
