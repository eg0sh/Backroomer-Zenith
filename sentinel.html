        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .top-menu .logo {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-menu .nav-links { display: flex; gap: 24px; flex-wrap: wrap; }
        .top-menu .nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 15px; font-weight: 500;
            padding: 6px 2px; border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }
        .top-menu .right-info {
            font-size: 13px; color: var(--text-muted);
            display: flex; align-items: center; gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: var(--dot-done);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .theme-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 6px 14px;
            border-radius: 40px; font-size: 13px; cursor: pointer;
            transition: all 0.2s;
        }
        .theme-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .dashboard { max-width: 1400px; width: 100%; padding: 20px 24px 40px; }

        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes pulse-gold {
            0%,100% { box-shadow: 0 0 30px rgba(245,176,65,0.4); }
            50% { box-shadow: 0 0 80px rgba(245,176,65,0.8); }
        }
        @keyframes pulse-red-glow {
            0%,100% { box-shadow: 0 0 30px rgba(231,76,60,0.4); }
            50% { box-shadow: 0 0 80px rgba(231,76,60,0.8); }
        }

        .header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card); backdrop-filter:blur(8px);
            padding:6px 14px; border-radius:40px; border:1px solid var(--border-color);
            font-size:14px; box-shadow:var(--shadow);
        }
        .stat-badge .num { font-weight:700; font-size:18px; color:var(--accent-gold); }
        .stat-badge .num.green { color:var(--dot-done); }
        .stat-badge .label { color:var(--text-muted); font-weight:400; }
        .update-time {
            font-size:13px; color:var(--text-muted);
            background:var(--bg-card); backdrop-filter:blur(4px);
            padding:4px 14px; border-radius:40px; border:1px solid var(--border-color);
            display:flex; align-items:center; gap:6px;
        }
        .update-time .dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--dot-done); animation:pulse-dot 2s ease-in-out infinite;
        }

        .export-bar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
        .export-btn {
            background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:6px 16px; border-radius:40px;
            font-size:13px; cursor:pointer; transition:all 0.2s;
        }
        .export-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }

        /* ===== ЕДИНАЯ ЛИНИЯ С ДВУМЯ КРУГАМИ ===== */
        .timeline-wrapper {
            background:var(--bg-panel); backdrop-filter:blur(10px);
            border-radius:24px; padding:30px 20px 20px;
            border:1px solid var(--border-color); margin-bottom:28px;
            box-shadow:var(--shadow);
        }
        .sentinel-track {
            position: relative;
            height: 120px;
            width: 100%;
        }
        .sentinel-line {
            position: absolute;
            top: 50%;
            left: 25%;
            right: 25%;
            height: 5px;
            background: var(--line-bg);
            border-radius: 4px;
            transform: translateY(-50%);
            z-index: 1;
            overflow: hidden;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
        }
        .sentinel-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #f5b041, #e67e22);
            box-shadow: 0 0 20px rgba(245,176,65,0.5);
            transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
            width: 0%;
            position: absolute;
            left: 0;
            top: 0;
        }
        .sentinel-dot {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            border: 2px solid;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        .sentinel-dot.underground {
            left: 25%;
            background: linear-gradient(135deg, #f5b041, #d48c2c);
            border-color: #f5b041;
            box-shadow: 0 4px 24px rgba(245,176,65,0.4);
        }
        .sentinel-dot.surface {
            left: 75%;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #e74c3c;
            box-shadow: 0 4px 24px rgba(231,76,60,0.4);
        }
        .sentinel-dot:hover {
            transform: translate(-50%, -50%) scale(1.1);
            z-index: 5;
        }
        .sentinel-dot.active.underground {
            animation: pulse-gold 1.8s ease-in-out infinite;
        }
        .sentinel-dot.active.surface {
            animation: pulse-red-glow 1.8s ease-in-out infinite;
        }
        .sentinel-dot .dot-pct {
            font-size: 18px;
            line-height: 1.1;
        }
        .sentinel-dot .dot-label {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.9;
            margin-top: 2px;
            text-align: center;
            max-width: 76px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ===== ИНФО-ПАНЕЛЬ ===== */
        .info-panel {
            margin-top: 18px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 14px 22px;
            min-height: 56px;
            display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
            box-shadow: var(--shadow);
        }
        .info-panel .info-placeholder { color: var(--text-muted); font-size: 14px; }
        .info-panel .info-name { font-size: 20px; font-weight: 600; }
        .info-panel .info-name.status-done { color: var(--dot-done); }
        .info-panel .info-name.status-active { color: var(--accent-gold); }
        .info-panel .info-name.status-pending { color: var(--text-muted); }
        .info-panel .info-name.underground-active { color: #f5b041; }
        .info-panel .info-name.surface-active { color: #e74c3c; }
        .info-panel .info-details { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
        .info-panel .info-details .detail-item { display: flex; align-items: baseline; gap: 6px; }
        .info-panel .info-details .detail-item .label { color: var(--text-muted); }

        /* ===== БЛОКИ ФАЗ ===== */
        .phases-section { margin-top:28px; display:flex; flex-direction:column; gap:24px; }
        .phase-block {
            background:var(--bg-panel); backdrop-filter:blur(6px);
            border-radius:20px; border:1px solid var(--border-color);
            padding:18px 22px 20px; box-shadow:var(--shadow);
        }
        .phase-block.underground-block { border-left: 4px solid #f5b041; }
        .phase-block.surface-block { border-left: 4px solid #e74c3c; }
        .phase-header {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px; flex-wrap:wrap; gap:8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress { font-size:14px; font-weight:500; background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color); }

        .surface-card .card-status-dot.active { background: #e74c3c; }
        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta .eta { color:var(--accent-gold); }
        .underground-card .card-meta .eta { color: #f5b041; }
        .surface-card .card-meta .eta { color: #e74c3c; }

        .modal .modal-title.status-pending { color: var(--text-muted) !important; }

        .modal .modal-title.surface-active { color: #e74c3c !important; }

        .analytics-section .analytics-title {
            font-size:20px; font-weight:600; color:var(--text-primary);

        }
        .analytics-grid {
            display:grid; grid-template-columns: 1fr 1fr; gap:20px;
        }
        .analytics-card {
            background:var(--bg-card); border-radius:16px;
            padding:18px; border:1px solid var(--border-color);
            box-shadow:var(--shadow);
        }
        .analytics-card h3 {
            font-size:14px; font-weight:500; color:var(--text-muted);

        }
        .analytics-card canvas {

        .analytics-card .risk-item {

        .analytics-card .risk-item .risk-name { color:var(--text-secondary); }
        .analytics-card .risk-item .risk-score { font-weight:500; }
        .analytics-card .risk-item .risk-score.high { color:var(--dot-active); }

        .analytics-card .risk-item .risk-score.low { color:var(--dot-done); }

        .version {
