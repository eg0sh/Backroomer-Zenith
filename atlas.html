<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas · Дашборд</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="data.js"></script>
    <style>
        :root {
            --bg-body: radial-gradient(ellipse at 50% 20%, #141c28, #070a0e);
            --bg-panel: rgba(17, 24, 34, 0.7);
            --bg-card: rgba(20, 28, 40, 0.8);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #e8edf5;
            --text-secondary: #b0c4de;
            --text-muted: #5a6a7e;
            --accent-gold: #f5b041;
            --accent-glow: rgba(245, 176, 65, 0.02);
            --shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
            --dot-done: #4cd9a0;
            --dot-active: #e74c3c;
            --dot-pending: #3a4a5e;
            --line-bg: #4a5a6e;
            --gradient-start: #f7e05e;
            --gradient-end: #e67e22;
            --chart-text: #b0c4de;
            --chart-grid: rgba(255,255,255,0.08);
        }
        [data-theme="light"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #f0f4f8, #d9e2ec);
            --bg-panel: rgba(255,255,255,0.85); --bg-card: rgba(255,255,255,0.9);
            --border-color: rgba(0,0,0,0.1);
            --text-primary: #1a2332; --text-secondary: #2a3a4e; --text-muted: #6a7a8e;
            --accent-gold: #d48c2c; --accent-glow: rgba(212,140,44,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #2b6a9e; --dot-active: #c0392b; --dot-pending: #8a9bb5;
            --line-bg: #b0c4de; --gradient-start: #b08a2c; --gradient-end: #8a6a1a;
            --chart-text: #2a3a4e; --chart-grid: rgba(0,0,0,0.08);
        }
        [data-theme="gold"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a1f0e, #1a1008);
            --bg-panel: rgba(40,30,20,0.85); --bg-card: rgba(40,30,20,0.9);
            --border-color: rgba(212,140,44,0.25);
            --text-primary: #f5e6c8; --text-secondary: #d4b88a; --text-muted: #8a7a5a;
            --accent-gold: #f5b041; --accent-glow: rgba(245,176,65,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.6);
            --dot-done: #4cd9a0; --dot-active: #e74c3c; --dot-pending: #6a5a3a;
            --line-bg: #5a4a2a; --gradient-start: #f7e05e; --gradient-end: #e67e22;
            --chart-text: #d4b88a; --chart-grid: rgba(255,255,255,0.06);
        }
        [data-theme="blue"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1628, #050d1a);
            --bg-panel: rgba(10,22,40,0.8); --bg-card: rgba(10,22,40,0.9);
            --border-color: rgba(74,142,196,0.2);
            --text-primary: #b0d4f0; --text-secondary: #8ab4d4; --text-muted: #4a6a8a;
            --accent-gold: #4a8ec4; --accent-glow: rgba(74,142,196,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0; --dot-active: #e74c3c; --dot-pending: #3a5a7a;
            --line-bg: #2a4a6a; --gradient-start: #8ab4d4; --gradient-end: #4a6a9e;
            --chart-text: #8ab4d4; --chart-grid: rgba(255,255,255,0.06);
        }
        [data-theme="green"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a1a12, #050d08);
            --bg-panel: rgba(10,26,18,0.8); --bg-card: rgba(10,26,18,0.9);
            --border-color: rgba(76,217,160,0.2);
            --text-primary: #b0e8d0; --text-secondary: #80c8a8; --text-muted: #4a7a62;
            --accent-gold: #4cd9a0; --accent-glow: rgba(76,217,160,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #2b6a9e; --dot-active: #e74c3c; --dot-pending: #3a5a4a;
            --line-bg: #2a5a42; --gradient-start: #80c8a8; --gradient-end: #4a7a62;
            --chart-text: #80c8a8; --chart-grid: rgba(255,255,255,0.06);
        }
        [data-theme="purple"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #1a0a2a, #0d0518);
            --bg-panel: rgba(26,10,42,0.8); --bg-card: rgba(26,10,42,0.9);
            --border-color: rgba(160,76,217,0.2);
            --text-primary: #d8b0f0; --text-secondary: #b080d4; --text-muted: #6a4a8a;
            --accent-gold: #a04cd9; --accent-glow: rgba(160,76,217,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0; --dot-active: #e74c3c; --dot-pending: #5a3a6a;
            --line-bg: #4a2a6a; --gradient-start: #b080d4; --gradient-end: #6a4a8a;
            --chart-text: #b080d4; --chart-grid: rgba(255,255,255,0.06);
        }
        [data-theme="red"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #2a0a0a, #180505);
            --bg-panel: rgba(42,10,10,0.8); --bg-card: rgba(42,10,10,0.9);
            --border-color: rgba(217,76,76,0.2);
            --text-primary: #f0b0b0; --text-secondary: #d48080; --text-muted: #8a4a4a;
            --accent-gold: #d94c4c; --accent-glow: rgba(217,76,76,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.5);
            --dot-done: #4cd9a0; --dot-active: #e74c3c; --dot-pending: #6a3a3a;
            --line-bg: #6a2a2a; --gradient-start: #d48080; --gradient-end: #8a4a4a;
            --chart-text: #d48080; --chart-grid: rgba(255,255,255,0.06);
        }
        [data-theme="eyecare"] {
            --bg-body: #d9d9d9;
            --bg-panel: rgba(220,220,220,0.85); --bg-card: rgba(230,230,230,0.9);
            --border-color: rgba(120,120,120,0.2);
            --text-primary: #404040; --text-secondary: #505050; --text-muted: #707070;
            --accent-gold: #8a8a8a; --accent-glow: rgba(128,128,128,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.05);
            --dot-done: #6a8a6a; --dot-active: #b06a6a; --dot-pending: #909090;
            --line-bg: #a0a0a0; --gradient-start: #8a8a8a; --gradient-end: #6a6a6a;
            --chart-text: #505050; --chart-grid: rgba(80,80,80,0.1);
        }
        [data-theme="cyberpunk"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0010, #000005);
            --bg-panel: rgba(20,0,30,0.8); --bg-card: rgba(20,0,30,0.9);
            --border-color: rgba(255,0,200,0.3);
            --text-primary: #ff66ff; --text-secondary: #ff99ff; --text-muted: #cc66cc;
            --accent-gold: #ff00ff; --accent-glow: rgba(255,0,255,0.1);
            --shadow: 0 8px 40px rgba(255,0,255,0.1);
            --dot-done: #00ffaa; --dot-active: #ff0066; --dot-pending: #660066;
            --line-bg: #660066; --gradient-start: #ff66ff; --gradient-end: #cc33cc;
            --chart-text: #ff99ff; --chart-grid: rgba(255,0,255,0.1);
        }
        [data-theme="graphic"] {
            --bg-body: #f5f5f5;
            --bg-panel: rgba(255,255,255,0.9); --bg-card: #ffffff;
            --border-color: #cccccc;
            --text-primary: #000000; --text-secondary: #222222; --text-muted: #555555;
            --accent-gold: #000000; --accent-glow: rgba(0,0,0,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #000000; --dot-active: #000000; --dot-pending: #999999;
            --line-bg: #cccccc; --gradient-start: #333333; --gradient-end: #000000;
            --chart-text: #000000; --chart-grid: rgba(0,0,0,0.1);
        }
        [data-theme="matrix"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #001000, #000800);
            --bg-panel: rgba(0,20,0,0.8); --bg-card: rgba(0,20,0,0.9);
            --border-color: rgba(0,255,0,0.2);
            --text-primary: #00ff00; --text-secondary: #66ff66; --text-muted: #006600;
            --accent-gold: #00ff00; --accent-glow: rgba(0,255,0,0.02);
            --shadow: 0 8px 40px rgba(0,255,0,0.05);
            --dot-done: #00ff00; --dot-active: #ff0000; --dot-pending: #006600;
            --line-bg: #003300; --gradient-start: #66ff66; --gradient-end: #00cc00;
            --chart-text: #66ff66; --chart-grid: rgba(0,255,0,0.08);
        }
        [data-theme="space"] {
            --bg-body: radial-gradient(ellipse at 50% 20%, #0a0a2a, #000010);
            --bg-panel: rgba(10,10,30,0.8); --bg-card: rgba(10,10,30,0.9);
            --border-color: rgba(100,100,255,0.2);
            --text-primary: #c0c0ff; --text-secondary: #8888ff; --text-muted: #4444aa;
            --accent-gold: #6666ff; --accent-glow: rgba(100,100,255,0.02);
            --shadow: 0 8px 40px rgba(100,100,255,0.05);
            --dot-done: #00ffaa; --dot-active: #ff6666; --dot-pending: #333366;
            --line-bg: #222266; --gradient-start: #8888ff; --gradient-end: #4444cc;
            --chart-text: #8888ff; --chart-grid: rgba(100,100,255,0.08);
        }
        [data-theme="retro"] {
            --bg-body: #f0e8d0;
            --bg-panel: rgba(240,232,208,0.85); --bg-card: rgba(250,242,220,0.9);
            --border-color: #b0a080;
            --text-primary: #4a3a2a; --text-secondary: #6a5a4a; --text-muted: #8a7a6a;
            --accent-gold: #8a7a50; --accent-glow: rgba(138,122,80,0.02);
            --shadow: 0 8px 40px rgba(0,0,0,0.1);
            --dot-done: #6a8a6a; --dot-active: #b06a5a; --dot-pending: #b0a080;
            --line-bg: #b0a080; --gradient-start: #b0a080; --gradient-end: #8a7a50;
            --chart-text: #4a3a2a; --chart-grid: rgba(0,0,0,0.08);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg-body);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }

        .top-menu {
            width: 100%;
            background: rgba(17, 24, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 30px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 16px;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.4);
        }
        .top-menu .logo {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            letter-spacing: -0.5px;
        }
        .top-menu .nav-links { display: flex; gap: 24px; flex-wrap: wrap; }
        .top-menu .nav-links a {
            color: var(--text-secondary); text-decoration: none;
            font-size: 15px; font-weight: 500; padding: 6px 2px;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
        .top-menu .right-info { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; }
        .top-menu .right-info .dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background: var(--dot-done); animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }
        .header-controls { display:flex; align-items:center; gap:12px; }
        .theme-btn {
            background: var(--bg-card); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 6px 14px; border-radius: 40px;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .theme-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .dashboard { max-width: 1400px; width: 100%; padding: 20px 24px 40px; }

        @keyframes pulse-red {
            0%,100% { box-shadow:0 0 30px rgba(231,76,60,0.4), 0 0 60px rgba(231,76,60,0.2); }
            50% { box-shadow:0 0 80px rgba(231,76,60,0.8), 0 0 150px rgba(231,76,60,0.3); }
        }
        @keyframes ring-pulse {
            0%,100% { transform:scale(1); opacity:0.6; }
            50% { transform:scale(1.6); opacity:0; }
        }
        @keyframes modal-in {
            from { opacity:0; transform:scale(0.95) translateY(20px); }
            to { opacity:1; transform:scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(15px) scale(0.97); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }

        .header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:32px; gap:16px; }
        .header-left h1 {
            font-size:52px; font-weight:800; letter-spacing:-1px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin:0;
        }
        .header-right { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .stat-badge {
            display:flex; align-items:center; gap:8px;
            background:var(--bg-card); padding:6px 14px; border-radius:40px;
            border:1px solid var(--border-color); font-size:14px; box-shadow:var(--shadow);
        }
        .stat-badge .num { font-weight:700; font-size:18px; color:var(--accent-gold); }
        .stat-badge .num.green { color:var(--dot-done); }
        .stat-badge .num.danger { color:var(--dot-active); }
        .stat-badge .label { color:var(--text-muted); font-weight:400; }
        .update-time {
            font-size:13px; color:var(--text-muted); background:var(--bg-card);
            padding:4px 14px; border-radius:40px; border:1px solid var(--border-color);
            display:flex; align-items:center; gap:6px;
        }
        .update-time .dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--dot-done); animation:pulse-dot 2s ease-in-out infinite;
        }

        .toast-container {
            position:fixed; top:20px; right:20px; z-index:9999;
            display:flex; flex-direction:column; gap:10px; max-width:360px; width:100%; pointer-events:none;
        }
        .toast {
            background:var(--bg-card); border:1px solid var(--border-color); border-left:4px solid var(--accent-gold);
            border-radius:12px; padding:12px 16px; box-shadow:0 8px 30px rgba(0,0,0,0.4);
            pointer-events:auto; animation:fadeInUp 0.3s ease forwards;
            color:var(--text-secondary); font-size:14px;
            display:flex; justify-content:space-between; align-items:center; gap:12px;
        }
        .toast.warning { border-left-color:var(--dot-active); }
        .toast.success { border-left-color:var(--dot-done); }
        .toast .toast-close { background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer; padding:0 4px; }

        .export-bar { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
        .export-btn {
            background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:6px 16px; border-radius:40px;
            font-size:13px; cursor:pointer; transition:all 0.2s;
        }
        .export-btn:hover { border-color:var(--accent-gold); color:var(--accent-gold); }

        /* ===== Timeline ===== */
        .timeline-wrapper {
            background:var(--bg-panel); border-radius:24px; padding:30px 20px 24px;
            border:1px solid var(--border-color); margin-bottom:28px; box-shadow:var(--shadow);
        }
        .timeline-track { position:relative; height:110px; width:100%; padding:0 40px; }
        .timeline-line {
            position:absolute; top:50%; left:40px; right:40px; height:5px;
            background:var(--line-bg); border-radius:4px; transform:translateY(-50%);
            z-index:1; overflow:visible;
            box-shadow: 0 0 20px rgba(255,255,255,0.05), inset 0 0 8px rgba(0,0,0,0.5);
        }
        .seg-fill {
            position:absolute; top:0; height:100%; border-radius:4px;
            background:linear-gradient(90deg, var(--accent-gold), var(--gradient-end));
            box-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(245,176,65,0.15);
            transition:width 0.8s cubic-bezier(0.4,0,0.2,1), left 0.8s cubic-bezier(0.4,0,0.2,1);
        }
        .timeline-dot {
            position:absolute; top:50%; transform:translate(-50%,-50%);
            width:72px; height:72px; border-radius:50%;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-weight:700; color:#fff; cursor:pointer; z-index:2;
            transition:all 0.3s cubic-bezier(0.4,0,0.2,1); user-select:none;
            border:2px solid rgba(255,255,255,0.15); box-shadow:0 4px 24px rgba(0,0,0,0.6);
            background:#1a2332; text-shadow:0 1px 6px rgba(0,0,0,0.6);
        }
        .timeline-dot .dot-pct { font-size:17px; line-height:1.1; }
        .timeline-dot .dot-label {
            font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px;
            opacity:0.9; margin-top:2px; text-align:center;
        }
        .timeline-dot .dot-sub {
            font-size:8px; font-weight:400; opacity:0.65; margin-top:1px; text-align:center;
            max-width:62px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .timeline-dot::after {
            content:''; position:absolute; inset:-6px; border-radius:50%;
            border:2px solid transparent; pointer-events:none; transition:all 0.4s ease;
        }
        .timeline-dot.done {
            background:linear-gradient(135deg,#2b6a9e,#1d4a7a); border-color:#4a8ec4;
            box-shadow:0 0 30px rgba(42,106,158,0.5), inset 0 0 20px rgba(74,142,196,0.2);
        }
        .timeline-dot.active {
            background:linear-gradient(135deg,#c0392b,#e74c3c); border-color:#e74c3c;
            box-shadow:0 0 50px rgba(231,76,60,0.6), inset 0 0 30px rgba(231,76,60,0.3);
            animation:pulse-red 1.8s ease-in-out infinite;
        }
        .timeline-dot.active::after { border-color:rgba(231,76,60,0.3); animation:ring-pulse 1.8s ease-in-out infinite; }
        .timeline-dot.pending {
            background:rgba(42,58,78,0.35); border:2px dashed rgba(90,106,126,0.6);
            box-shadow:0 0 20px rgba(0,0,0,0.3); color:rgba(176,196,222,0.6);
        }
        .timeline-dot.pending .dot-pct,
        .timeline-dot.pending .dot-label,
        .timeline-dot.pending .dot-sub { opacity:0.55; }
        .timeline-dot:hover { transform:translate(-50%,-50%) scale(1.1); z-index:5; }
        .timeline-dot:focus-visible { outline:2px solid var(--accent-gold); outline-offset:4px; }

        /* ===== Info panel ===== */
        .info-panel {
            margin-top:18px; background:var(--bg-card);
            border-radius:16px; border:1px solid var(--border-color);
            padding:14px 22px; min-height:56px;
            display:flex; align-items:center; gap:20px; flex-wrap:wrap;
            box-shadow:var(--shadow);
        }
        .info-panel .info-placeholder { color:var(--text-muted); font-size:14px; }
        .info-panel .info-name { font-size:20px; font-weight:600; }
        .info-panel .info-name.status-done { color:var(--dot-done); }
        .info-panel .info-name.status-active { color:var(--accent-gold); }
        .info-panel .info-name.status-pending { color:var(--text-muted); }
        .info-panel .info-details { display:flex; gap:20px; flex-wrap:wrap; font-size:13px; color:var(--text-secondary); }
        .info-panel .info-details .detail-item { display:flex; align-items:baseline; gap:6px; }
        .info-panel .info-details .detail-item .label { color:var(--text-muted); }

        /* ===== Phase blocks ===== */
        .phases-section { margin-top:28px; display:flex; flex-direction:column; gap:24px; }
        .phase-block {
            background:var(--bg-panel); border-radius:20px; border:1px solid var(--border-color);
            padding:18px 22px 20px; box-shadow:var(--shadow);
        }
        .phase-header {
            display:flex; align-items:center; justify-content:space-between;
            margin-bottom:14px; flex-wrap:wrap; gap:8px;
        }
        .phase-header .phase-title { font-size:18px; font-weight:600; color:var(--text-primary); }
        .phase-header .phase-meta { display:flex; align-items:center; gap:16px; font-size:13px; color:var(--text-muted); flex-wrap:wrap; }
        .phase-header .phase-meta span { background:var(--bg-card); padding:2px 12px; border-radius:40px; border:1px solid var(--border-color); }
        .phase-header .phase-progress {
            font-size:14px; font-weight:500; color:var(--accent-gold);
            background:var(--bg-card); padding:4px 16px; border-radius:40px; border:1px solid var(--border-color);
        }
        .phase-cards { display:flex; flex-wrap:wrap; gap:12px; }
        .phase-card {
            background:var(--bg-card); border-radius:14px; padding:12px 18px;
            border:1px solid var(--border-color);
            flex:0 1 auto; min-width:180px; max-width:320px;
            display:flex; flex-direction:column; gap:4px;
            cursor:pointer; transition:all 0.3s; box-shadow:var(--shadow);
            opacity:0; animation:fadeInUp 0.5s ease forwards;
        }
        .phase-card:hover { border-color:var(--accent-gold); transform:translateY(-3px) scale(1.02); }
        .phase-card:focus-visible { outline:2px solid var(--accent-gold); outline-offset:2px; }
        .phase-card.overdue { border-color:var(--dot-active); }
        .phase-card .card-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .phase-card .card-name { font-size:14px; font-weight:500; color:var(--text-primary); flex:1; min-width:0; }
        .phase-card .card-pct { font-size:16px; font-weight:700; color:var(--accent-gold); min-width:48px; text-align:right; flex-shrink:0; }
        .phase-card .card-pct.done { color:var(--dot-done); }
        .phase-card .card-pct.pending { color:var(--text-muted); }
        .phase-card .card-status-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .phase-card .card-status-dot.done { background:var(--dot-done); }
        .phase-card .card-status-dot.active { background:var(--dot-active); }
        .phase-card .card-status-dot.pending { background:var(--dot-pending); }
        .phase-card .card-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; margin-top:2px; }
        .phase-card .card-meta span { display:flex; align-items:center; gap:4px; }
        .phase-card .card-meta .eta { color:var(--accent-gold); }

        /* ===== Modal ===== */
        .modal-overlay {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
            z-index:1000; justify-content:center; align-items:center; padding:20px;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--bg-panel); border-radius:24px; padding:32px 36px;
            max-width:560px; width:100%; border:1px solid var(--border-color);
            box-shadow:0 24px 80px rgba(0,0,0,0.8); animation:modal-in 0.4s;
            max-height:80vh; overflow-y:auto;
        }
        .modal .modal-title { font-size:20px; font-weight:600; margin-bottom:8px; }
        .modal .modal-title.status-done { color:var(--dot-done) !important; }
        .modal .modal-title.status-active { color:var(--accent-gold) !important; }
        .modal .modal-title.status-pending { color:var(--text-muted) !important; }
        .modal .modal-close {
            margin-top:20px; background:var(--bg-card); border:1px solid var(--border-color);
            color:var(--text-secondary); padding:10px 24px; border-radius:40px;
            font-size:14px; cursor:pointer; width:100%;
        }
        .modal .modal-close:hover { border-color:var(--accent-gold); }
        .modal .modal-body { display:flex; flex-direction:column; gap:10px; font-size:14px; color:var(--text-secondary); }
        .modal .modal-body .row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .modal .modal-body .row .key { color:var(--text-muted); flex-shrink:0; margin-right:12px; }
        .modal .modal-body .row .value { font-weight:500; color:var(--text-primary); text-align:right; word-break:break-word; }
        .modal .modal-body .row .value.dependencies { font-weight:400; color:var(--text-muted); font-size:13px; }

        .theme-modal .theme-options { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:16px; }
        .theme-modal .theme-option {
            padding:12px 8px; border-radius:12px; border:2px solid var(--border-color);
            background:var(--bg-card); cursor:pointer; text-align:center; transition:all 0.2s;
            color:var(--text-secondary); font-size:14px;
        }
        .theme-modal .theme-option:hover { border-color:var(--accent-gold); }
        .theme-modal .theme-option.active { border-color:var(--accent-gold); background:var(--accent-glow); }
        .theme-modal .theme-option .color-preview {
            width:24px; height:24px; border-radius:50%; margin:0 auto 6px; border:1px solid rgba(255,255,255,0.1);
        }

        /* ===== Analytics ===== */
        .analytics-section {
            margin-top:32px; background:var(--bg-panel); border-radius:24px;
            border:1px solid var(--border-color); padding:24px; box-shadow:var(--shadow);
        }
        .analytics-section .analytics-title { font-size:20px; font-weight:600; color:var(--text-primary); margin-bottom:20px; }
        .analytics-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
        .analytics-card {
            background:var(--bg-card); border-radius:16px; padding:18px;
            border:1px solid var(--border-color); box-shadow:var(--shadow);
        }
        .analytics-card h3 { font-size:14px; font-weight:500; color:var(--text-muted); margin-bottom:12px; }
        .chart-wrapper { position:relative; width:100%; height:240px; }
        .chart-wrapper canvas { width:100% !important; height:100% !important; display:block; }
        .analytics-card .risk-item {
            display:flex; justify-content:space-between; padding:6px 0;
            border-bottom:1px solid var(--border-color); font-size:13px;
        }
        .analytics-card .risk-item .risk-name { color:var(--text-secondary); }
        .analytics-card .risk-item .risk-score { font-weight:500; }
        .analytics-card .risk-item .risk-score.high { color:var(--dot-active); }
        .analytics-card .risk-item .risk-score.medium { color:var(--accent-gold); }
        .analytics-card .risk-item .risk-score.low { color:var(--dot-done); }

        .version {
            text-align:center; font-size:12px; color:var(--text-muted);
            padding:16px 0 8px; border-top:1px solid var(--border-color); margin-top:12px;
        }

        @media (max-width: 820px) {
            .top-menu { padding:10px 16px; flex-direction:column; align-items:stretch; gap:8px; }
            .top-menu .nav-links { justify-content:center; }
            .dashboard { padding:16px 12px; }
            .header-left h1 { font-size:38px; }
            .timeline-track { height:80px; padding:0 22px; }
            .timeline-line { left:22px; right:22px; }
            .timeline-dot { width:46px; height:46px; }
            .timeline-dot .dot-pct { font-size:12px; }
            .timeline-dot .dot-label { font-size:8px; }
            .timeline-dot .dot-sub { display:none; }
            .info-panel { flex-direction:column; align-items:flex-start; gap:8px; padding:12px 16px; }
            .info-panel .info-details { flex-direction:column; gap:4px; }
            .phase-header .phase-title { font-size:16px; }
            .phase-cards { flex-direction:column; }
            .phase-card { max-width:100%; min-width:0; }
            .modal { padding:24px; }
            .analytics-grid { grid-template-columns:1fr; }
            .theme-modal .theme-options { grid-template-columns:1fr 1fr; }
            .export-bar { flex-direction:column; align-items:stretch; }
        }
        @media (max-width: 480px) {
            .header-left h1 { font-size:30px; }
            .stat-badge { padding:4px 12px; font-size:12px; }
            .stat-badge .num { font-size:15px; }
            .timeline-track { height:70px; padding:0 16px; }
            .timeline-line { left:16px; right:16px; }
            .timeline-dot { width:36px; height:36px; }
            .timeline-dot .dot-pct { font-size:10px; }
            .timeline-dot .dot-label { display:none; }
            .phase-block { padding:12px 14px; }
            .theme-modal .theme-options { grid-template-columns:1fr; }
            .modal { padding:20px; }
        }
        @media print {
            .export-bar, .theme-btn, .update-time, .stat-badge .label, .top-menu { display:none; }
            body { background:#fff; color:#000; }
            .phase-card, .analytics-card { border:1px solid #ccc; background:#f9f9f9; }
        }
    </style>
</head>
<body>

    <header class="top-menu">
        <div class="logo">Zenith</div>
        <nav class="nav-links">

            <a href="arion.html">Arion</a>
            <a href="sentinel.html">Sentinel</a>
            <a href="atlas.html" class="active">Atlas</a>
            <a href="analysis.html">Аналитика</a>
        </nav>
        <div class="right-info">
            <span class="dot"></span>
            <span id="headerTime">—</span>
            <div class="header-controls">
                <button class="theme-btn" id="themeToggle">🎨 Тема</button>
            </div>

    <div class="dashboard" id="dashboard">

        <header class="header">

            <div class="header-right">
                <div class="stat-badge">
                    <span class="label">Общий прогресс</span>

                </div>
                <div class="stat-badge">
                    <span class="label">Завершено</span>

                </div>
                <div class="stat-badge" id="overdueBadge" style="display:none;">

                <div class="update-time">

                        <span class="dot"></span>

        <div class="export-bar">
            <button class="export-btn" id="exportPDF">📄 PDF</button>
            <button class="export-btn" id="exportPNG">🖼️ PNG</button>
            <button class="export-btn" id="exportCSV">📊 CSV</button>
        </div>

        <!-- ===== TIMELINE ===== -->
        <div class="timeline-wrapper">
            <div class="timeline-track" id="timelineTrack">
                <div class="timeline-line" id="timelineLine"></div>
                <!-- кружки вставляются JS -->
            </div>
            <div class="info-panel" id="infoPanel">
                <span class="info-placeholder">Нажмите на кружок фазы, чтобы увидеть информацию</span>
                <span class="info-name" id="infoName" style="display:none;"></span>
                <div class="info-details" id="infoDetails" style="display:none;"></div>
            </div>
        </div>

        <!-- ===== PHASES ===== -->
        <div class="phases-section" id="phasesContainer"></div>

        <!-- ===== ANALYTICS ===== -->
        <div class="analytics-section">
            <div class="analytics-title">📊 Аналитика Atlas</div>
            <div class="analytics-grid">
                <div class="analytics-card">
                    <h3>Прогресс по фазам</h3>
                    <div class="chart-wrapper"><canvas id="progressChart"></canvas></div>
                </div>
                <div class="analytics-card">
                    <h3>Оценка рисков</h3>
                    <div id="riskList"></div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-title" id="modalTitle">Название</div>
                <div class="modal-body" id="modalBody"></div>
                <button class="modal-close" id="modalClose">Закрыть</button>
            </div>
        </div>

        <div class="modal-overlay" id="themeModalOverlay">
            <div class="modal theme-modal">
                <div class="modal-title">Выберите тему</div>
                <div class="theme-options" id="themeOptions"></div>
                <button class="modal-close" id="themeModalClose">Закрыть</button>
            </div>
        </div>

        <div class="toast-container" id="toastContainer"></div>

        <div class="version">v1.0.0</div>
    </div>

    <script>
        // VERSION: v1.0.0

        const { phases, subPhases } = DATA.atlas;
        const extraData = { risks: DATA.atlas.risks || [] };
        const CURRENT_DATE = new Date(DATA.meta.currentDate);
        const themes = DATA.themes;

        let currentTheme = localStorage.getItem('arion-theme') || 'dark';
        let progressChartInstance = null;

        // Справочник всех подфаз проекта — для зависимостей на Arion / Sentinel / Флот
        const ALL_KNOWN = []
            .concat(DATA.arion.subPhases || [])
            .concat(DATA.arion.fleetPhases || [])
            .concat(DATA.sentinel.undergroundPhases || [])
            .concat(DATA.sentinel.surfacePhases || [])
            .concat(subPhases);

        // ===== HELPERS =====
        function getPhaseById(id) { return phases.find(p => p.id === id); }
        function getSubsByPhase(phaseId) { return subPhases.filter(s => s.phaseId === phaseId); }

        function avgPct(arr) {
            if (!arr.length) return 0;
            return Math.round(arr.reduce((a, s) => a + s.pct, 0) / arr.length);
        }
        function getPhaseProgress(phaseId) { return avgPct(getSubsByPhase(phaseId)); }
        function getOverallProgress() { return avgPct(subPhases); }
        function getCompletedCount() { return subPhases.filter(s => s.pct >= 100).length; }

        function getStatusInfo(pct) {
            if (pct >= 100) return { status: 'done', label: 'Завершён' };
            if (pct > 0) return { status: 'active', label: 'В процессе' };
            return { status: 'pending', label: 'Не начат' };
        }

        function formatDate(dateStr) {
            if (!dateStr) return '—';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function getSubName(id) {
            const found = ALL_KNOWN.find(s => s.id === id);
            return found ? found.name : id;
        }

        function getPhaseLabel(phaseId) {
            const p = getPhaseById(phaseId);
            return p ? `${p.id}. ${p.label}` : '—';
        }

        function calcForecast(sub) {
            if (!sub.startDate || sub.pct <= 0 || sub.pct >= 100) return null;
            const start = new Date(sub.startDate);
            const elapsed = (CURRENT_DATE - start) / 86400000;
            if (elapsed <= 0) return null;
            const rate = sub.pct / elapsed;
            if (rate <= 0) return null;
            return new Date(CURRENT_DATE.getTime() + ((100 - sub.pct) / rate) * 86400000);
        }

        function formatForecast(sub) {
            const fc = calcForecast(sub);
            if (!fc) return '—';
            return fc.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function isOverdue(sub) {
            if (sub.pct >= 100) return false;
            const fc = calcForecast(sub);
            if (!fc) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const f = new Date(fc);
            f.setHours(0, 0, 0, 0);
            return f < today;
        }

        function formatBudget(phase) {
            return phase.budget ? '$' + phase.budget + ' млн' : '—';
        }

        // ===== TIMELINE =====
        function renderTimeline() {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.timeline-dot').forEach(el => el.remove());

            const line = document.getElementById('timelineLine');
            line.querySelectorAll('.seg-fill').forEach(el => el.remove());

            const n = phases.length;
            const leftMargin = 5, rightMargin = 5;
            const range = 100 - leftMargin - rightMargin;
            const pos = phases.map((_, i) => n === 1 ? 50 : leftMargin + (i / (n - 1)) * range);

            phases.forEach((phase, index) => {
                const progress = getPhaseProgress(phase.id);
                const status = getStatusInfo(progress);

                const dot = document.createElement('div');
                dot.className = `timeline-dot ${status.status}`;
                dot.style.left = pos[index] + '%';
                dot.dataset.phaseId = phase.id;
                dot.setAttribute('tabindex', '0');
                dot.setAttribute('role', 'button');
                dot.setAttribute('aria-label', `${phase.label}, прогресс ${progress}%`);

                const pctSpan = document.createElement('span');
                pctSpan.className = 'dot-pct';
                pctSpan.textContent = progress + '%';
                dot.appendChild(pctSpan);

                const labelSpan = document.createElement('span');
                labelSpan.className = 'dot-label';
                labelSpan.textContent = phase.id;
                dot.appendChild(labelSpan);

                const subSpan = document.createElement('span');
                subSpan.className = 'dot-sub';
                subSpan.textContent = phase.label.split(' ')[0];
                dot.appendChild(subSpan);

                dot.addEventListener('click', e => { e.stopPropagation(); showPhaseInfo(phase.id); });
                dot.addEventListener('keydown', e => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPhaseInfo(phase.id); }
                });

                track.appendChild(dot);
            });

            for (let i = 0; i < n - 1; i++) {
                const progress = getPhaseProgress(phases[i].id);
                const segW = pos[i + 1] - pos[i];
                const fillW = (progress / 100) * segW;
                if (fillW > 0) {
                    const fill = document.createElement('div');
                    fill.className = 'seg-fill';
                    fill.style.left = (pos[i] - leftMargin) / range * 100 + '%';
                    fill.style.width = (fillW / range * 100) + '%';
                    line.appendChild(fill);
                }
            }
        }

        // ===== INFO PANEL =====
        function showPhaseInfo(phaseId) {
            const phase = getPhaseById(phaseId);
            if (!phase) return;

            const panel = document.getElementById('infoPanel');
            panel.querySelector('.info-placeholder').style.display = 'none';
            const nameEl = document.getElementById('infoName');
            const detailsEl = document.getElementById('infoDetails');
            nameEl.style.display = 'block';
            detailsEl.style.display = 'flex';

            const progress = getPhaseProgress(phaseId);
            const status = getStatusInfo(progress);
            nameEl.textContent = `${phase.id}. ${phase.label}`;
            nameEl.className = 'info-name status-' + status.status;

            const subs = getSubsByPhase(phaseId);
            const completed = subs.filter(s => s.pct >= 100).length;

            detailsEl.innerHTML = `
                <div class="detail-item"><span class="label">Прогресс:</span> ${progress}%</div>
                <div class="detail-item"><span class="label">Подэтапов:</span> ${subs.length}</div>
                <div class="detail-item"><span class="label">Завершено:</span> ${completed}</div>
                <div class="detail-item"><span class="label">Начало:</span> ${formatDate(phase.startDate)}</div>
                <div class="detail-item"><span class="label">Окончание:</span> ${formatDate(phase.endDate)}</div>
                <div class="detail-item"><span class="label">Бюджет:</span> ${formatBudget(phase)}</div>
            `;
        }

        // ===== PHASE BLOCKS =====
        function renderPhases() {
            const container = document.getElementById('phasesContainer');
            container.innerHTML = '';

            phases.forEach(phase => {
                const subs = getSubsByPhase(phase.id);
                if (!subs.length) return;
                const progress = getPhaseProgress(phase.id);

                const block = document.createElement('div');
                block.className = 'phase-block';

                const header = document.createElement('div');
                header.className = 'phase-header';
                header.innerHTML = `
                    <span class="phase-title">${phase.id}. ${phase.label}</span>
                    <div class="phase-meta">
                        <span>Начало: ${formatDate(phase.startDate)}</span>
                        <span>Окончание: ${formatDate(phase.endDate)}</span>
                        <span>Бюджет: ${formatBudget(phase)}</span>
                    </div>
                    <span class="phase-progress">${progress}%</span>
                `;
                block.appendChild(header);

                const cardsWrap = document.createElement('div');
                cardsWrap.className = 'phase-cards';
                const sorted = [...subs].sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
                sorted.forEach((sub, idx) => cardsWrap.appendChild(createCard(sub, idx)));
                block.appendChild(cardsWrap);

                container.appendChild(block);
            });
        }

        function createCard(sub, index) {
            const status = getStatusInfo(sub.pct);
            const card = document.createElement('div');
            card.className = 'phase-card';
            card.dataset.id = sub.id;
            card.style.animationDelay = (0.02 * (index + 1)) + 's';
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            if (isOverdue(sub)) card.classList.add('overdue');

            const top = document.createElement('div');
            top.className = 'card-top';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'card-name';
            nameSpan.textContent = sub.name;
            top.appendChild(nameSpan);

            const pctSpan = document.createElement('span');
            pctSpan.className = `card-pct ${status.status}`;
            pctSpan.textContent = sub.pct + '%';
            top.appendChild(pctSpan);

            const dot = document.createElement('span');
            dot.className = `card-status-dot ${status.status}`;
            top.appendChild(dot);

            card.appendChild(top);

            const meta = document.createElement('div');
            meta.className = 'card-meta';
            const idSpan = document.createElement('span');
            idSpan.textContent = sub.id;
            meta.appendChild(idSpan);
            if (sub.startDate) meta.innerHTML += `<span>Старт: ${formatDate(sub.startDate)}</span>`;
            if (sub.endDate) meta.innerHTML += `<span>Финиш: ${formatDate(sub.endDate)}</span>`;
            if (sub.pct > 0 && sub.pct < 100) {
                const fc = formatForecast(sub);
                if (fc !== '—') meta.innerHTML += `<span class="eta">Прогноз: ${fc}</span>`;
            }
            card.appendChild(meta);

            card.addEventListener('click', () => openModal(sub));
            card.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(sub); }
            });
            return card;
        }

        // ===== MODAL =====
        function openModal(sub) {
            const overlay = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const status = getStatusInfo(sub.pct);
            title.textContent = sub.name;
            title.className = 'modal-title status-' + status.status;

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const fields = [
                { key: 'Фаза', value: getPhaseLabel(sub.phaseId) },
                { key: 'Статус', value: status.label },
                { key: 'Прогресс', value: sub.pct + '%' },
                { key: 'Начало', value: formatDate(sub.startDate) },
                { key: 'Окончание', value: formatDate(sub.endDate) },
                { key: 'Прогноз завершения', value: (sub.pct > 0 && sub.pct < 100) ? formatForecast(sub) : '—' },
                { key: 'Превышение прогноза', value: isOverdue(sub) ? 'Да' : 'Нет' },
                { key: 'Описание', value: sub.description || '—' },
                { key: 'Характеристики', value: sub.characteristics || '—' }
            ];
            if (sub.dependencies && sub.dependencies.length) {
                fields.push({
                    key: 'Зависимости',
                    value: sub.dependencies.map(getSubName).join(', '),
                    extraClass: 'dependencies'
                });
            }
            fields.forEach(f => {
                const row = document.createElement('div');
                row.className = 'row';
                const k = document.createElement('span');
                k.className = 'key';
                k.textContent = f.key;
                const v = document.createElement('span');
                v.className = f.extraClass ? `value ${f.extraClass}` : 'value';
                v.textContent = f.value;
                row.appendChild(k);
                row.appendChild(v);
                body.appendChild(row);
            });

            overlay.classList.add('active');
            document.getElementById('modalClose').focus();
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span><button class="toast-close">&times;</button>`;
            container.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => { if (toast.parentNode) toast.remove(); }, 5000);
        }

        // ===== ANALYTICS =====
        function renderAnalytics() {
            const canvas = document.getElementById('progressChart');
            if (progressChartInstance) { progressChartInstance.destroy(); progressChartInstance = null; }

            const css = getComputedStyle(document.documentElement);
            const chartText = css.getPropertyValue('--chart-text').trim() || '#b0c4de';
            const chartGrid = css.getPropertyValue('--chart-grid').trim() || 'rgba(255,255,255,0.06)';
            const accentGold = css.getPropertyValue('--accent-gold').trim() || '#f5b041';

            progressChartInstance = new Chart(canvas.getContext('2d'), {
                type: 'bar',
                data: {
                    labels: phases.map(p => p.id),
                    datasets: [{
                        label: 'Прогресс, %',
                        data: phases.map(p => getPhaseProgress(p.id)),
                        backgroundColor: accentGold,
                        borderRadius: 6,
                        barPercentage: 0.65
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                title: items => {
                                    const p = phases[items[0].dataIndex];
                                    return p ? p.label : '';
                                },
                                label: c => c.parsed.y + '%'
                            }
                        }
                    },
                    scales: {
                        y: { min: 0, max: 100, grid: { color: chartGrid }, ticks: { color: chartText, callback: v => v + '%' } },
                        x: { grid: { display: false }, ticks: { color: chartText } }
                    }
                }
            });

            document.getElementById('riskList').innerHTML = extraData.risks.map(r => {
                const score = Math.round(r.probability * r.impact * 100);
                let cls = 'low';
                if (score > 30) cls = 'medium';
                if (score > 60) cls = 'high';
                return `<div class="risk-item"><span class="risk-name">${r.name}</span><span class="risk-score ${cls}">${score}%</span></div>`;
            }).join('');
        }

        // ===== STATS =====
        function updateStats() {
            document.getElementById('totalProgress').textContent = getOverallProgress() + '%';
            document.getElementById('completedCount').textContent = getCompletedCount();
            document.getElementById('totalCount').textContent = subPhases.length;
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            const overdue = subPhases.filter(isOverdue).length;
            const badge = document.getElementById('overdueBadge');
            if (overdue > 0) {
                badge.style.display = 'flex';
                document.getElementById('overdueCount').textContent = overdue;
            } else {
                badge.style.display = 'none';
            }
            renderAnalytics();
        }

        // ===== THEME =====
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('arion-theme', theme);
            currentTheme = theme;
            renderAnalytics();
        }

        function openThemeModal() {
            const overlay = document.getElementById('themeModalOverlay');
            const c = document.getElementById('themeOptions');
            c.innerHTML = '';
            themes.forEach(t => {
                const div = document.createElement('div');
                div.className = 'theme-option' + (t.id === currentTheme ? ' active' : '');
                div.innerHTML = `<div class="color-preview" style="background:${t.color};"></div>${t.label}`;
                div.addEventListener('click', () => { applyTheme(t.id); overlay.classList.remove('active'); });
                c.appendChild(div);
            });
            overlay.classList.add('active');
        }

        // ===== EXPORT =====
        function exportPDF() { window.print(); }

        function exportPNG() {
            const body = document.body;
            const origBg = body.style.background;
            const bg = getComputedStyle(body).backgroundColor;
            body.style.background = bg;
            html2canvas(document.getElementById('dashboard'), { scale: 2, backgroundColor: bg, useCORS: true, allowTaint: true })
                .then(canvas => {
                    body.style.background = origBg;
                    const a = document.createElement('a');
                    a.download = 'Atlas_dashboard.png';
                    a.href = canvas.toDataURL('image/png');
                    a.click();
                })
                .catch(err => {
                    body.style.background = origBg;
                    showToast('Ошибка экспорта PNG: ' + err.message, 'warning');
                });
        }

        function csvCell(v) {
            const s = String(v == null ? '' : v);
            return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }

        function exportCSV() {
            const headers = ['ID', 'Фаза', 'Название', 'Прогресс (%)', 'Начало', 'Окончание', 'Статус', 'Превышение прогноза'];
            const rows = subPhases.map(s => [
                s.id, getPhaseLabel(s.phaseId), s.name, s.pct,
                formatDate(s.startDate), formatDate(s.endDate),
                getStatusInfo(s.pct).label, isOverdue(s) ? 'Да' : 'Нет'
            ]);
            const csv = [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Atlas_status.csv';
            a.click();
            showToast('CSV экспортирован успешно', 'success');
        }

        // ===== INIT =====
        function init() {
            function updateTime() {
                document.getElementById('headerTime').textContent = new Date().toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            }
            updateTime();
            setInterval(updateTime, 60000);

            applyTheme(currentTheme);
            renderTimeline();
            renderPhases();
            updateStats();

            document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modalOverlay').classList.remove('active'));
            document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
            document.getElementById('themeToggle').addEventListener('click', openThemeModal);
            document.getElementById('themeModalClose').addEventListener('click', () => document.getElementById('themeModalOverlay').classList.remove('active'));
            document.getElementById('themeModalOverlay').addEventListener('click', function(e) { if (e.target === this) this.classList.remove('active'); });
            document.getElementById('exportPDF').addEventListener('click', exportPDF);
            document.getElementById('exportPNG').addEventListener('click', exportPNG);
            document.getElementById('exportCSV').addEventListener('click', exportCSV);

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    document.getElementById('modalOverlay').classList.remove('active');
                    document.getElementById('themeModalOverlay').classList.remove('active');
                }
            });

            setInterval(updateStats, 60000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
