<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP — Терминал доступа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; background: #050805; overflow: hidden; }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.55;
            color: #00ff41;
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.18) 0px,
                rgba(0, 0, 0, 0.18) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 100;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.8) 100%);
            pointer-events: none;
            z-index: 99;
        }

        .terminal {
            width: 100%;
            max-width: 1040px;
            height: 92vh;
            max-height: 880px;
            background: #0a0e0a;
            border: 1px solid rgba(0, 255, 65, 0.25);
            border-radius: 6px;
            box-shadow:
                0 0 40px rgba(0, 255, 65, 0.15),
                inset 0 0 100px rgba(0, 255, 65, 0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background: #0f140f;
            border-bottom: 1px solid rgba(0, 255, 65, 0.13);
            font-size: 12px;
            flex-shrink: 0;
        }

        .terminal-header .dots { display: flex; gap: 6px; margin-right: 14px; }
        .terminal-header .dot {
            width: 12px; height: 12px; border-radius: 50%; display: inline-block;
        }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green { background: #28c840; }

        .terminal-header .title {
            flex: 1;
            text-align: center;
            color: #00aa2a;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-shadow: none;
        }

        .terminal-header .clock {
            color: #00aa2a;
            font-size: 11px;
            text-shadow: none;
        }

        .terminal-body {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }

        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.2);
            border-radius: 4px;
        }
        .terminal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.4);
        }

        .line {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 2px;
            min-height: 1em;
        }

        .line.dim      { color: #00aa2a; }
        .line.error    { color: #ff3333; text-shadow: 0 0 4px rgba(255, 51, 51, 0.5); }
        .line.warn     { color: #ffaa00; text-shadow: 0 0 4px rgba(255, 170, 0, 0.4); }
        .line.hl       { color: #ffff00; text-shadow: 0 0 5px rgba(255, 255, 0, 0.55); }
        .line.success  { color: #00ff41; }
        .line.user     { color: #b8ffb8; }
        .line.h1 {
            color: #00ff41;
            font-size: 16px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.3);
            padding-bottom: 6px;
        }
        .line.h2 {
            color: #ffff00;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 14px;
            margin-bottom: 6px;
            text-shadow: 0 0 5px rgba(255, 255, 0, 0.5);
        }
        .line.meta   { color: #00aa2a; }
        .line.meta b { color: #b8ffb8; font-weight: normal; }
        .line.list-item { padding-left: 6px; }
        .line.redacted {
            color: #00aa2a;
            font-style: italic;
        }
        .line.box {
            border: 1px dashed rgba(0, 255, 65, 0.35);
            padding: 10px 14px;
            margin: 8px 0;
            background: rgba(0, 0, 0, 0.35);
            color: #00aa2a;
            letter-spacing: 0.08em;
        }
        .line.box-red {
            border: 1px solid rgba(255, 51, 51, 0.5);
            background: rgba(255, 51, 51, 0.05);
            padding: 12px 16px;
            margin: 10px 0;
            color: #ff6666;
            letter-spacing: 0.08em;
        }

        .terminal-input-line {
            display: none;
            align-items: center;
            padding: 8px 22px;
            border-top: 1px solid rgba(0, 255, 65, 0.13);
            background: #0a0e0a;
            flex-shrink: 0;
        }

        .terminal-input-line.visible { display: flex; }

        .prompt {
            color: #00ff41;
            margin-right: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff41;
            font-family: inherit;
            font-size: 14px;
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.45);
            caret-color: #00ff41;
        }

        .back-link {
            flex-shrink: 0;
            text-align: center;
            padding: 7px;
            font-size: 11px;
            color: #00aa2a;
            border-top: 1px solid rgba(0, 255, 65, 0.13);
            text-shadow: none;
            letter-spacing: 0.1em;
        }

        .back-link a {
            color: #00aa2a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #00ff41;
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
        }
    </style>
</head>

        // ============================================================

        const output    = document.getElementById('output');
        const inputLine = document.getElementById('inputLine');
        const cmdInput  = document.getElementById('cmdInput');
        const promptEl  = document.getElementById('prompt');

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const scrollDown = () => { output.scrollTop = output.scrollHeight; };

        const history = [];
        let historyIndex = -1;

        let authorized = false;
        let busy = false;

        // ============================================================
        //  ВЫВОД
        // ============================================================

        async function printLine(text, cls = '', charDelay = null) {
            const line = document.createElement('div');
            line.className = 'line' + (cls ? ' ' + cls : '');
            output.appendChild(line);

            if (text === '' || text === ' ') {
                line.innerHTML = '&nbsp;';
                scrollDown();
                return line;
            }

            // Автоматический выбор скорости
            if (charDelay === null) {
                if (text.length > 150) charDelay = 0;       // мгновенно
                else if (text.length > 60) charDelay = 2;   // быстро
                else charDelay = 8;                          // обычная печать
            }

            // Мгновенный вывод (крупные абзацы / длинные строки)
            if (charDelay === 0) {
                line.innerHTML = text;
                scrollDown();
                await sleep(20);
                return line;
            }

            // Быстрый вывод (средние строки) — чанками
            if (charDelay <= 2) {
                const chunkSize = 4;
                for (let i = 0; i < text.length; i += chunkSize) {
                    line.innerHTML = text.slice(0, i + chunkSize);
                    scrollDown();
                    await sleep(charDelay);
                }
                line.innerHTML = text;
                scrollDown();
                return line;
            }

            // Обычная печать по символам
            for (let i = 0; i < text.length; i++) {
                line.innerHTML = text.slice(0, i + 1);
                if (i % 2 === 0) {
                    await sleep(charDelay);
                    scrollDown();
                }
            }
            line.innerHTML = text;
            scrollDown();
            return line;
        }

        async function printMany(lines, baseDelay = 0) {
            for (const item of lines) {
                await printLine(item.t || '', item.c || '', baseDelay || null);
            }
        }

        // ============================================================
        //  ОБРАБОТКА ВВОДА
        // ============================================================

        cmdInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                if (busy) return;
                const value = cmdInput.value;
                cmdInput.value = '';
                if (value.trim()) {
                    history.push(value);
                    historyIndex = history.length;
                }
                hideInput();
                busy = true;
                if (!authorized) {
                    await handlePassphrase(value);
                } else {
                    await handleCommand(value);
                }
                busy = false;
                if (!inputLine.classList.contains('visible')) {
                    // Если всё ещё авторизованы и работа не завершена — показать снова
                    if (authorized) showInput();
                }
            } else if (e.key === 'ArrowUp') {
                if (history.length === 0) return;
                e.preventDefault();
                historyIndex = Math.max(0, historyIndex - 1);
                cmdInput.value = history[historyIndex] || '';
            } else if (e.key === 'ArrowDown') {
                if (history.length === 0) return;
                e.preventDefault();
                historyIndex = Math.min(history.length, historyIndex + 1);
                cmdInput.value = history[historyIndex] || '';
            } else if (e.key === 'l' && e.ctrlKey) {
                e.preventDefault();
                output.innerHTML = '';
            }
        });

        // ============================================================
        //  КОМАНДЫ
        // ============================================================

        async function handleCommand(raw) {
            const input = raw.trim();
            if (!input) { showInput(); return; }

            const parts = input.split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            await printLine(promptEl.textContent + ' ' + input, 'user', 4);

            switch (cmd) {
                case 'help':
                case 'помощь':
                case '?':
                    await cmdHelp();
                    break;

                case 'list':
                case 'ls':
                case 'dir':
                case 'список':
                    await cmdList();
                    break;

                case 'open':
                case 'cat':
                case 'открыть':
                case 'прочитать':
                    await cmdOpen(args);
                    break;

                case 'ping':
                case 'пинг':
                    await cmdPing(args);
                    break;

                case 'clear':
                case 'cls':
                case 'очистить':
                    output.innerHTML = '';
                    await printLine('Экран очищен.', 'dim', 4);
                    break;

                case 'whoami':
                case 'ктоя':
                    await cmdWhoami();
                    break;

                case 'status':
                case 'статус':
                    await cmdStatus();
                    break;

                case 'date':
                case 'time':
                case 'время':
                case 'дата':
                    await cmdDate();
                    break;

                case 'version':
                case 'версия':
                    await cmdVersion();
                    break;

                case 'scan':
                case 'скан':
                    await cmdScan();
                    break;

                case 'about':
                case 'о':
                    await cmdAbout();
                    break;

                case 'exit':
                case 'logout':
                case 'выход':
                    await cmdExit();
                    break;

                default:
                    await printLine(`Команда не распознана: "${cmd}". Введите HELP для списка команд.`, 'error', 4);
            }

            if (authorized) showInput();
        }

                return;

            if (n === '0') {
                await cmdExit();
                return;

            const f = FILES[n];
            if (!f) {
                await printLine(`Файл "${n}" не найден. Введите LIST для списка.`, 'error', 4);
                return;
            }

            await printLine('');
            await printLine(`ЗАГРУЗКА ФАЙЛА: ${f.name}...`, 'dim', 4);
            await sleep(300);
            await printMany(f.content);
            await printLine('');

        // -------- PING --------

        async function cmdPing(args) {
            const host = (args[0] || 'hq.scp.internal').toLowerCase();
            const KNOWN = {
                'hq.scp.internal':       '10.0.0.1',
                'database.scp.internal': '10.0.0.7',
                'terminal.scp.internal': '10.0.0.12',
                'x-site.scp.internal':   '10.4.4.1',
                'void':                  '0.0.0.0'
            };
            const ip = KNOWN[host] || '10.0.' + (Math.floor(Math.random()*250)+1) + '.' + (Math.floor(Math.random()*250)+1);

            await printLine(`PING ${host} (${ip}): 56 data bytes`, 'dim', 4);

            if (host === 'void') {
                await sleep(400);
                await printLine('Request timeout for icmp_seq=0', 'error', 4);
                await sleep(400);
                await printLine('Request timeout for icmp_seq=1', 'error', 4);
                await sleep(400);
                await printLine('Request timeout for icmp_seq=2', 'error', 4);
                await sleep(400);
                await printLine('--- ' + host + ' ping statistics ---', 'dim', 4);
                await printLine('3 packets transmitted, 0 received, 100% packet loss', 'error', 4);
                return;
            }

            for (let i = 0; i < 4; i++) {
                const time = (Math.random() * 0.08 + 0.02).toFixed(3);
                await sleep(280);
                await printLine(`64 bytes from ${ip}: icmp_seq=${i} ttl=64 time=${time} ms`, 'success', 4);
            }
            await sleep(200);
            await printLine('--- ' + host + ' ping statistics ---', 'dim', 4);
            await printLine('4 packets transmitted, 4 received, 0% packet loss', 'success', 4);
        }

        function updateClock() {

            const ss = String(d.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hh}:${mm}:${ss}`;
