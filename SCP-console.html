    <title>SCP — Терминал доступа O5</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; background: #050805; overflow: hidden; }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.55;
            color: #00ff41;
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.18) 0px,
                rgba(0, 0, 0, 0.18) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 100;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.78) 100%);
            pointer-events: none;
            z-index: 99;
        }

        .terminal {
            width: 100%;
            max-width: 1100px;
            height: 92vh;
            max-height: 900px;
            background: #0a0e0a;
            border: 1px solid rgba(0, 255, 65, 0.25);
            border-radius: 6px;
            box-shadow:
                0 0 40px rgba(0, 255, 65, 0.15),
                inset 0 0 100px rgba(0, 255, 65, 0.03);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .terminal-header {
            display: flex;
            align-items: center;
            padding: 8px 14px;
            background: #0f140f;
            border-bottom: 1px solid rgba(0, 255, 65, 0.13);
            font-size: 12px;
            flex-shrink: 0;
        }

        .terminal-header .dots { display: flex; gap: 6px; margin-right: 14px; }
        .terminal-header .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green { background: #28c840; }

        .terminal-header .title {
            flex: 1;
            text-align: center;
            color: #00aa2a;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-shadow: none;
        }

        .terminal-header .time {
            color: #00aa2a;
            font-size: 11px;
            text-shadow: none;
        }

        .terminal-body {
            flex: 1;
            padding: 18px 22px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .terminal-body::-webkit-scrollbar { width: 8px; }
        .terminal-body::-webkit-scrollbar-track { background: transparent; }
        .terminal-body::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 65, 0.2);
            border-radius: 4px;
        }
        .terminal-body::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 255, 65, 0.4);
        }

        .line { white-space: pre-wrap; word-wrap: break-word; margin-bottom: 2px; }

        .line.error     { color: #ff3333; text-shadow: 0 0 4px rgba(255, 51, 51, 0.5); }
        .line.success   { color: #00ff41; }
        .line.highlight { color: #ffff00; text-shadow: 0 0 4px rgba(255, 255, 0, 0.5); }
        .line.yellow    { color: #ffff00; }
        .line.dim       { color: #00aa2a; }
        .line.muted     { color: #007722; }
        .line.header    { color: #00ff41; font-weight: bold; letter-spacing: 0.08em; }
        .line.user-input{ color: #b8ffb8; }
        .line.info      { color: #00ccff; text-shadow: 0 0 4px rgba(0, 204, 255, 0.4); }

        .terminal-input-line {
            display: none;
            align-items: center;
            padding: 8px 22px;
            border-top: 1px solid rgba(0, 255, 65, 0.13);
            background: #0a0e0a;
            flex-shrink: 0;
        }

        .terminal-input-line.visible { display: flex; }

        .prompt {
            color: #00ff41;
            margin-right: 10px;
            font-weight: bold;
            white-space: nowrap;
        }

        .cmd-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff41;
            font-family: inherit;
            font-size: 14px;
            text-shadow: 0 0 4px rgba(0, 255, 65, 0.45);
            caret-color: #00ff41;
        }

        .cmd-input:disabled { opacity: 0.5; }

        .back-link {
            flex-shrink: 0;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            color: #00aa2a;
            border-top: 1px solid rgba(0, 255, 65, 0.13);
            text-shadow: none;
            letter-spacing: 0.1em;
        }

        .back-link a {
            color: #00aa2a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #00ff41;
            text-shadow: 0 0 6px rgba(0, 255, 65, 0.6);
        }
    </style>

        const logBuffer = [];

        const sleep = (ms) => new Promise(r => setTimeout(r, Math.max(0, ms)));

        function scrollDown() {
            output.scrollTop = output.scrollHeight;
        }

        function pushLog(entry) {
            const time = new Date().toLocaleTimeString('ru-RU');
            logBuffer.push('[' + time + '] ' + entry);
            if (logBuffer.length > 30) logBuffer.shift();
        }

        // ============================================================
        //  ПЕЧАТЬ ТЕКСТА
        // ============================================================

        async function typeLine(text, className = '') {
            const line = document.createElement('div');
            line.className = 'line' + (className ? ' ' + className : '');
            output.appendChild(line);

            if (!text) { scrollDown(); return line; }

            const len = text.length;
            let totalMs;
            if (len > 150) totalMs = 130;
            else if (len > 60) totalMs = 100;
            else if (len > 20) totalMs = 75;
            else totalMs = 45;

            const batch = Math.max(1, Math.floor(len / 30));
            const steps = Math.ceil(len / batch);
            const stepMs = Math.max(1, Math.round(totalMs / steps));

            for (let i = 0; i < len; i += batch) {
                line.textContent = text.slice(0, Math.min(i + batch, len));
                scrollDown();
                await sleep(stepMs);
            }
            line.textContent = text;
            scrollDown();
            return line;
        }

        async function addLine(text = '', className = '') {
            const line = document.createElement('div');
            line.className = 'line' + (className ? ' ' + className : '');
            line.textContent = text;
            output.appendChild(line);
            scrollDown();
            return line;
        }

        function updatePrompt() {
            if (!unlocked) {
                promptEl.textContent = '>';
            } else if (currentFile) {
                promptEl.textContent = 'FILE[' + currentFile + '] >';
            } else {
                promptEl.textContent = '>';
            }
        }

        async function handleCommand(raw) {
            const upper = raw.toUpperCase().trim();

            if (!raw) return;

            // Одиночная цифра = открыть файл (только вне файла)
            if (!currentFile && /^[1-3]$/.test(raw)) {
                await openFile(raw);
                return;
            }

            // ОТКРЫТЬ 1 / ОТКРЫТЬ X-1
            const openMatch = upper.match(/^(ОТКРЫТЬ|ОТКР|OPEN|FILE|ЧИТАТЬ)\s+(.+)$/);
            if (openMatch) {
                let target = openMatch[2].trim();
                if (/^[1-3]$/.test(target)) { await openFile(target); return; }
                const found = Object.keys(FILES).find(k =>
                    FILES[k].key.toUpperCase() === target.toUpperCase() ||
                    FILES[k].key.toUpperCase() === target.toUpperCase().replace('PROJECT', '').trim()
                );
                if (found) { await openFile(found); return; }
                // по частичному совпадению
                const partial = Object.keys(FILES).find(k => FILES[k].key.toUpperCase().includes(target.toUpperCase()));
                if (partial) { await openFile(partial); return; }
                await typeLine('> ФАЙЛ НЕ НАЙДЕН: ' + target, 'error');
                return;
            }

            switch (true) {
                case ['ПОМОЩЬ','HELP','?','ПОМОГИ','H'].includes(upper):
                    return showHelp();

                case ['ФАЙЛЫ','FILES','СПИСОК','LIST','LS','DIR'].includes(upper):
                    return showFiles();

                case ['ЗАКРЫТЬ','CLOSE','ГЛАВНАЯ','МЕНЮ','BACK'].includes(upper):
                    return closeFile();

                case upper.startsWith('ПИНГ') || upper.startsWith('PING'):
                    return doPing(raw);

                case ['СТАТУС','STATUS','SYSINFO'].includes(upper):
                    return showStatus();

                case ['КТОЯ','КТО Я','WHOAMI','ID','ЮЗЕР'].includes(upper):
                    return showWhoami();

                case ['ДАТА','DATE'].includes(upper):
                    return showDate();

                case ['ВРЕМЯ','TIME','CLOCK'].includes(upper):
                    return showTime();

                case ['ОЧИСТИТЬ','CLEAR','CLS','ОЧИСТКА'].includes(upper):
                    return clearScreen();

                case ['ВЫХОД','EXIT','LOGOUT','ВЫЙТИ','QUIT'].includes(upper):
                    return doExit();

                case ['ТРЕВОГА','ALERT','SOS','ALARM'].includes(upper):
                    return doAlert();

                case ['ЛОГ','LOG','ИСТОРИЯ','HISTORY'].includes(upper):
                    return showLog();

                case ['КАРТА','MAP','СХЕМА'].includes(upper):
                    return showMap();

                case ['ОПЕРАТОРЫ','O5','OPERATORS','СОВЕТ'].includes(upper):
                    return showOperators();

                case ['ВЕРСИЯ','VERSION','VER','BUILD'].includes(upper):
                    return showVersion();

                case ['ПОМОЩЬ ФАЙЛ','HELP FILE'].includes(upper):
                    return showHelpFiles();

                case upper.startsWith('ПОИСК') || upper.startsWith('SEARCH') || upper.startsWith('FIND'):
                    return doSearch(raw);

                case ['X-1','X-2','X-3'].includes(upper):
                    return openFile(upper);

                default:
                    await typeLine('> КОМАНДА НЕ РАСПОЗНАНА: ' + raw, 'error');
                    await addLine('  Введите ПОМОЩЬ для списка команд.', 'dim');
            }
        }

        async function openFile(id) {
            const file = FILES[id];
            if (!file) { await typeLine('> ФАЙЛ НЕ НАЙДЕН.', 'error'); return; }

            await addLine('');
            await typeLine('> ОТКРЫТИЕ ' + file.title + '...', 'dim');
            await sleep(250);
            await typeLine('> ДОСТУП РАЗРЕШЁН. ЗАГРУЗКА...', 'success');
            await sleep(250);
            await addLine('');
            await sleep(150);

            currentFile = file.key;
            updatePrompt();
            pushLog('FILE OPEN: ' + file.key);

            // Печатаем все строки
            for (const entry of file.lines) {
                if (!entry.t) { await addLine(''); await sleep(10); continue; }
                await typeLine(entry.t, entry.c || '');
                await sleep(15);
            }

            await addLine('');
            await addLine('─────────────────────────────────────────────────────────', 'dim');
            await addLine('Введите ЗАКРЫТЬ для возврата, ФАЙЛЫ для списка, ПОМОЩЬ.', 'dim');
        }

            pushLog('FILE CLOSE: ' + currentFile);

        async function doSearch(raw) {
            const parts = raw.split(/\s+/);
            const query = parts.slice(1).join(' ').trim().toLowerCase();
            if (!query) {
                await typeLine('> ИСПОЛЬЗОВАНИЕ: ПОИСК [запрос]', 'dim');
                return;
            }
            await addLine('');
            await typeLine('> ПОИСК: "' + parts.slice(1).join(' ') + '"', 'dim');
            await sleep(400);

            let totalFound = 0;
            for (const id of Object.keys(FILES)) {
                const file = FILES[id];
                const hits = [];
                file.lines.forEach((line, idx) => {
                    if (line.t && line.t.toLowerCase().includes(query)) {
                        hits.push({ idx: idx + 1, text: line.t });
                    }
                });
                if (hits.length > 0) {
                    totalFound += hits.length;
                    await addLine('');
                    await addLine('  ФАЙЛ: ' + file.title, 'highlight');
                    for (const h of hits.slice(0, 8)) {
                        await addLine('    [стр. ' + h.idx + '] ' + h.text.slice(0, 90));
                    }
                    if (hits.length > 8) {
                        await addLine('    ... и ещё ' + (hits.length - 8) + ' совпадений', 'dim');
                    }
                }
            }

            await addLine('');
            if (totalFound === 0) {
                await typeLine('> СОВПАДЕНИЙ НЕ НАЙДЕНО.', 'error');
            } else {
                await typeLine('> НАЙДЕНО СОВПАДЕНИЙ: ' + totalFound, 'success');
            }
        }

        function updateClock() {
            const d = new Date();
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = hh + ':' + mm + ':' + ss;
        }

        updateClock();
        setInterval(updateClock, 1000);

        bootSequence();
