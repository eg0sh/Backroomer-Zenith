    <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Foundation — Terminal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="green"]{--fg:#00ff41;--fg-dim:#009933;--fg-glow:rgba(0,255,65,.5);--bg:#0a0a0a;--bg-term:#0d0d0d;--err:#ff3a3a;--warn:#ffb000;--info:#00b4ff}
[data-theme="amber"]{--fg:#ffb000;--fg-dim:#885500;--fg-glow:rgba(255,176,0,.5)}
[data-theme="white"]{--fg:#e0e0e0;--fg-dim:#666;--fg-glow:rgba(224,224,224,.4)}
body{background:var(--bg);font-family:'Courier New',Courier,monospace;min-height:100vh;padding:1rem;display:flex;align-items:flex-start;justify-content:center;overflow-x:hidden}
.terminal{width:100%;max-width:1100px;height:calc(100vh - 2rem);background:var(--bg-term);border:1px solid var(--fg-dim);border-radius:4px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px var(--fg-glow),inset 0 0 100px rgba(0,0,0,.8);color:var(--fg);text-shadow:0 0 3px var(--fg-glow);cursor:text}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);z-index:10;animation:flicker 8s infinite}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.9);z-index:9}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.97}}
.header{padding:.6rem 1rem;border-bottom:1px solid var(--fg-dim);font-size:.9rem;letter-spacing:.05em;z-index:5}
.statusbar{padding:.3rem 1rem;font-size:.75rem;color:var(--fg-dim);border-bottom:1px solid var(--fg-dim);z-index:5}
.output{flex:1;padding:1rem;overflow-y:auto;font-size:.95rem;line-height:1.4;white-space:pre-wrap;word-break:break-word;z-index:5}
.output::-webkit-scrollbar{width:6px}.output::-webkit-scrollbar-track{background:transparent}.output::-webkit-scrollbar-thumb{background:var(--fg-dim)}
.line{margin-bottom:.05rem}
.line.input{color:var(--fg)}
.line.success{color:#00ff88}
.line.error{color:var(--err)}
.line.warn{color:var(--warn)}
.line.dim{color:var(--fg-dim)}
.line.ach{color:var(--warn);font-weight:bold}
.line.head{color:var(--fg);font-weight:bold;margin-top:.4rem}
.input-line{display:flex;align-items:center;padding:.5rem 1rem;border-top:1px solid var(--fg-dim);background:var(--bg-term);z-index:5}
.prompt{color:var(--fg);margin-right:.5rem}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:inherit;font-size:.95rem;text-shadow:0 0 3px var(--fg-glow);caret-color:var(--fg); caret-shape:block}
.footer{padding:.3rem 1rem;font-size:.7rem;color:var(--fg-dim);border-top:1px solid var(--fg-dim);z-index:5}
.achievement-popup{position:fixed;top:1rem;right:1rem;background:var(--bg-term);border:1px solid var(--fg);padding:1rem 1.5rem;color:var(--fg);font-family:'Courier New',monospace;font-size:.9rem;box-shadow:0 0 30px var(--fg-glow);opacity:0;transform:translateX(100%);transition:all .3s ease;z-index:100;max-width:340px}
.achievement-popup.show{opacity:1;transform:translateX(0)}
.achievement-popup .title{font-weight:bold;margin-bottom:.2rem}
.achievement-popup .desc{color:var(--fg-dim);font-size:.8rem}
@media (max-width:700px){body{padding:0}.terminal{height:100vh;max-width:100%;border-radius:0;border:none}.achievement-popup{top:auto;bottom:1rem;right:1rem;left:1rem;max-width:none}}
</style>
</head>
<body>
<div class="terminal" id="terminal">

<div class="output" id="output"></div>

<script>
// ============================================================================
//                          БЛОК КОНСТАНТ
// ----------------------------------------------------------------------------
//  Всё, что можно менять/дополнять, находится здесь. Чтобы добавить новый SCP,
//  организацию, класс, файл, достижение или страницу для «open» — просто
//  добавьте объект в соответствующий массив.
// ============================================================================

// ----------------------------------------------------------------------------
//  1. ОБЩИЕ НАСТРОЙКИ ТЕРМИНАЛА
//  version      — версия, отображается в шапке
//  node         — имя узла в статус-баре
//  session      — id сессии
//  prompt       — символ приглашения перед вводом
//  defaultTheme — тема по умолчанию: 'green' | 'amber' | 'white'
//  bootSpeed    — задержка между строками boot, мс (клик/клавиша = пропустить)
// ----------------------------------------------------------------------------
const CONFIG = {
    version: 'v4.8.0',
    node: 'ZENITH-01',
    session: '#A7F3',
    prompt: '> ',
    defaultTheme: 'green',
    bootSpeed: 120
};

// ----------------------------------------------------------------------------
//  2. SCP-ОБЪЕКТЫ
//  id           — номер (без «SCP-»)
//  name         — название
//  class        — id класса из SCP_CLASSES
//  risk         — id риска из RISK_CLASSES
//  date         — дата обнаружения
//  discoverer   — кто и где обнаружил
//  conditions   — особые условия содержания
//  description  — краткое описание для терминала (полное — на SCP-objects.html)
// ----------------------------------------------------------------------------
const SCP_OBJECTS = [
    { id:'000', name:'Жуткий Шум', class:'veritas', risk:'moderate', date:'6.03.26', discoverer:'BEZL_gaming, Ур.0', conditions:'—', description:'Устойчивый звуковой фон всех уровней. Смесь шёпота, криков, скрежета, обрывков речи. Не имеет источника, вызывает паранойю и галлюцинации. Неотъемлемая часть реальности.' },
    { id:'001', name:'Самооткрывание дверей/люков', class:'euclid', risk:'low', date:'6.03.26', discoverer:'BEZL_gaming, Ур.0, База Б.И.Г #1', conditions:'—', description:'Двери и люки на базах открываются и закрываются сами. Хаотичные движения, от медленных до многократных за секунду. Не влияют на стрельбу и зелья. Железные двери не подвержены.' },
    { id:'002', name:'Частицы Шагов из Неоткуда', class:'undefined', risk:'unknown', date:'7.03.26', discoverer:'BEZL_gaming, Ур.0, База Б.И.Г #1', conditions:'—', description:'На поверхностях появляются частицы, имитирующие следы. Невидимой сущности нет. Физическое воздействие неэффективно. Гипотезы: искривление пространства-времени, квантовые флуктуации.' },
    { id:'003', name:'Дверь Рассудка', class:'euclid', risk:'high', date:'7.03.26', discoverer:'BEZL_gaming, Ур.0', conditions:'—', description:'Еловая дверь, появляется случайно. В радиусе 0-3 блоков рассудок падает быстро, при взаимодействии — до 3-7%. Излучает радиацию, не блокируемую респиратором. Устойчива к SCP-001.' },
    { id:'004', name:'Одичалые Часы', class:'aleator', risk:'critical', date:'8.03.26', discoverer:'Зануда, Однотоново', conditions:'—', description:'Часы с надписью «М4ГИЧ4СКIЕ Ч4СЫ». В левой руке через случайное время запускают событие любого масштаба (от наковальни до ядерного взрыва). В правой — нейтральны.', addendum:'25.09.26: при длительном нахождении в инвентаре часы издают тиканье, детский смех и фразы на неизвестном языке (A-co).' },
    { id:'005', name:'Люди в Чёрном', class:'keter', risk:'high', date:'8.03.26', discoverer:'Зануда, Сцена', conditions:'—', description:'Чёрные силуэты без черт. Возникают из темноты, исчезают при прямом взгляде, появляются вновь при отведении. Неуязвимы для огнестрела. Цель — наблюдение.' },
    { id:'006', name:'Рычаг-Призыватель', class:'aleator', risk:'critical', date:'8.03.26', discoverer:'Тусовщик, за картой', conditions:'—', description:'Рычаг, появляется на любых поверхностях (вода, лава), самореплицируется. Активация призывает неразумных сущностей случайным количеством. Уничтожать все рычаги в неподходящих местах.' },
    { id:'007', name:'Галактика в Бутылке', class:'undefined', risk:'unknown', date:'9.03.26', discoverer:'Ефрейтор Зануд, Сцена', conditions:'—', description:'Бутылка с миниатюрной галактикой внутри. Природа (копия или новая) не установлена. Эффект употребления неизвестен. Гипотеза: возможное высвобождение вселенной.' },
    { id:'008', name:'Двойник', class:'euclid', risk:'high', date:'9.03.26', discoverer:'4 Зануд, лагерь Зануд #13', conditions:'—', description:'Существо, принимающее облик любого игрока или сущности. Копирует движения, через время атакует, возвращаясь к искажённой форме. Урон зависит от жертвы.' },
    { id:'009', name:'Меч Самоубийства', class:'euclid', risk:'high', date:'9.03.26', discoverer:'Зануда, Сцена', conditions:'—', description:'Идентичен железному мечу. При контакте с эфесом — суицидальные наклонности. Раны не смертельны, клинок не изнашивается. При использовании не по назначению разрушается. В инвентаре переходит в основной слот.' },
    { id:'010', name:'В.Т.П.С.Г', class:'undefined', risk:'unknown', date:'11.03.26', discoverer:'Зануда, лагерь Зануд #48', conditions:'—', description:'Военная техника парит в воздухе какое-то время, затем исчезает. Причины и мотивы неизвестны.' },
    { id:'011', name:'Привидение с Кладбища', class:'euclid', risk:'high', date:'11.03.26', discoverer:'Зануды, кладбище на Сцене', conditions:'—', description:'Привидение на кладбище Сцены. Активировано 22.09.26 ударом «Объекта 226» по могиле. Материализовалось со стонами и воем ветра. Три Зануды получили психотравмы. Доступ на кладбище закрыт.' },
    { id:'012', name:'Странный Дёрн', class:'safe', risk:'low', date:'13.03.26', discoverer:'Зануда, Сцена', conditions:'—', description:'Блок земли, парящий над поверхностью. Случайные звуки и частицы. Безвреден. Природа левитации не объяснена.' },
    { id:'013', name:'Странник', class:'euclid', risk:'low', date:'13.03.26', discoverer:'BEZL_gaming, Ур.0', conditions:'—', description:'Фигура в химзащите, блуждающая по уровням. Игнорирует других, держит предметы (фонарик, еду). Растворяется через время. Предположительно несколько особей.' },
    { id:'014', name:'Летающий Поварской Колпак', class:'euclid', risk:'low', date:'8.03.26', discoverer:'Зануда, Сцена', conditions:'—', description:'Летающий колпак, проходит сквозь твёрдые поверхности, разрушает непрочные объекты (стекло). Опасности для живых не представляет.' },
    { id:'015', name:'Душа Суицидального Тусовщика', class:'euclid', risk:'moderate', date:'7.03.26', discoverer:'Серость, Ур.53', conditions:'—', description:'Невидимый Тусовщик, покончивший с собой на Ур.53. Считает уровень своим домом. Проявляется шорохами, звуками, дверями. Способен менять уровень и наносить физический вред.' },
    { id:'016', name:'Кусающийся Спороцвет', class:'euclid', risk:'high', date:'13.03.26', discoverer:'Генерал Зануд, Скукозона', conditions:'—', description:'Спороцвет, парящий в воздухе. Вдыхание спор — отравление. При попытке вреда жалит пропорционально удару. Распространяет ядовитый мох. Устойчив к холоду и молниям. Слабость — миндальная вода.' },
    { id:'017', name:'Музыка из Неоткуда', class:'veritas', risk:'low', date:'13.03.26', discoverer:'BEZL_gaming, Ур.0, База Б.И.Г #1', conditions:'—', description:'Фоновая музыка, играющая даже при настройке «Музыка: 0%» (если общие звуки включены). Безвредна, часть звуковой среды.' },
    { id:'018', name:'Воздушный Щит', class:'undefined', risk:'unknown', date:'14.03.26', discoverer:'Зануда, Ур.4', conditions:'—', description:'Щит, парящий в воздухе, периодически исчезает. Впечатление, что его удерживает невидимая сущность. Природа и цель не установлены.' },
    { id:'019', name:'Фейковый Пол', class:'keter', risk:'high', date:'14.03.26', discoverer:'Зануда, Ур.0', conditions:'—', description:'Внезапное исчезновение пола, открывающее Пустоту. Предотвратить падение невозможно. Время и место непредсказуемы.' },
    { id:'020', name:'Нарушители Мёртвой Тишины', class:'euclid', risk:'moderate', date:'17.03.26', discoverer:'BEZL_gaming, Ур.1', conditions:'—', description:'Неразумные сущности, появляющиеся даже во время Мёртвой Тишины. Причина нарушения исследуется.' },
    { id:'021', name:'Снеговики с Небес', class:'ticonderoga', risk:'low', date:'18.03.26', discoverer:'Тусовщик, за картой', conditions:'—', description:'Снеговики, падающие с неба. Причина не установлена. Безвредны.' },
    { id:'022', name:'Бутылка..?', class:'undefined', risk:'unknown', date:'18.03.26', discoverer:'Зануда, Ур.52', conditions:'—', description:'Пустая бутылка, появляется на поверхностях, при приближении исчезает. Не подвержена серверной очистке и SCP-023. Предположительно телепортируется, едина в экземпляре.' },
    { id:'023', name:'Очистка', class:'ticonderoga', risk:'low', date:'19.03.26', discoverer:'BEZL_gaming, Ур.1', conditions:'—', description:'Случайная очистка сервера от выброшенных предметов в непредсказуемый момент. Безвредна.' },
    { id:'024', name:'Урчащий Живот kastomminer', class:'undefined', risk:'unknown', date:'—', discoverer:'данные отсутствуют', conditions:'—', description:'Гипотетически существует. Данные отсутствуют.' },
    { id:'025', name:'Инверсия', class:'noeticus', risk:'low', date:'23.03.26', discoverer:'Группа 3 Зануд, Сцена', conditions:'—', description:'Изменение цветовых фильтров окружения на случайные оттенки. Длится 5 сек. Каждый видит по-своему. Только восприятие, материя не меняется.' },
    { id:'026', name:'Фантомный Предмет', class:'undefined', risk:'unknown', date:'23.03.26', discoverer:'Nastyamadness, Ур.0', conditions:'—', description:'Предмет в инвентаре с названием «############». Нельзя выбросить или использовать, хаотично меняет позицию. Не подтверждён другими. Возможно, галлюцинация.' },
    { id:'027', name:'Галлюцинации Голода', class:'noeticus', risk:'low', date:'24.03.26', discoverer:'BEZL_gaming, Ур.0', conditions:'—', description:'Индикатор голода обнуляется, фактически сытость не меняется. Урон отсутствует. Длится ~30 сек.' },
    { id:'028', name:'Смазанный Текст', class:'noeticus', risk:'low', date:'25.03.26', discoverer:'Зануда, Ур.52', conditions:'—', description:'Искажение любых текстов: буквы перемешиваются, замещаются символами иных алфавитов. Нейтрализуется миндальной (неоновой/супер) водой.' },
    { id:'029', name:'Скрипун', class:'euclid', risk:'high', date:'26.03.26', discoverer:'Зануды «К.О.Н.Т.У.Р», лес Кожекрадов', conditions:'—', description:'Существо 3,5 блока высотой, 1 блок шириной, серое, тощее. Стоит под деревьями, издавая скрип. Враждебно к животным (63 убийства). К другим — только при угрозе.' },
    { id:'030', name:'Парадокс Недосягаемости', class:'regium', risk:'moderate', date:'25.03.26', discoverer:'DanielDecarMosh, Ур.0.2', conditions:'—', description:'Коридор с двумя комнатами, бесконечно повторяющимися при движении вперёд. При повороте — возврат в начало. Возник после экспериментов с исказителем материи.' },
    { id:'031', name:'Отключение Света', class:'undefined', risk:'unknown', date:'—', discoverer:'данные отсутствуют', conditions:'—', description:'Данные отсутствуют.' },
    { id:'032', name:'Ветродуй', class:'undefined', risk:'high', date:'25.03.26', discoverer:'Тусовщик, лагерь Z.C.L', conditions:'—', description:'Воздушная аномалия, возникает на открытых пространствах при ветре >20 м/с. Может привести к гибели. В помещении безопасна.' },
    { id:'033', name:'Колючий Отбрасыватель', class:'immunutus', risk:'moderate', date:'21.08.26', discoverer:'3 Зануд «A-co», Сцена', conditions:'—', description:'Парящий кактус с иероглифами. Отбрасывает предметы и существ рядом. Огнестойкий, неразрушимый. Обнаружено три экземпляра.' },
    { id:'034', name:'Псевдоминдальная вода', class:'euclid', risk:'high', date:'21.08.26', discoverer:'2 Серости, Ур.4', conditions:'—', description:'Автомат, выдающий жидкость, идентичную миндальной воде. У животных — разложение за 10-20 сек. Предположительно внешнее заражение.' },
    { id:'035', name:'Загадочные Таблетки', class:'undefined', risk:'unknown', date:'22.08.26', discoverer:'Зануда, Ур.5.1', conditions:'—', description:'Таблетки со случайным эффектом 30 сек: слепота, регенерация, сопротивление, иссушение. Устойчивы к огню, взрывам, очистке. Полный спектр неизвестен.' },
    { id:'036', name:'Параноидальная Снежная Зона', class:'regium', risk:'moderate', date:'3.09.26', discoverer:'3 Зануда, снежный биом Сцены', conditions:'—', description:'Участок снежного биома. Каждые 5-18 ч падают синие снежинки с хрустальным звоном. Идентичны обычным, но холоднее. Содержат «параноицион», вызывающий головокружение, паранойю, голод (A-co и LCSA).' },
    { id:'037', name:'Пукающие Грибы', class:'regium', risk:'moderate', date:'19:36, 9.09.26', discoverer:'2 Безликих «LCSA», Сцена', conditions:'—', description:'Скопления зелёных грибов у штаба LCSA. Слабо светятся, каждые 5-30 мин издают звук выхода газов. Длительное нахождение — удушье, кашель с зелёным паром. Огонь уничтожает.' },
    { id:'038', name:'Пластинка «12»', class:'noeticus', risk:'unknown', date:'3:33, 12.09.26', discoverer:'Серость, Ур.19', conditions:'—', description:'Внешне — стандартная пластинка «11» (C418). Внутри — хаотичный звукоряд 46 сек 46 мс. Звуки: кашель, шаги, свиной хрюк, вагонеточный грохот. Хранится в A-co.' },
    { id:'039', name:'Толкинг Экс', class:'euclid', risk:'moderate', date:'11:45–11:48, 13.09.26', discoverer:'Зануда «A-co», Сцена', conditions:'—', description:'Железный топор с разумом и речью. 18 языков. Дружелюбен к владельцу, при грубости царапает и выскальзывает. Видит на 20 чанков, обоняние 10 м, слух 1 км. Ночью шепчет на странных диалектах.' },

function typeLine(text, cls='', delay=18){
  return new Promise(res=>{
    const div=document.createElement('div'); div.className='line '+cls; output.appendChild(div);

let audioCtx=null;
function sfx(type){
  if(state.sound===false) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const P={key:[900,.02,'square',.02],enter:[500,.05,'square',.04],error:[140,.25,'sawtooth',.06],
             ach:[880,.35,'sine',.08],glitch:[60,.3,'sawtooth',.05]}[type]; if(!P) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=P[0]; o.type=P[2]; g.gain.value=P[3];
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+P[1]);
    o.start(); o.stop(audioCtx.currentTime+P[1]);
  }catch(e){}
}

// ---------- Нормализированный путь (для cd + cat) ----------
function normPath(path){
    const out = [];
    for (const p of path.split('/')) {
        if (!p || p === '.') continue;
        if (p === '..') { out.pop(); continue; }
        out.push(p);
    }
    return '/' + out.join('/');
}
  
// ---------- Утилиты ----------
function normalizeId(id) {
    return String(id).replace(/^scp-?/i, '').trim().padStart(3, '0');
}
function getClass(id) { return SCP_CLASSES.find(c => c.id === id); }
function getRisk(id) { return RISK_CLASSES.find(r => r.id === id); }
function getSCP(id) { return SCP_OBJECTS.find(s => s.id === normalizeId(id)); }
function dateKey(s){ const m=String(s).match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); return m?`${+m[1]}.${+m[2]}.${+m[3]%100}`:null; }

// ---------- Levenshtein для подсказки опечаток ----------
function levenshtein(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = [];
    for (let i = 0; i <= b.length; i++) m[i] = [i];
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            m[i][j] = b[i-1] === a[j-1]
                ? m[i-1][j-1]
                : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
        }
    }
    return m[b.length][a.length];
}

// ---------- Работа с ФС ----------
function resolvePath(path) {
    if (!path || path === '/') return { node:FILESYSTEM, path:'/' };
    const parts = path.replace(/^\//, '').split('/').filter(Boolean);
    let cur = FILESYSTEM, curPath = '/';
    for (const p of parts) {
        if (cur.type !== 'dir' || !cur.children[p]) return null;
        cur = cur.children[p];
        curPath = curPath === '/' ? '/' + p : curPath + '/' + p;
    }
    return { node:cur, path:curPath };
}

let SESSION_START = Date.now();

async function processCommand(raw) {
    let cmd = raw.trim();
    if (!cmd) return;

    // активная игра/подтверждение перехватывает ввод
    if (state.game) {
        busy=true; skipType=false;
        try { await state.game.onInput(cmd); } finally { busy=false; }
        return;
    }

    state.commands++;
    state.uniqueCommands.add(cmd.toLowerCase());
    state.history.push(cmd);
    state.historyIndex = state.history.length;

    // алиасы
    const f0 = cmd.split(/\s+/)[0].toLowerCase();
    if (ALIASES[f0]) cmd = ALIASES[f0] + cmd.slice(f0.length);

    const first = cmd.split(/\s+/)[0].toLowerCase();
    if (Object.hasOwn(COMMANDS, first)) state.commandCounts[first] = (state.commandCounts[first] || 0) + 1;

    busy=true; skipType=false;
    try {
        if (cmd.toLowerCase() === 'code red') { await cmdAlert(); }
        else {
            const parts = cmd.split(/\s+/);
            const name = parts[0].toLowerCase();
            const args = parts.slice(1);
            const command = Object.hasOwn(COMMANDS, name) ? COMMANDS[name] : null;
            if (!command) {
                let best=null, bestDist=3;
                Object.keys(COMMANDS).forEach(k=>{ const d=levenshtein(name,k); if(d<bestDist){bestDist=d;best=k;} });
                state.wrongCommands++; sfx('error');
                print(best ? `Команда «${name}» не найдена. Возможно, вы имели в виду «${best}»?`
                           : `Команда «${name}» не найдена. Введите «help».`, 'error');
            } else {
                try { await command.handler(args); } catch(e) { print('Ошибка выполнения: '+e.message,'error'); }
            }
        }
    } finally { busy=false; }
    saveState();
    checkAchievements();
}

// ============================================================================
//  АВТОДОПОЛНЕНИЕ, ИСТОРИЯ, КОМБИНАЦИИ
// ============================================================================

const SUBCOMMANDS = {
    scp:['list','show','search','random','stats','date'],
    class:['list','risk'],
    org:['list'],
    theme:['green','amber','white'],
    open:Object.keys(PAGE_MAP),
    arion:['phase'],
    sound:['on','off']
};

input.addEventListener('keydown', e => {
    if (busy) { e.preventDefault(); skipType=true; return; }
    if (e.key.length===1 && !e.ctrlKey) sfx('key');
    if (e.key === 'Enter') {
        sfx('enter');
        const val = input.value;
        if (val.trim()) {
            printLine(CONFIG.prompt + val, 'input');
            processCommand(val);
        }
        input.value = '';
        state.historyIndex = state.history.length;
        e.preventDefault();
    } else if (e.key === 'Tab') {
        e.preventDefault();
        autocomplete();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.historyIndex > 0) {
            state.historyIndex--;
            input.value = state.history[state.historyIndex];
        }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.historyIndex < state.history.length - 1) {
            state.historyIndex++;
            input.value = state.history[state.historyIndex];
        } else {
            state.historyIndex = state.history.length;
            input.value = '';
        }
    } else if (e.key === 'l' && e.ctrlKey) {
        e.preventDefault();
        output.innerHTML = '';
    } else if (e.key === 'c' && e.ctrlKey) {
        state.game=null;
        e.preventDefault();
        input.value = '';
    }
});

function autocomplete() {
    const val = input.value;
    const parts = val.trim().split(/\s+/);
    if (!parts[0]) return;
    if (parts.length === 1) {
        const prefix = parts[0].toLowerCase();
        const matches = Object.keys(COMMANDS).filter(c => c.startsWith(prefix));
        if (matches.length === 1) {
            input.value = matches[0] + ' ';
        } else if (matches.length > 1) {
            printLine('  ' + matches.join('  '), 'dim');
        }
    } else {
        const first = parts[0].toLowerCase();
        const subs = SUBCOMMANDS[first];
        if (!subs) return;
        const last = parts[parts.length-1].toLowerCase();
        const matches = subs.filter(s => s.startsWith(last));
        if (matches.length === 1) {
            parts[parts.length-1] = matches[0];
            input.value = parts.join(' ') + ' ';
        } else if (matches.length > 1) {
            printLine('  ' + matches.join('  '), 'dim');
        }
    }
}
