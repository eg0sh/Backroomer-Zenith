<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP Foundation — Terminal</title>
<script src="data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="green"]{--fg:#00ff41;--fg-dim:#009933;--fg-glow:rgba(0,255,65,.5);--bg:#0a0a0a;--bg-term:#0d0d0d;--err:#ff3a3a;--warn:#ffb000;--info:#00b4ff}
[data-theme="amber"]{--fg:#ffb000;--fg-dim:#885500;--fg-glow:rgba(255,176,0,.5)}
[data-theme="white"]{--fg:#e0e0e0;--fg-dim:#666;--fg-glow:rgba(224,224,224,.4)}
body{background:radial-gradient(ellipse at center,#0f1511 0%,#050605 70%,#000 100%);font-family:'Courier New',Courier,monospace;min-height:100vh;padding:1rem;display:flex;align-items:flex-start;justify-content:center;overflow-x:hidden}
.terminal{width:100%;max-width:1100px;height:calc(100vh - 2rem);background:var(--bg-term);border:1px solid var(--fg-dim);border-radius:4px;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 0 40px var(--fg-glow),inset 0 0 100px rgba(0,0,0,.8);color:var(--fg);text-shadow:0 0 3px var(--fg-glow);cursor:text}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);z-index:10;animation:flicker 8s infinite}
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px rgba(0,0,0,.9);z-index:9}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.97}}
.header{padding:.6rem 1rem;border-bottom:1px solid var(--fg-dim);font-size:.9rem;letter-spacing:.05em;z-index:5}
.statusbar{padding:.3rem 1rem;font-size:.75rem;color:var(--fg-dim);border-bottom:1px solid var(--fg-dim);z-index:5}
.output{flex:1;padding:1rem;overflow-y:auto;font-size:.95rem;line-height:1.4;white-space:pre-wrap;word-break:break-word;z-index:5}
.output::-webkit-scrollbar{width:6px}.output::-webkit-scrollbar-track{background:transparent}.output::-webkit-scrollbar-thumb{background:var(--fg-dim)}
.line{margin-bottom:.05rem}
.line.input{color:var(--fg)}
.line.success{color:#00ff88}
.line.error{color:var(--err)}
.line.warn{color:var(--warn)}
.line.dim{color:var(--fg-dim)}
.line.ach{color:var(--warn);font-weight:bold}
.line.head{color:var(--fg);font-weight:bold;margin-top:.4rem}
.input-line{display:flex;align-items:center;padding:.5rem 1rem;border-top:1px solid var(--fg-dim);background:var(--bg-term);z-index:5}
.prompt{color:var(--fg);margin-right:.5rem}
#input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:inherit;font-size:.95rem;text-shadow:0 0 3px var(--fg-glow);caret-color:var(--fg); caret-shape:block}
.footer{padding:.3rem 1rem;font-size:.7rem;color:var(--fg-dim);border-top:1px solid var(--fg-dim);z-index:5}
.achievement-popup{position:fixed;top:1rem;right:1rem;background:var(--bg-term);border:1px solid var(--fg);padding:1rem 1.5rem;color:var(--fg);font-family:'Courier New',monospace;font-size:.9rem;box-shadow:0 0 30px var(--fg-glow);opacity:0;transform:translateX(100%);transition:all .3s ease;z-index:100;max-width:340px}
.achievement-popup.show{opacity:1;transform:translateX(0)}
.achievement-popup .title{font-weight:bold;margin-bottom:.2rem}
.achievement-popup .desc{color:var(--fg-dim);font-size:.8rem}
@media (max-width:700px){body{padding:0}.terminal{height:100vh;max-width:100%;border-radius:0;border:none}.achievement-popup{top:auto;bottom:1rem;right:1rem;left:1rem;max-width:none}}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>

<script>
// ============================================================================
//                          БЛОК КОНСТАНТ
// ----------------------------------------------------------------------------
//  Всё, что можно менять/дополнять, находится здесь. Чтобы добавить новый SCP,
//  организацию, класс, файл, достижение или страницу для «open» — просто

// ============================================================================

// ----------------------------------------------------------------------------
//  1. ОБЩИЕ НАСТРОЙКИ ТЕРМИНАЛА
//  version      — версия, отображается в шапке
//  node         — имя узла в статус-баре

//  prompt       — символ приглашения перед вводом
//  defaultTheme — тема по умолчанию: 'green' | 'amber' | 'white'
//  bootSpeed    — задержка между строками boot, мс (клик/клавиша = пропустить)
// ----------------------------------------------------------------------------
const CONFIG = {
    version: 'v4.8.0',
    node: 'ZENITH-01',
    session: '#A7F3',
    prompt: '> ',
    defaultTheme: 'green',
    bootSpeed: 120
};

// ----------------------------------------------------------------------------
//  2, 3, 4, 5. SCP-ОБЪЕКТЫ, SCP-КЛАССЫ, КЛАССЫ РИСКА, СВЯЗАННЫЕ ОРГАНИЗАЦИИ
//  Все данные берутся из data.js
// ----------------------------------------------------------------------------
const SCP_OBJECTS = DATA.scp.objects;
const SCP_CLASSES = DATA.scp.classes;
const RISK_CLASSES = DATA.scp.risks;
const ORGANIZATIONS = DATA.orgs;
  
// ----------------------------------------------------------------------------
//  6. ФАЙЛОВАЯ СИСТЕМА (симуляция)

// ----------------------------------------------------------------------------
const FILESYSTEM = {
    type:'dir', children:{

        'readme.txt':{ type:'file', content:'FOUNDATION SECURE TERMINAL\n\nДобро пожаловать, гость. Уровень допуска: 0/5.\nВведите `help`, чтобы увидеть список команд.\nВведите `??` для краткой подсказки.' },
        'notice.txt':{ type:'file', content:'ОБЪЯВЛЕНИЕ\n\nПерсоналу напоминается: шум на уровнях не является поводом для паники.\nЕсли шум ответил вам по имени, сообщите в отдел наблюдения.\nНе отвечайте ему.' },
        'archive':{ type:'dir', children:{
            'first_record.txt':{ type:'file', content:'ПЕРВАЯ ЗАПИСЬ РЕЕСТРА\n\n6.03.26. Зафиксирован SCP-000.\nЗаписавший не смог описать источник звука.\nПометка на полях: «он всегда был здесь».' },
            '.last_entry.secret':{ type:'file', content:'Последняя запись архивариуса\n\nЯ перечитал все файлы по два раза.\nВ каждом из них на одну строку больше, чем я помню.' }

            'report_2026.txt':{ type:'file', content:'ГОДОВОЙ ОТЧЁТ 2026\n\nЗа год появилось множество новых аномалий.\nФонд практически ничего не сделал.\nПоявилось 7 связанных организаций, работающих с аномалиями.\nНаиболее активные: К.О.Н.Т.У.Р, A-co, LCSA.' },

            'incident_0306.txt':{ type:'file', content:'ИНЦИДЕНТ 6.03.26\n\nПервое наблюдение Жуткого Шума на Ур.0.\nНаблюдатель: BEZL_gaming.\nИсход: наблюдатель продолжил наблюдение.' },
            'manifest.txt':{ type:'file', content:'МАНИФЕСТ SCP-ФОНДА\n\nSecure. Contain. Protect.\nМы защищаем нормальность любой ценой.\nМы - последний рубеж между человечеством и хаосом.' },
            'hint.txt':{ type:'file', content:'Подсказка:\n\nПопробуйте ввести `42`. Или `xyzzy`. Или `matrix`.\nА ещё попробуйте ↑↑↓↓←→←→BA...' }
        } },
        'logs':{ type:'dir', children:{
            'session.log':{ type:'file', content:'[22:14] дверь B открыта\n[22:18] дверь B закрыта\n[23:02] [УДАЛЕНО] замечен в коридоре\n[23:03] субъект исчез\n[04:11] [УДАЛЕНО] активирован в секторе 7\n[04:12] потеря связи с сектором' },
            'night_watch.log':{ type:'file', content:'[00:10] обход завершён, всё спокойно\n[01:25] дверь B открылась сама\n[02:40] обход завершён, всё спокойно\n[03:33] обход не начинался\n[03:34] обход завершён' },
            'camera_03.log':{ type:'file', content:'[ЗАПИСЬ] камера 3\n\n02:07 никого нет\n02:08 никого нет\n02:09 никого нет, запись идёт\n02:10 запись остановлена оператором\n(оператора в смене не было)' },
        } },
        'classified':{ type:'dir', children:{
            '.o5_joke.secret':{ type:'file', content:'— Почему Фонд не боится темноты?\n— Потому что там уже сидит SCP-005.\n\n(анекдот одобрен советом, хотя никто не смеялся)' },
            'file_226.enc':{ type:'file', content:'[ЗАШИФРОВАНО]\nТребуется допуск уровня 5.\nОбратитесь в отдел криптографии.' },
            'o5_memo.enc':{ type:'file', content:'[ЗАШИФРОВАНО]\n\nЗаголовок читаем: «ПРОЕКТ ZENITH».\nОстальное требует допуска уровня 5.\nОбратитесь в раздел криптографии.' },
            'redacted.txt':{ type:'file', content:'[ДАННЫЕ УДАЛЕНЫ]\nДоступ запрещён.' }
        } }
    }
};

// ----------------------------------------------------------------------------
//  7. СТРАНИЦЫ ДЛЯ КОМАНДЫ `open`
// ----------------------------------------------------------------------------
const PAGE_MAP = {
    'scp-objects':'SCP-objects.html',
    'scp-class':'SCP-class.html',
    'scp-organizations':'SCP-organizations.html',
    'scp-menu':'SCP-menu.html',
    'arion':'arion.html',
    'sentinel':'sentinel.html',
    'analysis':'analysis.html',
    'index':'index.html'
};

// ----------------------------------------------------------------------------
//  8. КРАТКАЯ СВОДКА ПО ПРОЕКТАМ (для команд arion/sentinel/fleet/budget/oil)
// ----------------------------------------------------------------------------
const avg = a => a.length ? Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length) : 0;
const sumVals = o => Object.values(o).reduce((a,b)=>a+b,0);

const PROJECTS = (() => {
    const A = DATA.arion, S = DATA.sentinel;
    const total = sumVals(A.budgetByPhase), spent = sumVals(A.spentByPhase);
    const lastOil = A.oilPrices[A.oilPrices.length-1];
    return {
        arion:{
            name:'Arion',
            progress: avg([...A.subPhases, ...A.fleetPhases]),
            budget:{ total, spent, remaining: total - spent },
            phases:[
                ...A.phases.map(p => ({ name:p.label, progress:avg(A.subPhases.filter(s=>s.phaseId===p.id)) })),
                { name:'Флот и судостроение', progress:avg(A.fleetPhases) }
            ]
        },
        sentinel:{
            name:'Sentinel',
            progress: avg([...S.undergroundPhases, ...S.surfacePhases]),
            phases:[
                { name:'Sentinel A — Подземная часть', progress:avg(S.undergroundPhases) },
                { name:'Sentinel A — Наземная часть', progress:avg(S.surfacePhases) }
            ]
        },
        oil:{ price:lastOil.value, currency:'USD/барр', period:lastOil.month }
    };
})();

// ----------------------------------------------------------------------------
//  9. ДОСТИЖЕНИЯ
//  id, name, desc, check(state) — функция проверки
//  В state: commands, uniqueCommands (Set), commandCounts (obj), scpsViewed (Set),
//           classesViewed (Set), orgsViewed (Set), pagesOpened (Set),
//           themesChanged, filesRead (Set), wrongCommands, secretAttempts,
//           konamiDone, unlocked (obj)
// ----------------------------------------------------------------------------
const ACHIEVEMENTS = [
    { id:'first', name:'Первый контакт', desc:'Ввести первую команду', check:s=>s.commands>=1 },
    { id:'novice', name:'Новичок', desc:'Ввести 10 команд', check:s=>s.commands>=10 },
    { id:'operator', name:'Оператор', desc:'Ввести 50 команд', check:s=>s.commands>=50 },
    { id:'veteran', name:'Ветеран', desc:'Ввести 200 команд', check:s=>s.commands>=200 },
    { id:'legend', name:'Легенда', desc:'Ввести 1000 команд', check:s=>s.commands>=1000 },
    { id:'scp_curious', name:'Любопытный', desc:'Просмотреть 5 SCP', check:s=>s.scpsViewed.size>=5 },
    { id:'scp_hunter', name:'Охотник', desc:'Просмотреть 15 SCP', check:s=>s.scpsViewed.size>=15 },
    { id:'scp_master', name:'Мастер', desc:'Просмотреть 30 SCP', check:s=>s.scpsViewed.size>=30 },
    { id:'scp_legend', name:'Хранитель', desc:'Просмотреть все SCP', check:s=>s.scpsViewed.size>=SCP_OBJECTS.length },
    { id:'class_student', name:'Ученик', desc:'Изучить 5 классов', check:s=>s.classesViewed.size>=5 },
    { id:'class_scholar', name:'Классификатор', desc:'Изучить все классы', check:s=>s.classesViewed.size>=SCP_CLASSES.length },
    { id:'org_contact', name:'Контакт', desc:'Изучить 3 организации', check:s=>s.orgsViewed.size>=3 },
    { id:'org_network', name:'Связной', desc:'Изучить все организации', check:s=>s.orgsViewed.size>=ORGANIZATIONS.length },
    { id:'night_owl', name:'Ночная смена', desc:'Войти с 23:00 до 4:00', check:()=>{const h=new Date().getHours();return h>=23||h<4} },
    { id:'early_bird', name:'Ранняя пташка', desc:'Войти с 4:00 до 7:00', check:()=>{const h=new Date().getHours();return h>=4&&h<7} },
    { id:'theme_master', name:'Эстет', desc:'Сменить тему 5 раз', check:s=>s.themesChanged>=5 },
    { id:'mathematician', name:'Математик', desc:'Ввести 42', check:s=>s.uniqueCommands.has('42') },
    { id:'traveller', name:'Путешественник', desc:'Открыть 3 страницы', check:s=>s.pagesOpened.size>=3 },
    { id:'librarian', name:'Библиотекарь', desc:'Прочитать 5 файлов', check:s=>s.filesRead.size>=5 },
    { id:'archivist', name:'Архивариус', desc:'Прочитать 15 файлов', check:s=>s.filesRead.size>=15 },
    { id:'persistent', name:'Настойчивый', desc:'20 неизвестных команд', check:s=>s.wrongCommands>=20 },
    { id:'amnesiac', name:'Забывчивый', desc:'Ввести clear 10 раз', check:s=>(s.commandCounts.clear||0)>=10 },
    { id:'helper', name:'Помощник', desc:'Ввести help 5 раз', check:s=>(s.commandCounts.help||0)>=5 },
    { id:'arion_expert', name:'Арионовед', desc:'Ввести arion 3 раза', check:s=>(s.commandCounts.arion||0)>=3 },
    { id:'neo', name:'Нео', desc:'Ввести matrix', check:s=>s.uniqueCommands.has('matrix') },
    { id:'debugger', name:'Отладчик', desc:'Ввести debug', check:s=>s.uniqueCommands.has('debug') },
    { id:'seeker', name:'Искатель', desc:'5 попыток доступа к секретным командам', check:s=>s.secretAttempts>=5 },
    { id:'zenith_fan', name:'Адепт', desc:'Ввести zenith', check:s=>s.uniqueCommands.has('zenith') },
    { id:'konami_master', name:'Konami-мастер', desc:'Ввести ↑↑↓↓←→←→BA', check:s=>s.konamiDone },
    { id:'centurion', name:'Центурион', desc:'Ввести 100 уникальных команд', check:s=>s.uniqueCommands.size>=100 },
    { id:'completionist', name:'Перфекционист', desc:'Получить 20 достижений', check:s=>Object.keys(s.unlocked).length>=20 },
    { id:'secret_reader', name:'Тайный читатель', desc:'Прочитать .secret файл', check:s=>[...s.filesRead].some(p=>p.endsWith('.secret')) },
    { id:'hacker', name:'Хакер', desc:'Выиграть в hack', check:()=>false },
    { id:'guesser', name:'Знаток', desc:'Набрать 4+ в guess', check:()=>false },
    { id:'stage1_complete', name:'Всё под контролем', desc:'Получить все достижения I этапа', check:s=>ACHIEVEMENTS.filter(a=>(a.stage||1)===1 && !a.stageEnd).every(a=>s.unlocked[a.id]), stage:1, stageEnd:1 }
];

// ============================================================================
//                          ДВИЖОК ТЕРМИНАЛА
// ============================================================================

const output = document.getElementById('output');
const input = document.getElementById('input');
const terminal = document.getElementById('terminal');
const statusbar = document.getElementById('statusbar');
const footer = document.getElementById('footer');
const popup = document.getElementById('achievement-popup');

// ---------- Состояние (загружается из localStorage) ----------
const state = {
    commands:0,
    uniqueCommands:new Set(),
    commandCounts:{},
    scpsViewed:new Set(),
    classesViewed:new Set(),
    orgsViewed:new Set(),
    pagesOpened:new Set(),
    themesChanged:0,
    filesRead:new Set(),
    wrongCommands:0,
    secretAttempts:0,
    konamiDone:false,
    unlocked:{},
    history:[],
    historyIndex:-1,
    cwd:'/',
    theme:CONFIG.defaultTheme,
    sound:true,
    game:null,
};

// Загрузка сохранений
try {
    const saved = JSON.parse(localStorage.getItem('scp_term_state') || 'null');
    if (saved) {
        state.unlocked = saved.unlocked || {};
        state.history = saved.history || [];
        state.theme = saved.theme || CONFIG.defaultTheme;
        state.scpsViewed = new Set(saved.scpsViewed || []);
        state.classesViewed = new Set(saved.classesViewed || []);
        state.orgsViewed = new Set(saved.orgsViewed || []);
        state.pagesOpened = new Set(saved.pagesOpened || []);
        state.filesRead = new Set(saved.filesRead || []);
        state.themesChanged = saved.themesChanged || 0;
        state.konamiDone = saved.konamiDone || false;
        state.commandCounts = saved.commandCounts || {};
        state.commands = saved.commands || 0;
        state.uniqueCommands = new Set(saved.uniqueCommands || []);
        state.wrongCommands = saved.wrongCommands || 0;
        state.secretAttempts = saved.secretAttempts || 0;
        if (saved.sound!==undefined) state.sound=saved.sound;
    }
} catch(e) {}

function saveState() {
    try {
        localStorage.setItem('scp_term_state', JSON.stringify({
            unlocked:state.unlocked,
            history:state.history.slice(-50),
            theme:state.theme,
            scpsViewed:[...state.scpsViewed],
            classesViewed:[...state.classesViewed],
            orgsViewed:[...state.orgsViewed],
            pagesOpened:[...state.pagesOpened],
            filesRead:[...state.filesRead],
            themesChanged:state.themesChanged,
            konamiDone:state.konamiDone,
            commandCounts:state.commandCounts,
            commands:state.commands,
            uniqueCommands:[...state.uniqueCommands],
            wrongCommands:state.wrongCommands,
            secretAttempts:state.secretAttempts,
            sound:state.sound,
        }));
    } catch(e) {}
}

// ---------- Вывод ----------
function printLine(text = '', cls = '') {
    const div = document.createElement('div');
    div.className = 'line ' + cls;
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
}
function print(text = '', cls = '') {
    String(text).split('\n').forEach(l => printLine(l, cls));
}
const rand = a => a[Math.floor(Math.random()*a.length)];
let busy=false, skipType=false;

function typeLine(text, cls='', delay=18){
  return new Promise(res=>{
    const div=document.createElement('div'); div.className='line '+cls; output.appendChild(div);
    let i=0;
    const t=setInterval(()=>{
      if(skipType) i=text.length; else { i++; if(i%3===0) sfx('key'); }
      div.textContent=text.slice(0,i);
      output.scrollTop=output.scrollHeight;

let audioCtx=null;
function sfx(type){
  if(state.sound===false) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const P={key:[900,.02,'square',.02],enter:[500,.05,'square',.04],error:[140,.25,'sawtooth',.06],
             ach:[880,.35,'sine',.08],glitch:[60,.3,'sawtooth',.05],
             stageA:[1047,.4,'sine',.1],stageB:[1319,.4,'sine',.1],stageC:[1568,.9,'sine',.12]}[type];
    if(!P) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.frequency.value=P[0]; o.type=P[2]; g.gain.value=P[3];
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+P[1]);
    o.start(); o.stop(audioCtx.currentTime+P[1]);
  }catch(e){}
}

// ---------- Нормализированный путь (для cd + cat) ----------
function normPath(path){
    const out = [];
    for (const p of path.split('/')) {
        if (!p || p === '.') continue;
        if (p === '..') { out.pop(); continue; }
        out.push(p);
    }
    return '/' + out.join('/');
}

const ROMAN=['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
const fsClass=(name,node)=> node.type==='dir' ? 'warn' : name.endsWith('.secret') ? 'success' : name.endsWith('.enc') ? 'error' : 'dim';
function normalizeId(id) {
    return String(id).replace(/^scp-?/i, '').trim().padStart(3, '0');
}
function getClass(id) { return SCP_CLASSES.find(c => c.id === id); }
function getRisk(id) { return RISK_CLASSES.find(r => r.id === id); }
function getSCP(id) { return SCP_OBJECTS.find(s => s.id === normalizeId(id)); }
function dateKey(s){ const m=String(s).match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); return m?`${+m[1]}.${+m[2]}.${+m[3]%100}`:null; }

// ---------- Levenshtein для подсказки опечаток ----------
function levenshtein(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    const m = [];
    for (let i = 0; i <= b.length; i++) m[i] = [i];
    for (let j = 0; j <= a.length; j++) m[0][j] = j;
    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            m[i][j] = b[i-1] === a[j-1]
                ? m[i-1][j-1]
                : Math.min(m[i-1][j-1]+1, m[i][j-1]+1, m[i-1][j]+1);
        }
    }
    return m[b.length][a.length];
}

// ---------- Работа с ФС ----------
function resolvePath(path) {
    if (!path || path === '/') return { node:FILESYSTEM, path:'/' };
    const parts = path.replace(/^\//, '').split('/').filter(Boolean);
    let cur = FILESYSTEM, curPath = '/';
    for (const p of parts) {
        if (cur.type !== 'dir' || !cur.children[p]) return null;
        cur = cur.children[p];
        curPath = curPath === '/' ? '/' + p : curPath + '/' + p;
    }
    return { node:cur, path:curPath };
}

            // катакана (полуширинная) + цифры + латиница + кириллица + символы
            const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ'

                        + '<>[]{}=+*/|#$%&@:;?!';
            const pick = () => chars[Math.floor(Math.random()*chars.length)];
    
            const fs = 16;
            const cols = Math.ceil(cvs.width/fs);
            const rows = Math.ceil(cvs.height/fs);
            const color = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim() || '#00ff41';
    
            // у каждого столбца своя позиция (часть стартует выше экрана) и скорость
            const drops  = Array.from({length:cols}, () => -Math.random()*rows);
            const speeds = Array.from({length:cols}, () => 0.3 + Math.random()*0.9);
            const lastRow = Array(cols).fill(-1);
    
            ctx.font = fs + 'px monospace';
            const timer = setInterval(()=>{
                ctx.fillStyle = 'rgba(0,0,0,0.08)';        // длинный затухающий шлейф
                ctx.fillRect(0,0,cvs.width,cvs.height);
    
                for (let i=0;i<cols;i++) {
                    const row = Math.floor(drops[i]);
                    if (row >= 0 && row !== lastRow[i]) {
                        // предыдущая клетка становится обычной (цветной)
                        if (row > 0) {
                            ctx.fillStyle = color;
                            ctx.fillText(pick(), i*fs, (row-1)*fs);
                        }
                        // «голова» капли почти белая
                        ctx.fillStyle = '#e8fff0';
                        ctx.fillText(pick(), i*fs, row*fs);
                        lastRow[i] = row;
                    }
                    drops[i] += speeds[i];
                    if (drops[i] > rows && Math.random() > 0.96) {
                        drops[i] = -Math.random()*20;       // новая капля через случайную паузу
                        speeds[i] = 0.3 + Math.random()*0.9;
                        lastRow[i] = -1;
                    }
                }
            }, 50);
            setTimeout(()=>{ clearInterval(timer); overlay.remove(); }, 6000);
        }
    },

let SESSION_START = Date.now();

async function processCommand(raw) {
    let cmd = raw.trim();
    if (!cmd) return;

    // активная игра/подтверждение перехватывает ввод
    if (state.game) {
        busy=true; skipType=false;
        try { await state.game.onInput(cmd); } finally { busy=false; }
        return;
    }

    state.commands++;
    state.uniqueCommands.add(cmd.toLowerCase());
    state.history.push(cmd);
    state.historyIndex = state.history.length;

    // алиасы
    const f0 = cmd.split(/\s+/)[0].toLowerCase();
    if (ALIASES[f0]) cmd = ALIASES[f0] + cmd.slice(f0.length);

    const first = cmd.split(/\s+/)[0].toLowerCase();
    if (Object.hasOwn(COMMANDS, first)) state.commandCounts[first] = (state.commandCounts[first] || 0) + 1;

    busy=true; skipType=false;
    try {
        if (cmd.toLowerCase() === 'code red') { await cmdAlert(); }
        else {
            const parts = cmd.split(/\s+/);
            const name = parts[0].toLowerCase();
            const args = parts.slice(1);
            const command = Object.hasOwn(COMMANDS, name) ? COMMANDS[name] : null;
            if (!command) {
                let best=null, bestDist=3;
                Object.keys(COMMANDS).forEach(k=>{ const d=levenshtein(name,k); if(d<bestDist){bestDist=d;best=k;} });
                state.wrongCommands++; sfx('error');
                print(best ? `Команда «${name}» не найдена. Возможно, вы имели в виду «${best}»?`
                           : `Команда «${name}» не найдена. Введите «help».`, 'error');
            } else {
                try { await command.handler(args); } catch(e) { print('Ошибка выполнения: '+e.message,'error'); }
            }
        }
    } finally { busy=false; }
    saveState();
    checkAchievements();
}

const SUBCOMMANDS = {
    scp:['list','show','search','random','stats','date'],
    class:['list','risk'],
    org:['list'],
    theme:['green','amber','white'],
    open:Object.keys(PAGE_MAP),
    arion:['phase'],

};

input.addEventListener('keydown', e => {
    if (busy) { e.preventDefault(); skipType=true; return; }
    if (e.key.length===1 && !e.ctrlKey) sfx('key');
    if (e.key === 'Enter') {
        sfx('enter');
        const val = input.value;
        if (val.trim()) {
            printLine(CONFIG.prompt + val, 'input');
            processCommand(val);
        }
        input.value = '';
        state.historyIndex = state.history.length;
        e.preventDefault();
    } else if (e.key === 'Tab') {
        e.preventDefault();
        autocomplete();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.historyIndex > 0) {
            state.historyIndex--;
            input.value = state.history[state.historyIndex];
        }
    } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.historyIndex < state.history.length - 1) {
            state.historyIndex++;
            input.value = state.history[state.historyIndex];
        } else {
            state.historyIndex = state.history.length;
            input.value = '';
        }
    } else if (e.key === 'l' && e.ctrlKey) {
        e.preventDefault();
        output.innerHTML = '';
    } else if (e.key === 'c' && e.ctrlKey) {
        state.game=null;
        e.preventDefault();
        input.value = '';
    }
});

function autocomplete() {
    const val = input.value;
    const parts = val.trim().split(/\s+/);
    if (!parts[0]) return;
    if (parts.length === 1) {
        const prefix = parts[0].toLowerCase();
        const matches = Object.keys(COMMANDS).filter(c => c.startsWith(prefix));
        if (matches.length === 1) {
            input.value = matches[0] + ' ';
        } else if (matches.length > 1) {
            printLine('  ' + matches.join('  '), 'dim');
        }
    } else {
        const first = parts[0].toLowerCase();
        const subs = SUBCOMMANDS[first];
        if (!subs) return;
        const last = parts[parts.length-1].toLowerCase();
        const matches = subs.filter(s => s.startsWith(last));
        if (matches.length === 1) {
            parts[parts.length-1] = matches[0];
            input.value = parts.join(' ') + ' ';
        } else if (matches.length > 1) {
            printLine('  ' + matches.join('  '), 'dim');
        }
    }
}

// ============================================================================
//  ВООТ И ИНИЦИАЛИЗАЦИЯ
// ============================================================================

let booting = true;
document.addEventListener('click', () => { booting = false; });
document.addEventListener('keydown', () => { booting = false; });

async function boot() {
    const lines = [
        'FOUNDATION BIOS v2.1.4',
        'Memory check .......... OK',
        'Boot device: /dev/zenith-01',
        'Loading kernel ............ done',
        'Mounting /secure .......... OK',
        'Verifying signature ....... OK',
        'Handshake with NODE: ZENITH-01 ............ ACCEPTED',
        'Authentication: guest (read-only)',
        '',
        "Type 'help' to list available commands. '??' for hint."
    ];
    for (const l of lines) {
        printLine(l);
        if (booting) await new Promise(r => setTimeout(r, CONFIG.bootSpeed));
    }
    booting = false;
    input.focus();
    checkAchievements();
}

function init() {
    document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('header-text').textContent = `FOUNDATION SECURE TERMINAL — ${CONFIG.version}`;
    setStatus(true);
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    // footer обновим интервалом
    setInterval(() => {
        const t = Math.floor((Date.now()-SESSION_START)/1000);
        const d = Math.floor(t/86400), h = Math.floor((t%86400)/3600);
        const cpu = 10 + Math.floor(Math.random()*8);
        const mem = (3 + Math.random()).toFixed(1);
        footer.textContent = `[▮▮▮▮▯] CPU ${cpu}% · MEM ${mem} GB · UPTIME ${d}d ${h}h`;
    }, 3000);

    scheduleRandom(glitchEvent, 60000, 180000);   // редкие глюки
    scheduleRandom(nightEvent, 30000, 90000);     // ночные события (только 23:00–06:00)
  
    boot();
}

init();
</script>
