<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis · Прогнозы и аналитика</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ----- общие стили ----- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: radial-gradient(ellipse at 50% 20%, #0a1220, #050810);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-menu {
            width: 100%;
            background: rgba(10, 18, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 150, 220, 0.2);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6a8ec4, #4a6a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(74,106,158,0.3);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: #8ab4d4;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: #6a8ec4;
            border-bottom-color: #6a8ec4;
        }
        .top-menu .right-info {
            font-size: 13px;
            color: #4a6a8a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a8ec4;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(74,142,196,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }

        /* ----- контент ----- */
        .analysis-content {
            max-width: 1400px;
            width: 100%;
            padding: 30px 24px 20px;
        }
        .analysis-content h1 {
            font-size: 36px;
            font-weight: 700;
            color: #b0d4f0;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .analysis-content .subhead {
            font-size: 16px;
            color: #6a8a9e;
            margin-bottom: 28px;
        }

        /* ----- график нефти ----- */
        .oil-card {
            background: rgba(10, 22, 40, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(74, 142, 196, 0.1);
            padding: 18px 20px 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            margin-bottom: 28px;
        }
        .oil-card h3 {
            font-size: 15px;
            font-weight: 500;
            color: #8ab4d4;
            margin-bottom: 10px;
        }
        .oil-card .chart-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .oil-card .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ----- таймлайн (как в Арионе) ----- */
        .timeline-wrapper {
            background: rgba(10, 22, 40, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(74, 142, 196, 0.1);
            padding: 20px 22px 22px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .timeline-wrapper .tl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .timeline-wrapper .tl-header h3 {
            font-size: 17px;
            font-weight: 500;
            color: #b0d4f0;
        }
        .timeline-wrapper .tl-header .tl-filter {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .timeline-wrapper .tl-header .tl-filter label {
            font-size: 13px;
            color: #6a8a9e;
        }
        .timeline-wrapper .tl-header .tl-filter select {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(74,142,196,0.2);
            color: #b0c4de;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .timeline-wrapper .tl-header .tl-filter select:hover {
            border-color: #4a8ec4;
        }

        .timeline-track {
            position: relative;
            height: 70px;
            width: 100%;
            padding: 0 2%;
            display: flex;
            align-items: center;
            overflow-x: auto;
            gap: 0;
        }
        .timeline-track .tl-line {
            position: absolute;
            top: 50%;
            left: 2%;
            right: 2%;
            height: 3px;
            background: #2a3a5a;
            border-radius: 4px;
            transform: translateY(-50%);
            z-index: 1;
        }
        .timeline-track .tl-line .tl-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #4a8ec4, #6a8ec4);
            width: 0%;
            transition: width 0.6s ease;
        }
        .timeline-track .tl-dot-wrap {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 0 8px;
        }
        .timeline-track .tl-dot-wrap:hover {
            transform: translateY(-4px);
        }
        .timeline-track .tl-dot-wrap .tl-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 16px rgba(0,0,0,0.4);
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .timeline-track .tl-dot-wrap .tl-dot.important {
            background: #f5b041;
            border-color: #f5b041;
            box-shadow: 0 0 24px rgba(245,176,65,0.4);
        }
        .timeline-track .tl-dot-wrap .tl-dot.danger {
            background: #e74c3c;
            border-color: #e74c3c;
            box-shadow: 0 0 24px rgba(231,76,60,0.4);
        }
        .timeline-track .tl-dot-wrap .tl-dot.default {
            background: #4a6a8a;
            border-color: #4a6a8a;
        }
        .timeline-track .tl-dot-wrap .tl-label {
            font-size: 10px;
            color: #6a8a9e;
            text-align: center;
            max-width: 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .timeline-track .tl-dot-wrap .tl-date {
            font-size: 10px;
            color: #8ab4d4;
            font-weight: 500;
        }
        .timeline-track .tl-now {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .timeline-track .tl-now .tl-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4cd9a0;
            border: 2px solid #4cd9a0;
            box-shadow: 0 0 30px rgba(76,217,160,0.5);
            animation: pulse-dot 1.6s ease-in-out infinite;
            margin-bottom: 4px;
        }
        .timeline-track .tl-now .tl-label {
            font-size: 10px;
            color: #4cd9a0;
            font-weight: 600;
        }

        /* ----- прогнозы (очень подробные) ----- */
        .forecast-block {
            background: rgba(10, 22, 40, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(74, 142, 196, 0.1);
            padding: 18px 22px 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .forecast-block h3 {
            font-size: 17px;
            font-weight: 500;
            color: #b0d4f0;
            margin-bottom: 12px;
        }
        .forecast-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .forecast-item {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .forecast-item:hover {
            background: rgba(0,0,0,0.35);
        }
        .forecast-item .f-title {
            font-size: 14px;
            font-weight: 600;
            color: #8ab4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .forecast-item .f-title .f-toggle {
            font-size: 12px;
            color: #4a6a8a;
            transition: transform 0.2s;
        }
        .forecast-item .f-title .f-toggle.open {
            transform: rotate(180deg);
        }
        .forecast-item .f-summary {
            font-size: 13px;
            color: #8ab4d4;
            margin: 2px 0 4px;
        }
        .forecast-item .f-detail {
            display: none;
            margin-top: 8px;
            font-size: 14px;
            color: #b0c4de;
            line-height: 1.7;
        }
        .forecast-item .f-detail.open {
            display: block;
        }
        .forecast-item .f-detail .scenario {
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            border-left: 4px solid #4a8ec4;
        }
        .forecast-item .f-detail .scenario .s-title {
            font-weight: 600;
            font-size: 15px;
            color: #b0d4f0;
        }
        .forecast-item .f-detail .scenario .s-desc {
            margin-top: 4px;
            font-size: 14px;
            color: #8ab4d4;
            line-height: 1.6;
        }

        /* ----- версия ----- */
        .version {
            text-align: center;
            font-size: 12px;
            color: #3a5a6a;
            padding: 16px 0 8px;
            border-top: 1px solid rgba(74,142,196,0.05);
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        /* ----- адаптив ----- */
        @media (max-width: 820px) {
            .top-menu { padding: 10px 16px; flex-direction: column; align-items: stretch; gap:8px; }
            .top-menu .nav-links { justify-content: center; }
            .analysis-content { padding: 20px 12px; }
            .forecast-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .analysis-content h1 { font-size: 26px; }
            .timeline-track { padding: 0; }
            .timeline-track .tl-dot-wrap { margin: 0 4px; }
            .timeline-track .tl-dot-wrap .tl-label { max-width: 40px; font-size: 8px; }
            .timeline-track .tl-dot-wrap .tl-date { font-size: 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== ВЕРХНЕЕ МЕНЮ ===== -->
    <header class="top-menu">
        <div class="logo analysis">Analysis</div>
        <nav class="nav-links">
            <a href="index.html">Главная</a>
            <a href="arion.html">Arion</a>
            <a href="analysis.html" class="active">Аналитика</a>
        </nav>
        <div class="right-info">
            <span class="dot"></span>
            <span id="headerTime">—</span>
        </div>
    </header>

    <!-- ===== КОНТЕНТ ===== -->
    <main class="analysis-content">

        <h1>Аналитика и прогнозы</h1>
        <div class="subhead">Закулисье, август–сентябрь 2026 — данные, тренды, прогнозы</div>

        <!-- ===== НЕФТЬ (с подписями значений) ===== -->
        <div class="oil-card">
            <h3>🛢️ Цена нефти (USD/барр.) — апрель–август</h3>
            <div class="chart-wrapper">
                <canvas id="oilChart"></canvas>
            </div>
        </div>

        <!-- ===== ТАЙМЛАЙН (как в Арионе) ===== -->
        <div class="timeline-wrapper">
            <div class="tl-header">
                <h3>📅 Таймлайн ключевых событий</h3>
                <div class="tl-filter">
                    <label for="monthFilter">Показать:</label>
                    <select id="monthFilter">
                        <option value="all">Все месяцы</option>
                        <option value="8">Август</option>
                        <option value="9">Сентябрь</option>
                    </select>
                </div>
            </div>
            <div class="timeline-track" id="timelineTrack">
                <div class="tl-line"><div class="tl-fill" id="tlFill"></div></div>
                <!-- точки будут вставлены JS -->
            </div>
        </div>

        <!-- ===== ПРОГНОЗЫ (очень подробные) ===== -->
        <div class="forecast-block">
            <h3>🔮 Детальные прогнозы на сентябрь (нажмите для раскрытия)</h3>
            <div class="forecast-grid" id="forecastGrid">
                <!-- будут вставлены JS -->
            </div>
        </div>

        <!-- ===== ВЕРСИЯ ===== -->
        <div class="version">v1.2.1</div>

    </main>

    <script>
        // ============================================================
        //  VERSION: v1.2.1
        // ============================================================

        // ============================================================
        //  DATA
        // ============================================================

        // Цена нефти
        const oilData = [
            { month: 'апрель.26', value: 0 },
            { month: 'май.26', value: 180 },
            { month: 'июнь.26', value: 266 },
            { month: 'июль.26', value: 704 },
            { month: 'август.26', value: 788 }
        ];

        // События для таймлайна
        const timelineEvents = [
            { date: '2026-08-01', title: 'Капитуляция Тусовщиков', important: true, desc: 'Завершение 20-дневной войны. Тусовщики безоговорочно капитулировали. Война официально завершена.' },
            { date: '2026-08-02', title: 'Уничтожение Миротворцев', important: false, desc: '86 Тусовщиков-Миротворцев ликвидированы. «Орден Доблести» вводит тотальные санкции против Тусовщиков.' },
            { date: '2026-08-13', title: 'Переворот у Фогов', important: true, danger: true, desc: 'Толпа растерзала Главаря Фогов и высшее командование. Новый лидер — бывший Рейхсфюрер СС. Введены эсэсовские ранги и приветствие «Зиг хайль».' },
            { date: '2026-08-18', title: 'Вторжение Эндера', important: true, danger: true, desc: '48 млн Эндер-Существ атакуют Мурино. Город стерт с лица земли. Объект 226 возвращён, портал временно закрыт.' },
            { date: '2026-08-22', title: 'Начало войны Смертомолей/Спортиков', important: true, desc: 'Смертомоли вторгаются на территорию Спортиков. Начинается масштабный конфликт с огромными потерями.' },
            { date: '2026-08-26', title: 'Бактерии предают Спортиков', important: true, desc: 'Бактерии отказываются быть спонсорами Спортиков, оставляя их без поддержки в критический момент.' },
            { date: '2026-08-29', title: 'Шахтёры покидают «Орден»', important: true, desc: 'Шахтёры выходят из союза, уходя в полную изоляцию. Раскол в «Ордене Доблести» становится реальностью.' },
            { date: '2026-09-01', title: 'Рекордные потери', important: true, danger: true, desc: 'Погибло 759 346 Смертомолей и 10 203 668 Спортиков за один день. Война достигает пика жестокости.' },
            { date: '2026-09-02', title: 'Пик жестокости', important: true, danger: true, desc: '685 403 Смертомоли и 16 998 753 Спортика погибли. Конфликт выходит на новый уровень разрушения.' }
        ];

        // Прогнозы (очень подробные)
        const forecasts = [{
            title: '🛢️ Цена нефти',
            summary: 'Консолидация в диапазоне $780–820, возможен рост при перемирии',
            detail: 'Рынок нефти входит в фазу стабилизации после бурного августа, когда цена выросла с 704 до 788 долларов за баррель. Основными драйверами роста стали завершение Тусовщико-Занудской войны (1 августа) и восстановление торговли. Однако новые угрозы — война Смертомолей и Спортиков, а также нестабильность в регионе Фогов — удерживают рынок от резкого скачка. Спрос остаётся высоким благодаря сезонному фактору и запуску оборонных проектов. Тем не менее, риски эскалации и повторного вторжения Эндера создают «премию за страх», которая не даёт ценам упасть ниже 770. Аналитики ожидают, что в первой половине сентября цена будет колебаться в узком коридоре 780–820, а во второй половине, в зависимости от переговоров в «Ордене Доблести», возможен либо пробой вверх (до 850–900 при перемирии), либо обвал до 700–750 в случае ядерной эскалации.',
            scenarios: [
                { title: 'Базовый сценарий (вероятность 55%)',
                desc: 'Цена останется в диапазоне 780–820 USD/барр. Война Смертомолей/Спортиков продолжается, но без сбоев поставок. Восстановление торговли с Тусовщиками и стабилизация портала Эндера удерживают рынок от паники. Инвесторы сохраняют умеренный оптимизм, ожидая перемирия к концу месяца.' },
                { title: 'Оптимистичный сценарий (25%)',
                desc: 'Рост до 850–900 USD/барр. Быстрое перемирие между Смертомолями и Спортиками, полное восстановление торговли, успешное закрытие портала Эндера. Спрос на нефть резко возрастает из-за восстановления промышленности и логистики. Оборонные заказы также стимулируют потребление энергии.' },
                { title: 'Пессимистичный сценарий (20%)',
                desc: 'Падение до 700–750 USD/барр. Эскалация войны Смертомолей до ядерного уровня, новое вторжение Эндера, раскол «Ордена Доблести» и разрыв торговых соглашений. Паника на рынках приводит к обвалу цен, несмотря на сезонный спрос.' }
            ]
        }, {
            title: '⚔️ Война Смертомолей/Спортиков',
            summary: 'Перемирие к концу сентября, высокий риск ядерной эскалации',
            detail: 'Конфликт, начавшийся 22 августа, уже унёс жизни более 129 миллионов существ (31.1 млн Смертомолей и 96.7 млн Спортиков на начало сентября). Ежедневные потери достигают рекордных значений — 1 сентября погибло 759 тысяч Смертомолей и 10.2 млн Спортиков, 2 сентября — 685 тысяч и 17 млн соответственно. Бактерии, предав Спортиков 26 августа, создали трёхсторонний конфликт, что ещё больше усложнило ситуацию. «Орден Доблести» (Зануды, Отстранённые, Безликие и Серости) оказывает давление на все стороны, угрожая санкциями и военным вмешательством. Однако радикальные элементы внутри Смертомолей настаивают на продолжении войны, несмотря на колоссальные потери. Переговоры в Нудограде, начавшиеся 31 августа, пока не дали результатов. Эксперты сходятся во мнении, что к концу сентября стороны будут вынуждены подписать перемирие из-за истощения ресурсов и демографического кризиса, но риск ядерного удара со стороны Бактерий или Смертомолей остаётся крайне высоким (25%).',
            scenarios: [
                { title: 'Базовый сценарий (60%)',
                desc: 'Перемирие к концу сентября под давлением «Ордена Доблести». Спортики соглашаются на уступки, Смертомоли прекращают агрессию. Бактерии ограничиваются экономическими санкциями. Границы фиксируются по линии фронта на 29 августа. Потери превышают 150 млн, но война заканчивается без применения ОМП.' },
                { title: 'Эскалационный (25%)',

        // ============================================================
        //  HELPERS
        // ============================================================

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function getMonth(dateStr) {
            return new Date(dateStr).getMonth() + 1;
        }

        // ============================================================
        //  ГРАФИК НЕФТИ (с подписями значений)
        // ============================================================

        function renderOilChart() {
            const ctx = document.getElementById('oilChart').getContext('2d');
            const labels = oilData.map(d => d.month);
            const values = oilData.map(d => d.value);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Цена нефти',
                        data: values,
                        borderColor: '#ff1493',
                        backgroundColor: 'rgba(255,20,147,0.15)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#ff1493',
                        pointRadius: 6,
                        borderWidth: 2.5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: ctx => ctx.parsed.y + ' USD/барр.' } },
                        // кастомный плагин для подписей значений над точками
                        afterDraw: function(chart) {
                            const meta = chart.getDatasetMeta(0);
                            const data = chart.data.datasets[0].data;
                            const ctx2 = chart.ctx;
                            ctx2.save();
                            ctx2.font = '12px Inter, sans-serif';
                            ctx2.textAlign = 'center';
                            ctx2.textBaseline = 'bottom';
                            meta.data.forEach((element, index) => {
                                const value = data[index];
                                if (value !== undefined) {
                                    const x = element.x;
                                    const y = element.y - 10;
                                    ctx2.fillStyle = '#8ab4d4';
                                    ctx2.fillText(value, x, y);
                                }
                            });
                            ctx2.restore();
                        }
                    },
                    scales: {
                        y: { min: 0, max: 1000, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#6a8a9e',
                                stepSize: 200 } },
                        x: { grid: { display: false }, ticks: { color: '#6a8a9e' } }
                    }
                }
            });
        }

        // ============================================================
        //  ТАЙМЛАЙН
        // ============================================================

        function renderTimeline(filterMonth = 'all') {
            const track = document.getElementById('timelineTrack');
            track.querySelectorAll('.tl-dot-wrap, .tl-now').forEach(el => el.remove());

            const filtered = timelineEvents.filter(e => {
                const m = getMonth(e.date);
                if (filterMonth === 'all') return true;
                return m === parseInt(filterMonth);
            });

            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

            const total = filtered.length;
            const leftMargin = 2;
            const rightMargin = 2;
            const range = 100 - leftMargin - rightMargin;

            filtered.forEach((event, index) => {
                const pos = leftMargin + (index / (total - 1 || 1)) * range;

                const wrap = document.createElement('div');
                wrap.className = 'tl-dot-wrap';
                wrap.style.position = 'absolute';
                wrap.style.left = pos + '%';
                wrap.style.top = '50%';
                wrap.style.transform = 'translate(-50%, -50%)';

                const dot = document.createElement('div');
                dot.className = 'tl-dot';
                if (event.important) dot.classList.add('important');
                if (event.danger) dot.classList.add('danger');
                if (!event.important && !event.danger) dot.classList.add('default');
                wrap.appendChild(dot);

                const dateLabel = document.createElement('div');
                dateLabel.className = 'tl-date';
                dateLabel.textContent = formatDate(event.date);
                wrap.appendChild(dateLabel);

                const label = document.createElement('div');
                label.className = 'tl-label';
                label.textContent = event.title;
                wrap.appendChild(label);

                wrap.addEventListener('click', function() {
                    alert(event.title + '\n\n' + (event.desc || 'Подробное описание события.'));
                });

                track.appendChild(wrap);
            });

            // "Сейчас"
            const nowWrap = document.createElement('div');
            nowWrap.className = 'tl-now';
            nowWrap.style.position = 'absolute';
            nowWrap.style.right = '2%';
            nowWrap.style.top = '50%';
            nowWrap.style.transform = 'translateY(-50%)';

            const nowDot = document.createElement('div');
            nowDot.className = 'tl-dot';
            nowWrap.appendChild(nowDot);

            const nowLabel = document.createElement('div');
            nowLabel.className = 'tl-label';
            nowLabel.textContent = 'Сейчас';
            nowWrap.appendChild(nowLabel);

            track.appendChild(nowWrap);
        }

        // ============================================================
        //  ПРОГНОЗЫ (очень подробные)
        // ============================================================

        function renderForecasts() {
            const container = document.getElementById('forecastGrid');
            container.innerHTML = '';

            forecasts.forEach((f) => {
                const item = document.createElement('div');
                item.className = 'forecast-item';

                const title = document.createElement('div');
                title.className = 'f-title';
                title.innerHTML = `${f.title} <span class="f-toggle">▼</span>`;
                title.addEventListener('click', function() {
                    const detail = item.querySelector('.f-detail');
                    const toggle = this.querySelector('.f-toggle');
                    detail.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
                item.appendChild(title);

                const summary = document.createElement('div');
                summary.className = 'f-summary';
                summary.textContent = f.summary;
                item.appendChild(summary);

                const detail = document.createElement('div');
                detail.className = 'f-detail';
                // Основной текст
                const mainDesc = document.createElement('div');
                mainDesc.style.marginBottom = '12px';
                mainDesc.textContent = f.detail;
                detail.appendChild(mainDesc);

                // Сценарии
                f.scenarios.forEach(s => {
                    const sc = document.createElement('div');
                    sc.className = 'scenario';
                    sc.innerHTML = `
                        <div class="s-title">${s.title}</div>
                        <div class="s-desc">${s.desc}</div>
                    `;
                    detail.appendChild(sc);
                });

                item.appendChild(detail);
                container.appendChild(item);
            });
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        function init() {
            // Время в шапке
            function updateHeaderTime() {
                const now = new Date();
                document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);

            // Нефть
            renderOilChart();

            // Таймлайн
            const filterSelect = document.getElementById('monthFilter');
            renderTimeline('all');
            filterSelect.addEventListener('change', function() {
                renderTimeline(this.value);
            });

            // Прогнозы
            renderForecasts();
        }

        document.addEventListener('DOMContentLoaded', init);

        // ============================================================
        //  VERSION: v1.2.1
        // ============================================================
    </script>
</body>
