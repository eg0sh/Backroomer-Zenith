<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analysis · Прогнозы и аналитика</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ----- общие стили ----- */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: radial-gradient(ellipse at 50% 20%, #0a1220, #050810);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #e8edf5;
            min-height: 100vh;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .top-menu {
            width: 100%;
            background: rgba(10, 18, 32, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(100, 150, 220, 0.2);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
        }
        .top-menu .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #6a8ec4, #4a6a9e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            text-shadow: 0 0 30px rgba(74,106,158,0.3);
        }
        .top-menu .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .top-menu .nav-links a {
            color: #8ab4d4;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            padding: 6px 2px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .top-menu .nav-links a:hover,
        .top-menu .nav-links a.active {
            color: #6a8ec4;
            border-bottom-color: #6a8ec4;
        }
        .top-menu .right-info {
            font-size: 13px;
            color: #4a6a8a;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-menu .right-info .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a8ec4;
            animation: pulse-dot 2s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(74,142,196,0.4);
        }
        @keyframes pulse-dot {
            0%,100% { opacity:1; transform:scale(1); }
            50% { opacity:0.3; transform:scale(0.7); }
        }

        /* ----- контент ----- */
        .analysis-content {
            max-width: 1400px;
            width: 100%;
            padding: 30px 24px 20px;
        }
        .analysis-content h1 {
            font-size: 36px;
            font-weight: 700;
            color: #b0d4f0;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .analysis-content .subhead {
            font-size: 16px;
            color: #6a8a9e;
            margin-bottom: 28px;
        }

        /* ----- график нефти ----- */
        .oil-card {
            background: rgba(10, 22, 40, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(74, 142, 196, 0.1);
            padding: 18px 20px 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
            margin-bottom: 28px;
        }
        .oil-card h3 {
            font-size: 15px;
            font-weight: 500;
            color: #8ab4d4;
            margin-bottom: 10px;
        }
        .oil-card .chart-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
        }
        .oil-card .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ----- прогнозы (очень подробные) ----- */
        .forecast-block {
            background: rgba(10, 22, 40, 0.6);
            backdrop-filter: blur(6px);
            border-radius: 20px;
            border: 1px solid rgba(74, 142, 196, 0.1);
            padding: 18px 22px 20px;
            margin-bottom: 28px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        .forecast-block h3 {
            font-size: 17px;
            font-weight: 500;
            color: #b0d4f0;
            margin-bottom: 12px;
        }
        .forecast-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .forecast-item {
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .forecast-item:hover {
            background: rgba(0,0,0,0.35);
        }
        .forecast-item .f-title {
            font-size: 14px;
            font-weight: 600;
            color: #8ab4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .forecast-item .f-title .f-toggle {
            font-size: 12px;
            color: #4a6a8a;
            transition: transform 0.2s;
        }
        .forecast-item .f-title .f-toggle.open {
            transform: rotate(180deg);
        }
        .forecast-item .f-summary {
            font-size: 13px;
            color: #8ab4d4;
            margin: 2px 0 4px;
        }
        .forecast-item .f-detail {
            display: none;
            margin-top: 8px;
            font-size: 14px;
            color: #b0c4de;
            line-height: 1.7;
        }
        .forecast-item .f-detail.open {
            display: block;
        }
        .forecast-item .f-detail .scenario {
            margin-top: 10px;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border-radius: 10px;
            border-left: 4px solid #4a8ec4;
        }
        .forecast-item .f-detail .scenario .s-title {
            font-weight: 600;
            font-size: 15px;
            color: #b0d4f0;
        }
        .forecast-item .f-detail .scenario .s-desc {
            margin-top: 4px;
            font-size: 14px;
            color: #8ab4d4;
            line-height: 1.6;
        }

        /* ----- версия ----- */
        .version {
            text-align: center;
            font-size: 12px;
            color: #3a5a6a;
            padding: 16px 0 8px;
            border-top: 1px solid rgba(74,142,196,0.05);
            margin-top: 12px;
            letter-spacing: 0.3px;
        }

        }

    </style>
</head>
<body>

    <header class="top-menu">

    </main>

    <script>
        // ============================================================
        //  VERSION: v1.2.1
        // ============================================================

        // ============================================================
        //  DATA
        // ============================================================

        // Цена нефти
        const oilData = [
            { month: 'апрель.26', value: 0 },
            { month: 'май.26', value: 180 },
            { month: 'июнь.26', value: 266 },
            { month: 'июль.26', value: 704 },
            { month: 'август.26', value: 788 }
        ];

        // Прогнозы (очень подробные, без упоминания Уровней)
        const forecasts = [{
            title: '🛢️ Цена нефти',
            summary: 'Консолидация в диапазоне $780–820, возможен рост при перемирии',
            detail: 'Рынок нефти входит в фазу стабилизации после бурного августа, когда цена выросла с 704 до 788 долларов за баррель. Основными драйверами роста стали завершение Тусовщико-Занудской войны (1 августа) и восстановление торговли. Однако новые угрозы — война Смертомолей и Спортиков, а также нестабильность в регионе Фогов — удерживают рынок от резкого скачка. Спрос остаётся высоким благодаря сезонному фактору и запуску оборонных проектов. Тем не менее, риски эскалации и повторного вторжения Эндера создают «премию за страх», которая не даёт ценам упасть ниже 770. Аналитики ожидают, что в первой половине сентября цена будет колебаться в узком коридоре 780–820, а во второй половине, в зависимости от переговоров в «Ордене Доблести», возможен либо пробой вверх (до 850–900 при перемирии), либо обвал до 700–750 в случае ядерной эскалации.',
            scenarios: [
                { title: 'Базовый сценарий (вероятность 55%)',
                desc: 'Цена останется в диапазоне 780–820 USD/барр. Война Смертомолей/Спортиков продолжается, но без сбоев поставок. Восстановление торговли с Тусовщиками и стабилизация портала Эндера удерживают рынок от паники. Инвесторы сохраняют умеренный оптимизм, ожидая перемирия к концу месяца.' },
                { title: 'Оптимистичный сценарий (25%)',
                desc: 'Рост до 850–900 USD/барр. Быстрое перемирие между Смертомолями и Спортиками, полное восстановление торговли, успешное закрытие портала Эндера. Спрос на нефть резко возрастает из-за восстановления промышленности и логистики. Оборонные заказы также стимулируют потребление энергии.' },
                { title: 'Пессимистичный сценарий (20%)',
                desc: 'Падение до 700–750 USD/барр. Эскалация войны Смертомолей до ядерного уровня, новое вторжение Эндера, раскол «Ордена Доблести» и разрыв торговых соглашений. Паника на рынках приводит к обвалу цен, несмотря на сезонный спрос.' }
            ]
        }, {
            title: '⚔️ Война Смертомолей/Спортиков',
            summary: 'Перемирие к концу сентября, высокий риск ядерной эскалации',
            detail: 'Конфликт, начавшийся 22 августа, уже унёс жизни более 129 миллионов существ (31.1 млн Смертомолей и 96.7 млн Спортиков на начало сентября). Ежедневные потери достигают рекордных значений — 1 сентября погибло 759 тысяч Смертомолей и 10.2 млн Спортиков, 2 сентября — 685 тысяч и 17 млн соответственно. Бактерии, предав Спортиков 26 августа, создали трёхсторонний конфликт, что ещё больше усложнило ситуацию. «Орден Доблести» (Зануды, Отстранённые, Безликие и Серости) оказывает давление на все стороны, угрожая санкциями и военным вмешательством. Однако радикальные элементы внутри Смертомолей настаивают на продолжении войны, несмотря на колоссальные потери. Переговоры в Нудограде, начавшиеся 31 августа, пока не дали результатов. Эксперты сходятся во мнении, что к концу сентября стороны будут вынуждены подписать перемирие из-за истощения ресурсов и демографического кризиса, но риск ядерного удара со стороны Бактерий или Смертомолей остаётся крайне высоким (25%).',
            scenarios: [
                { title: 'Базовый сценарий (60%)',
                desc: 'Перемирие к концу сентября под давлением «Ордена Доблести». Спортики соглашаются на уступки, Смертомоли прекращают агрессию. Бактерии ограничиваются экономическими санкциями. Границы фиксируются по линии фронта на 29 августа. Потери превышают 150 млн, но война заканчивается без применения ОМП.' },
                { title: 'Эскалационный (25%)',
                desc: 'Ядерный удар Бактерий по городам Спортиков — тотальная война. Бактерии, разорвав все соглашения, наносят массированный ракетный удар по ключевым центрам Спортиков. В ответ Спортики активируют скрытые арсеналы. «Орден Доблести» вводит войска, конфликт перерастает в глобальную катастрофу с участием всех крупных рас.' },
                { title: 'Мирный (15%)',
                desc: 'Неожиданный компромисс: Смертомоли отдают часть территорий, Спортики снимают претензии, Бактерии отзывают ультиматум. Прекращение огня уже в первую неделю сентября. Обе стороны соглашаются на демилитаризованную зону под контролем «Ордена». Восстановление начинается немедленно.' }
            ]
        }, {
            title: '🌌 Угроза Эндера',
            summary: 'Временное затишье, но портал не закрыт полностью — требуется добыча 11 Ок Эндера',
            detail: 'Вторжение 18 августа, когда 48 млн Эндер-Существ уничтожили город Мурино, стало шоком для всего Закулисья. Благодаря возвращению Объекта 226 и его героическим действиям (создание гигантских грибов, уничтоживших тысячи врагов), портал был временно заблокирован. Однако, как выяснилось, это лишь отсрочка. Объект 226 сообщил, что для полного закрытия портала необходимо добыть ещё 11 Ок Эндера — артефактов, разбросанных по разным территориям. Процесс их поиска и извлечения займёт не менее месяца. В сентябре ожидается временное затишье, но любое промедление или ошибка могут привести к повторному вторжению. Учёные Зануд и Отстранённых работают над созданием защитного периметра, но ресурсов катастрофически не хватает. Риск повторного вторжения оценивается в 20% в сентябре, а к октябрю он может вырасти до 40%, если не удастся добыть артефакты.',
            scenarios: [
                { title: 'Базовый (70%)',
                desc: 'Никаких новых вторжений в сентябре. Объект 226 помогает добыть 3–4 Ок Эндера. Укрепляется оборона вокруг портала. «Орден Доблести» выделяет дополнительные ресурсы на исследование. Ситуация остаётся под контролем.' },
                { title: 'Повторное вторжение (20%)',
                desc: 'Эндер-Существа наносят новый удар, но уже по другому городу (предположительно, Нудоград или Смехоград). Частичная эвакуация, разрушения локального масштаба. Объект 226 вступает в бой, но потери исчисляются тысячами. Порталу наносится дополнительный урон.' },
                { title: 'Раскол «Ордена» (30%) — это дополнительный риск',
                desc: 'Выход Безликих или Отстранённых из «Ордена» из-за торговых споров может ослабить оборонительный потенциал. Без их технологий закрытие портала становится практически невозможным. Это повышает вероятность вторжения до 50%.' }
            ]
        }, {
            title: '📉 Экономика',
            summary: 'Дефицит руды и ресурсов, рост цен на 2–3% в месяц',
            detail: 'Уход Шахтёров из «Ордена Доблести» 29 августа создал серьёзный дефицит руды, ископаемых и стратегических ресурсов. Шахтёры, контролировавшие крупные подземные шахты, обеспечивали до 40% потребностей в металлах и редких элементах. Их уход привёл к разрыву цепочек поставок, что особенно ударило по оборонной промышленности и строительству. Безликие ввели пошлины на импорт, но это лишь усугубило ситуацию. Инфляция ускорилась: цены на сталь выросли на 15% за последнюю неделю августа, на топливо — на 8%. Тусовщики, несмотря на снятие санкций, не могут восполнить дефицит, так как их экономика разрушена войной. Серости предлагают посредничество, но переговоры зашли в тупик. Экономисты прогнозируют, что в сентябре инфляция составит 2–3% в месяц, а при отсутствии компромисса — до 5%. Особенно критичной ситуация станет для строительства Arion, которому требуются огромные объёмы металла и энергоносителей.',
            scenarios: [
                { title: 'Базовый (65%)',
                desc: 'Постепенное восстановление торговли между оставшимися членами «Ордена». Цены на ресурсы умеренно растут (2–3% в месяц). Шахтёры начинают ограниченные поставки после первых переговоров. Инфляция остаётся контролируемой.' },
                { title: 'Рост цен (25%)',
                desc: 'Дефицит руды ускоряет инфляцию до 5% в месяц. Строительство Arion приостанавливается из-за нехватки металла. Безликие вводят чрезвычайные пошлины, что вызывает недовольство и новые расколы. Экономика входит в штопор.' },
                { title: 'Стагнация (10%)',
                desc: 'Затишье в войне Смертомолей и успешное закрытие портала снижают спрос на ресурсы. Цены падают на 5–10%. Однако дефицит руды сохраняется из-за ухода Шахтёров, поэтому падение цен не компенсирует потери объёмов.' }
            ]

        // ============================================================
        //  ГРАФИК НЕФТИ (с подписями значений, первая точка видна)
        // ============================================================

        function renderOilChart() {
            const ctx = document.getElementById('oilChart').getContext('2d');
            const labels = oilData.map(d => d.month);
            const values = oilData.map(d => d.value);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Цена нефти',
                        data: values,
                        borderColor: '#ff1493',
                        backgroundColor: 'rgba(255,20,147,0.15)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#ff1493',
                        pointRadius: 6,
                        borderWidth: 2.5,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Добавляем отступы, чтобы первая точка (0) была видна
                    layout: {
                        padding: {
                            top: 20,
                            bottom: 20,
                            left: 10,
                            right: 10
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: ctx => ctx.parsed.y + ' USD/барр.' } },
                        // кастомный плагин для подписей значений над точками
                        afterDraw: function(chart) {
                            const meta = chart.getDatasetMeta(0);
                            const data = chart.data.datasets[0].data;
                            const ctx2 = chart.ctx;
                            ctx2.save();
                            ctx2.font = '12px Inter, sans-serif';
                            ctx2.textAlign = 'center';
                            ctx2.textBaseline = 'bottom';
                            meta.data.forEach((element, index) => {
                                const value = data[index];
                                if (value !== undefined) {
                                    const x = element.x;
                                    const y = element.y - 10;
                                    ctx2.fillStyle = '#8ab4d4';
                                    ctx2.fillText(value, x, y);
                                }
                            });
                            ctx2.restore();
                        }
                    },
                    scales: {
                        y: {
                            min: -30, // небольшой отрицательный отступ, чтобы точка 0 не обрезалась
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            ticks: { color: '#6a8a9e', stepSize: 200 }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { color: '#6a8a9e' }
                        }
                    }
                }
            });
        }

        // ============================================================
        //  ПРОГНОЗЫ
        // ============================================================

        function renderForecasts() {
            const container = document.getElementById('forecastGrid');
            container.innerHTML = '';

            forecasts.forEach((f) => {
                const item = document.createElement('div');
                item.className = 'forecast-item';

                const title = document.createElement('div');
                title.className = 'f-title';
                title.innerHTML = `${f.title} <span class="f-toggle">▼</span>`;
                title.addEventListener('click', function() {
                    const detail = item.querySelector('.f-detail');
                    const toggle = this.querySelector('.f-toggle');
                    detail.classList.toggle('open');
                    toggle.classList.toggle('open');
                });
                item.appendChild(title);

                const summary = document.createElement('div');
                summary.className = 'f-summary';
                summary.textContent = f.summary;
                item.appendChild(summary);

                const detail = document.createElement('div');
                detail.className = 'f-detail';
                // Основной текст
                const mainDesc = document.createElement('div');
                mainDesc.style.marginBottom = '12px';
                mainDesc.textContent = f.detail;
                detail.appendChild(mainDesc);

                // Сценарии
                f.scenarios.forEach(s => {
                    const sc = document.createElement('div');
                    sc.className = 'scenario';
                    sc.innerHTML = `
                        <div class="s-title">${s.title}</div>
                        <div class="s-desc">${s.desc}</div>
                    `;
                    detail.appendChild(sc);
                });

                item.appendChild(detail);
                container.appendChild(item);
            });
        }

        // ============================================================
        //  ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        function init() {
            // Время в шапке
            function updateHeaderTime() {
                const now = new Date();
                document.getElementById('headerTime').textContent = now.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            updateHeaderTime();
            setInterval(updateHeaderTime, 60000);

            // Нефть
            renderOilChart();

            // Прогнозы
            renderForecasts();
        }

        document.addEventListener('DOMContentLoaded', init);

        // ============================================================
        //  VERSION: v1.2.1
        // ============================================================
    </script>
</body>
</html>
